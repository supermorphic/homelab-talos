[extend]
useDefault = true

[[allowlists]]
description = "Public Go module checksums (also scanned in staged diff input)"
regexTarget = "line"
regexes = [
  '''(?m)^(?:[ +]|@@ -[0-9]+(?:,[0-9]+)? \+[0-9]+(?:,[0-9]+)? @@ )?k8s\.io/api v0\.35\.6 h1:phPzP79F3kcONsD2TzmDiITNCV6/1Z5U3CCEcjtsXzI=$''',
  '''(?m)^(?:[ +]|@@ -[0-9]+(?:,[0-9]+)? \+[0-9]+(?:,[0-9]+)? @@ )?k8s\.io/apimachinery v0\.35\.6 h1:ASSpfmmsOArKb2Hsu8gGlIcbIcEMVTboI3FfsfYuQ8k=$''',
  '''(?m)^(?:[ +]|@@ -[0-9]+(?:,[0-9]+)? \+[0-9]+(?:,[0-9]+)? @@ )?k8s\.io/apiserver v0\.35\.6 h1:VWYg2S0wlAmN3URFpVeuLa4PP2RCpTFg1nvlUHOy2C8=$''',
  '''(?m)^(?:[ +]|@@ -[0-9]+(?:,[0-9]+)? \+[0-9]+(?:,[0-9]+)? @@ )?golang\.org/x/oauth2 v0\.30\.0 h1:dnDm7JmhM45NNpd8FDDeLhK6FwqbOf4MLCM9zb1BOHI=$''',
]
