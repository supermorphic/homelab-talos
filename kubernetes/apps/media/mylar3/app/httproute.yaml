---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mylar3
  namespace: media
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Mylar3"
    gethomepage.dev/description: "Comics"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=mylar3"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "mylar-3.svg"
    gethomepage.dev/href: "https://mylar3.lab.supermorphic.com"
    gethomepage.dev/widget.type: "mylar"
    gethomepage.dev/widget.url: "http://mylar3.media.svc.cluster.local:8090"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_MYLAR3_API_KEY}}"
    gethomepage.dev/widget.fields: '["series","issues","wanted"]'
spec:
  hostnames:
    - mylar3.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    # Manual release searches wait between provider queries and can take minutes.
    - matches:
        - method: GET
          path:
            type: Exact
            value: /choose_specific_download
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - group: ""
          kind: Service
          name: mylar3
          port: 8090
          weight: 1
    - backendRefs:
        - group: ""
          kind: Service
          name: mylar3
          port: 8090
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
