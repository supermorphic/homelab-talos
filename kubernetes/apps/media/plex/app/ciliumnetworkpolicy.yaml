---
# Observed containment for Plex. The ingress allow-list is derived from the initial
# Hubble capture plus the designed identities observation cannot supply; the capture
# basis and the deliberate SSDP/UPnP multicast block are recorded in
# docs/specs/008-plex-relay-sonos.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plex
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
            app.kubernetes.io/name: homepage
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: tautulli
        # Missed by the initial capture; Seerr had zero forwarded flows to Plex.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: seerr
        # Also missed by the initial capture, for the same reason Seerr was: the capture
        # exercised playback clients, not the import pipeline. Each of these has a Plex
        # Media Server connection under Settings -> Connect, which posts a library-update
        # request to 32400 when media is imported or upgraded. That is event-driven, so a
        # capture window with no import observes nothing. Lidarr was measured being denied
        # (354 events, zero forwarded flows); Sonarr and Radarr were silent only because
        # they imported nothing during the window. All three are admitted together rather
        # than one at a time as each is discovered.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: lidarr
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    # Off-cluster ingress for the operator-created WAN DNAT. The Exposure and
    # containment design in docs/specs/013-plex-direct-remote-access.md accepts
    # `world:32400` as the publishing cost; it does not separately address LAN
    # reachability. `world` is every address outside the cluster CIDR, so as an
    # observed consequence of that mechanism, this also admits LAN clients to the
    # LoadBalancer address. Scoped to 32400 alone: no other port is reachable
    # off-cluster.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            # Publishing requires Plex to reach its OWN public address on the port it
            # publishes: it GETs https://<wan>.<hash>.plex.direct:32400/identity and marks
            # itself Not Published if that fails. Verified by testing both ports from the
            # pod — 443 forwarded, 32400 DENIED — which is why no plex.direct connection
            # was ever published. This is egress only; ingress still admits 32400 alone.
            - port: "32400"
              protocol: TCP
