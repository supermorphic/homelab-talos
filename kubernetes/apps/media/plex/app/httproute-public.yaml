---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex-public
  namespace: media
spec:
  hostnames:
    - plex.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: networking-public
      name: public
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: plex
          port: 32400
      # Same reason as the internal route: Envoy's default 15s route timeout is a
      # whole-response deadline that resets long Plex transfers. Disabled here so
      # the public plane behaves identically; the stream idle timeout still applies.
      timeouts:
        request: 0s
