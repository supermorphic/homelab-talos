---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbit-manage
  namespace: flux-system
spec:
  dependsOn:
    - name: media-storage
    - name: qbittorrent
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/media/qbit-manage/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Active after the staged rollout and hardlink-safety gate. See docs/qbit-manage.md for
  # the live category-based classification, share-limit, and recycle-bin policy.
  suspend: false
  timeout: 10m
  wait: true
