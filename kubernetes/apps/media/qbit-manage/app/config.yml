# qbit_manage declarative policy — rendered into ConfigMap qbit-manage-config and copied by
# the init-config container onto the writable /config/config.yml. Reviewable plaintext: NO
# credentials live here (qbt.user/qbt.pass resolve from the SOPS Secret via !ENV at runtime).
#
# CLASSIFICATION MODEL: category-based. The public seeding policy (PR3) manages ALL torrents
# in the tv/movies categories and EXCLUDES anything tagged `tracker-private`. Safety therefore
# depends on the tracker-private mapping being COMPLETE — not on withholding a public tag — so
# an `other: tracker-public` catch-all is intentionally used here. See docs/qbit-manage.md.
#
# Rollout stages (this is PR2):
#   PR1  inert dry-run, no commands, no rules.                                    [done]
#   PR2  tag_update: true + tracker: (other -> tracker-public, private -> exclude). dry-run
#        first for a classification report; a follow-up flips dry_run: false to apply tags.
#   PR3  share_limits.public by category, excluding tracker-private. cleanup still false.
#   PR4  cleanup: true + skip_cleanup: false, after the hardlink safety proof.
#
# Command authority lives ONLY in this `commands:` block. Do not also set QBT_* command
# toggles as env — the config-vs-env precedence is undocumented, so we keep one authority.
commands:
  dry_run: true            # PR2: report only. A follow-up sets false to apply the tags.
  recheck: false
  cat_update: false        # never change categories (Sonarr/Radarr own tv/movies)
  tag_update: true         # PR2: apply the tracker: classification (tracker-public/-private)
  rem_unregistered: false  # destructive: stays off
  tag_tracker_error: false # destructive-adjacent: stays off
  rem_orphaned: false      # destructive: stays off
  tag_nohardlinks: false   # destructive-adjacent: stays off
  share_limits: false      # PR3 -> true (apply ratio/seed-time limits)
  # Global recyclebin-empty + orphaned-dir cleanup pass. Distinct from the per-group
  # share_limits cleanup. Kept true (skipped) through PR1-PR3; PR4 sets it false so the
  # recycle-bin safety window can empty.
  skip_cleanup: true

qbt:
  host: http://qbittorrent.media.svc.cluster.local:8080
  user: !ENV QBT_USER
  pass: !ENV QBT_PASS

# qbit_manage requires a top-level `directory` section at config load (it does NOT auto-fill
# this one). root_dir is the download root, matching qBittorrent's save paths under
# /data/downloads. Only filesystem features (orphaned/nohardlinks/unregistered/recyclebin) use
# it — all OFF here — so it is inert until PR4 enables the recycle bin. The pod mounts ONLY the
# downloads subpath (read-only through PR3), never /data/media.
directory:
  root_dir: /data/downloads

# Download-side recycle bin OFF in PR1-PR3 (no filesystem features active). PR4 enables it
# as a 7-day safety window and mounts only the download root (never /data/media).
recyclebin:
  enabled: false

# No `cat:` section needed: share_limits.categories (PR3) filters qBittorrent's existing
# categories directly. Confirmed at the PR1 dry-run that the pinned version runs without it.

# Tracker classification (category-based model).
#
#   SAFETY-CRITICAL — private trackers: before downloading from a newly joined private
#   tracker, add its announce HOSTNAME here mapped to tracker-private so its torrents are
#   excluded from the public policy (PR3's share_limits excludes tracker-private). Match the
#   announce host observed on a real torrent, not the Prowlarr display name. Pipe-delimit
#   multiple hosts. qBittorrent's 24h minimum-seed floor gives a grace window, and cleanup is
#   off until PR4, but register the host promptly. Example (uncomment + replace):
#   "your-private-tracker.example|another-private.example":
#     tag: tracker-private
tracker:
  # Catch-all: everything not matched above (all current public torrents) gets tracker-public.
  # This tag is cosmetic — the public policy is gated by category + tracker-private exclusion,
  # not by this tag — so a catch-all is safe here (unlike the abandoned include-list model).
  other:
    tag: tracker-public

# No `share_limits:` section yet — added in PR3 (category-based, excluding tracker-private).
