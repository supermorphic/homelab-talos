# qbit_manage declarative policy — rendered into ConfigMap qbit-manage-config and copied by
# the init-config container onto the writable /config/config.yml. Reviewable plaintext: NO
# credentials live here (qbt.user/qbt.pass resolve from the SOPS Secret via !ENV at runtime).
#
# CLASSIFICATION MODEL: category-based. The public seeding policy manages ALL torrents
# in the tv/movies categories and EXCLUDES anything tagged `tracker-private`. Two layers apply
# that tag: (a) settings.private_tag auto-tags EVERY private torrent generically, and (b) the
# tracker: map can tag specific announce hosts. Layer (a) means safety no longer depends on the
# host mapping being COMPLETE — a private torrent is excluded even from an unmapped tracker.
# An `other: tracker-public` catch-all therefore remains safe. See docs/qbit-manage.md.
#
# Command authority lives ONLY in this `commands:` block. Do not also set QBT_* command
# toggles as env — the config-vs-env precedence is undocumented, so we keep one authority.
commands:
  dry_run: false           # the staged dry-run was reviewed; policy now applies for real
  recheck: false
  cat_update: false        # never change categories (Sonarr/Radarr own tv/movies)
  tag_update: true         # apply tracker-public/tracker-private classification
  rem_unregistered: false  # destructive: stays off
  tag_tracker_error: false # destructive-adjacent: stays off
  rem_orphaned: false      # destructive: stays off
  tag_nohardlinks: false   # destructive-adjacent: stays off
  share_limits: true       # apply the category-based ratio/seed-time limits below
  # Global recyclebin-empty + orphaned-dir cleanup pass. False so the recycle bin
  # actually empties after its retention window. (orphaned removal stays off via rem_orphaned.)
  skip_cleanup: false

qbt:
  host: http://qbittorrent.media.svc.cluster.local:8080
  user: !ENV QBT_USER
  pass: !ENV QBT_PASS

# qbit_manage requires a top-level `directory` section at config load (it does NOT auto-fill
# this one). root_dir is the download root, matching qBittorrent's save paths under
# /data/downloads. Only filesystem features (orphaned/nohardlinks/unregistered/recyclebin) use
# it. The pod mounts ONLY the downloads subpath, never /data/media.
directory:
  root_dir: /data/downloads

# Download-side recycle bin with a 7-day safety window. When cleanup removes a
# torrent, qbit_manage MOVES its download-side data to <root_dir>/.RecycleBin (a rename on the
# same SMB filesystem — the shared inode is untouched, so the /data/media hardlink is
# unaffected immediately). The name is only unlinked after empty_after_x_days, and even then
# the library file survives as the remaining hardlink (proven: inodes 934/952, links=2).
recyclebin:
  enabled: true
  empty_after_x_days: 7
  save_torrents: false

# Generic private-torrent safety net (host-independent). During tag_update, qbit_manage's
# private_tag applies `tracker-private` to EVERY torrent whose metadata marks it private —
# no announce host has to be known first. Because the public share-limit group EXCLUDES
# tracker-private, any private torrent (including one from a newly joined tracker not yet in
# the tracker: map) is automatically kept out of the public ratio/stop/cleanup policy. This
# only ever ADDS an exclusion; it can never subject a torrent to the public policy. Explicit
# per-tracker mappings below are still used to apply tracker-specific tags/groups, but
# protection no longer depends on the map being complete first.
settings:
  private_tag: tracker-private

# No `cat:` section needed: share_limits.categories filters qBittorrent's existing
# categories directly. The pinned version was validated to run without it.

# Tracker classification (category-based model).
#
#   SAFETY-CRITICAL — private trackers: the settings.private_tag net above already excludes
#   EVERY private torrent from the public policy generically, so registering a host is no longer
#   required just to avoid the public ratio/stop/cleanup path (public cleanup is now active).
#   Still add a newly joined tracker's announce HOSTNAME here when it needs a tracker-specific
#   tag or share-limit group (e.g. a dedicated policy). Match the announce host observed on a
#   real torrent, not the Prowlarr display name. Use a YAML list for multiple tags, or
#   pipe-delimit multiple hosts in one key. Example (uncomment + replace):
#   "your-private-tracker.example":
#     tag:
#       - tracker-private
tracker:
  # Catch-all: everything not matched above (all current public torrents) gets tracker-public.
  # This tag is cosmetic — the public policy is gated by category + tracker-private exclusion,
  # not by this tag — so a catch-all is safe here (unlike the abandoned include-list model).
  other:
    tag: tracker-public

# Category-based share limits. The single `public` group matches every torrent in the
# tv/movies categories and EXCLUDES anything tagged tracker-private (the safety gate — a
# private torrent never gets these limits). Torrents with no matching group keep qBittorrent's
# (disabled) defaults, i.e. seed indefinitely.
#
# Behavior (verify against live observation): a torrent is actioned once BOTH ratio >= 1.5 and
# seed time >= 24h are met, OR unconditionally at 7 days. `share_limit_action: Stop` PAUSES the
# torrent when its limit is reached (required by the qBittorrent 5.2.x API; do not inherit the
# implicit default). Cleanup is enabled only after the completed hardlink-survival proof.
share_limits:
  public:
    priority: 100
    categories:
      - movies
      - tv
    exclude_any_tags:
      - tracker-private
    max_ratio: 1.5
    min_seeding_time: 1d
    max_seeding_time: 7d
    share_limit_action: Stop
    # Remove eligible public torrents. Download-side data goes to the recycle bin
    # (recoverable 7d); the /data/media hardlink survives. Never touches tracker-private.
    cleanup: true
