# FlareSolverr (headless-Chromium Cloudflare solver) via the bjw-s app-template chart.
# STATELESS, in-cluster only: no config PVC, no HTTPRoute, no VPN. Prowlarr uses it as a
# per-indexer Indexer Proxy (http://flaresolverr.media.svc.cluster.local:8191) to reach
# Cloudflare-protected indexers (e.g. 1337x). Experimental: Cloudflare actively counters
# FlareSolverr, so a Ready pod does not guarantee any given indexer works.
#
# securityContext note: the upstream image runs `USER flaresolverr`, which is a NON-NUMERIC
# username (UID 1000 / GID 1000, home /app — verified from the image's /etc/passwd).
# Kubernetes cannot verify a non-numeric USER against runAsNonRoot and refuses to start the
# container (CreateContainerConfigError), so we MUST pin the numeric UID. We pin the image's
# OWN uid/gid 1000 (NOT the repo-default 568, which would break Chrome's /app dirs), so the
# container both passes non-root admission and keeps its files correctly owned. Chromium
# needs writable profile/temp dirs, so readOnlyRootFilesystem stays off; it gets a
# memory-backed /dev/shm.
controllers:
  flaresolverr:
    type: deployment
    strategy: RollingUpdate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.0
        env:
          TZ: America/Denver
          LOG_LEVEL: info
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          # GET / returns 200 + {"msg":"FlareSolverr is ready!"} once Chrome self-tests.
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8191
              periodSeconds: 10
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8191
              periodSeconds: 30
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8191
              # Chrome install self-test can be slow on first boot.
              periodSeconds: 5
              failureThreshold: 30
service:
  app:
    controller: flaresolverr
    ports:
      http:
        port: 8191
persistence:
  # Memory-backed /dev/shm so Chromium does not exhaust the default 64Mi tmpfs.
  dshm:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    globalMounts:
      - path: /dev/shm
