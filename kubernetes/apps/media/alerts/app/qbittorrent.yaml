---
# Reactive critical alerts for a down ProtonVPN tunnel and a repeating Gluetun liveness
# fallback. Gatus exports the control-server status check as
# gatus_results_endpoint_success (1=up, 0=down). The restart-loop rule independently
# catches the partial failure where Gluetun still reports status=running but cannot
# reacquire a forwarded port and its container-level fallback does not recover it.
# Gluetun's firewall keeps qBittorrent fail-closed throughout.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qbittorrent-vpn
  namespace: monitoring
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  groups:
    - name: qbittorrent-vpn
      rules:
        - alert: QbittorrentVpnDown
          # Matched on name+group labels (robust to Gatus "key" slug formatting).
          expr: gatus_results_endpoint_success{name="qbittorrent-vpn", group="Media"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: qBittorrent ProtonVPN tunnel is down
            description: >-
              Gluetun reports the ProtonVPN tunnel is not running (Gatus health probe of
              the control server failing for >5m). qBittorrent egress is kill-switched
              (fail-closed) and downloads are paused. Check Gluetun logs and the ProtonVPN
              WireGuard credential (displayed expiry or replacement — see
              docs/guides/qbittorrent-vpn-operations.md).
        - alert: QbittorrentGluetunRestartLoop
          # A healthy liveness recovery increments this counter once. Two restarts in the
          # same 15-minute window mean the container-level fallback is repeating; because
          # it preserves the pod network namespace, operator pod recreation may be needed.
          expr: >-
            increase(kube_pod_init_container_status_restarts_total{
              namespace="media",
              pod=~"qbittorrent-.*",
              container="gluetun"
            }[15m]) >= 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: qBittorrent Gluetun liveness recovery is looping
            description: >-
              The Gluetun container restarted at least twice in 15 minutes. Its deliberately
              slow liveness fallback is not restoring a nonzero ProtonVPN forwarded port.
              qBittorrent remains fail-closed; inspect Gluetun logs and recreate the
              qBittorrent pod if a fresh network namespace is required.
        - alert: QbittorrentVpnProbeMissing
          # The health probe metric disappeared entirely (Gatus down, endpoint removed,
          # or scrape broken) — the VPN alert above is blind until this clears.
          expr: absent(gatus_results_endpoint_success{name="qbittorrent-vpn", group="Media"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: qBittorrent VPN health probe metric is missing
            description: >-
              gatus_results_endpoint_success for the qbittorrent-vpn probe is absent for
              >15m, so the QbittorrentVpnDown alert cannot fire. Check Gatus and the
              qbittorrent-gluetun-control Service.
