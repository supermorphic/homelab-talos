---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: media-alerts
spec:
  groups:
    - name: media-availability
      rules:
        - alert: MediaEndpointDown
          expr: gatus_results_endpoint_success{group="Media", name!="qbittorrent-vpn"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Media endpoint {{ $labels.name }} is down'
            description: 'The Media/{{ $labels.name }} Gatus endpoint has failed continuously for 15 minutes.'
        - alert: MediaEndpointsProbeMissing
          expr: absent(gatus_results_endpoint_success{group="Media"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: All media endpoint probe metrics are missing
            description: Gatus has exposed no Media endpoint success series for 15 minutes.
        - alert: PlexProbeMissing
          expr: absent(gatus_results_endpoint_success{group="Media", name="plex"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Plex probe metric is missing
            description: The Media/plex Gatus success series has been absent for 15 minutes.
        - alert: TautulliProbeMissing
          expr: absent(gatus_results_endpoint_success{group="Media", name="tautulli"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Tautulli probe metric is missing
            description: The Media/tautulli Gatus success series has been absent for 15 minutes.
    - name: media-persistence
      rules:
        - alert: PlexPersistentVolumeClaimNotBound
          expr: absent(kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="plex", phase="Bound"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Plex database claim is absent or unbound
            description: The media/plex PVC has not reported Bound for five minutes; Plex library state is at risk.
        - alert: TautulliPersistentVolumeClaimNotBound
          expr: absent(kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="tautulli", phase="Bound"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Tautulli database claim is absent or unbound
            description: The media/tautulli PVC has not reported Bound for five minutes; watch history persistence is at risk.
    - name: media-integration-health
      rules:
        - alert: ProwlarrNativeHealthApiUnavailable
          expr: gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Prowlarr authenticated health API is unavailable
            description: >-
              The authenticated Prowlarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
        - alert: SonarrNativeHealthApiUnavailable
          expr: gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Sonarr authenticated health API is unavailable
            description: >-
              The authenticated Sonarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
        - alert: RadarrNativeHealthApiUnavailable
          expr: gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Radarr authenticated health API is unavailable
            description: >-
              The authenticated Radarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
        - alert: LidarrNativeHealthApiUnavailable
          expr: gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Lidarr authenticated health API is unavailable
            description: >-
              The authenticated Lidarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
        - alert: SeerrSonarrServiceReadFailed
          expr: gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Seerr cannot read its selected Sonarr service
            description: >-
              The authenticated Gatus read-through through Seerr has failed for 15 minutes. Seerr cannot read its selected Sonarr service. This does not prove that a Seerr request, download, or import failed.
        - alert: SeerrRadarrServiceReadFailed
          expr: gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Seerr cannot read its selected Radarr service
            description: >-
              The authenticated Gatus read-through through Seerr has failed for 15 minutes. Seerr cannot read its selected Radarr service. This does not prove that a Seerr request, download, or import failed.
        - alert: MediaIntegrationProbeMissing
          expr: |
            absent(gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"})
            or absent(gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"})
            or absent(gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"})
            or absent(gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"})
            or absent(gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"})
            or absent(gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Media integration probe {{ $labels.name }} is missing'
            description: 'The Media Integration/{{ $labels.name }} Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.'
    # Detection for Plex's off-cluster port on 32400. Why each expression is shaped the
    # way it is — the flag="SYN" filter, the source regex, the flows-per-connection
    # ratio and its floor, the two absent() companions, and every threshold — is
    # recorded in docs/runbooks/plex-remote-access-detection.md. Read it before editing
    # any rule below.
    - name: plex-remote-access
      rules:
        - alert: PlexRemoteConnectionFlood
          expr: |
            sum(rate(hubble_tcp_flags_total{destination="media/plex", source=~".*reserved:world.*", flag="SYN"}[5m])) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Off-cluster connection rate to Plex is abnormally high
            description: Off-cluster clients opened more than 5 connections per second to Plex for 5 minutes.
        - alert: PlexRemoteConnectionRateElevated
          expr: |
            sum(rate(hubble_tcp_flags_total{destination="media/plex", source=~".*reserved:world.*", flag="SYN"}[10m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Off-cluster connection rate to Plex is elevated
            description: Off-cluster clients opened more than 1 connection per second to Plex for 10 minutes, which is above any plausible legitimate remote load.
        - alert: PlexRemoteProbeSurge
          expr: |
            (
              sum(rate(hubble_flows_processed_total{destination="media/plex", source=~".*reserved:world.*"}[10m]))
              /
              sum(rate(hubble_tcp_flags_total{destination="media/plex", source=~".*reserved:world.*", flag="SYN"}[10m]))
            ) < 3
            and
            sum(rate(hubble_tcp_flags_total{destination="media/plex", source=~".*reserved:world.*", flag="SYN"}[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Off-cluster connections to Plex are carrying almost no traffic
            description: Off-cluster clients opened connections to Plex that carried fewer than 3 flows each for 10 minutes, which is what scanning looks like.
        - alert: PlexRemoteFlowMetricsMissing
          expr: absent(hubble_flows_processed_total{destination="media/plex"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Hubble flow metrics for Plex are missing
            description: No Hubble flow series for Plex has been present for 15 minutes, so remote-access detection is blind.
        - alert: PlexRemoteTcpMetricsMissing
          expr: absent(hubble_tcp_flags_total{destination="media/plex"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Hubble TCP flag metrics for Plex are missing
            description: No Hubble TCP flag series for Plex has been present for 15 minutes, so both remote-access detection rules are blind.
