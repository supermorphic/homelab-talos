# qBittorrent behind Gluetun (ProtonVPN WireGuard) in one Pod. All of qBittorrent's
# internet traffic egresses through the VPN or is dropped (Gluetun firewall kill switch).
# Gluetun is a native sidecar (restartPolicy: Always) with a startup probe on its control
# server, so qBittorrent only starts after the tunnel+firewall are up (fail-closed at
# boot). Only Gluetun holds NET_ADMIN + /dev/net/tun; qBittorrent cannot alter routes.
# See docs/specs/006-media-stack-architecture.md and docs/guides/protonvpn-gluetun.md.
controllers:
  qbittorrent:
    type: deployment
    strategy: Recreate
    pod:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      # Native sidecar: restartPolicy Always + a startup probe gate qBittorrent.
      gluetun:
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.1
        restartPolicy: Always
        env:
          VPN_SERVICE_PROVIDER: protonvpn
          VPN_TYPE: wireguard
          # Pin server selection to Sweden's port-forwarding-capable P2P servers.
          # The WireGuard key is account-scoped (works on any Proton server), so the
          # pin lives here as non-secret config, not in the .conf/secret; Gluetun
          # reselects within Sweden if a server is retired.
          VPN_PORT_FORWARDING: "on"
          PORT_FORWARD_ONLY: "on"
          SERVER_COUNTRIES: Sweden
          # Allow the WebUI (8080) and the control server (8000) in via the Pod
          # interface. 8000 lets Gatus poll the no-auth health route for the reactive
          # VPN-down alert; mutating control routes still require the apikey.
          FIREWALL_INPUT_PORTS: "8000,8080"
          # FIREWALL_OUTBOUND_SUBNETS left unset on purpose — Cilium DNATs Service->Pod
          # before Gluetun's egress firewall, so at most the pod CIDR is ever needed.
          # Add it only if a required flow proves necessary (watch the firewall logs).
          # Control server auth: no-auth health role + apikey for mutating routes.
          HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
          WIREGUARD_PRIVATE_KEY:
            valueFrom:
              secretKeyRef:
                name: protonvpn
                key: WIREGUARD_PRIVATE_KEY
          # ProtonVPN forwarded port -> qBittorrent listen port on each (re)connect.
          # DOWN resets it first (qBittorrent reconnect bug). Gluetun's {{PORT}} and
          # {{VPN_INTERFACE}} (=tun0) are escaped as {{ "{{PORT}}" }} so app-template's
          # Helm `tpl` pass emits them literally for Gluetun to substitute at runtime.
          # Uses qBittorrent's localhost-auth bypass — no credentials for the in-pod call.
          VPN_PORT_FORWARDING_UP_COMMAND: |-
            /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{ "{{PORT}}" }},\"current_network_interface\":\"{{ "{{VPN_INTERFACE}}" }}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
          VPN_PORT_FORWARDING_DOWN_COMMAND: |-
            /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /v1/vpn/status
                port: 8000
              # Up to 5 min for the tunnel + firewall to come up.
              periodSeconds: 5
              failureThreshold: 60
          # Deliberately-slow k8s fallback for the case Gluetun's own HEALTH_RESTART_VPN
          # can't self-heal in place: after a tunnel interruption Gluetun sometimes
          # reconnects the data plane but its DoT healthcheck keeps cycling, so it stays
          # status=running and never reacquires the forwarded port. The forwarded port is
          # the direct service-health signal; public-IP discovery is only a one-shot
          # metadata fetch and can be empty on an otherwise working tunnel. This liveness
          # restarts the gluetun container only after ~5 min of running with no forwarded
          # port — long enough that a normal flap (Gluetun self-heals in seconds) never
          # trips it. It reads the control-server apikey from the mounted config. Only an
          # explicitly stopped VPN reports healthy; unreadable, unknown, transitional, and
          # crashed states fail so a hung control server cannot disable the fallback.
          # NOTE: whether a *container* restart clears the DoT cycle (vs needing a fresh
          # pod/netns) is unvalidated live — see docs/guides/protonvpn-gluetun.md; the
          # QbittorrentGluetunRestartLoop alerts if this fallback repeats without recovery.
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    key=$(sed -n 's/^apikey *= *"\(.*\)".*/\1/p' /gluetun/auth/config.toml);
                    [ -n "$key" ] || exit 1;
                    s=$(wget -qO- -T 5 --header "X-API-Key: $key" http://127.0.0.1:8000/v1/vpn/status 2>/dev/null) || exit 1;
                    echo "$s" | grep -q '"status":"stopped"' && exit 0;
                    echo "$s" | grep -q '"status":"running"' || exit 1;
                    pf=$(wget -qO- -T 5 --header "X-API-Key: $key" http://127.0.0.1:8000/v1/portforward 2>/dev/null) || exit 1;
                    echo "$pf" | grep -Eq '"port":[1-9][0-9]*'
              # Runs only after the startup probe succeeds. ~5 min of sustained
              # running-but-no-forwarded-port before a container restart.
              periodSeconds: 30
              timeoutSeconds: 12
              failureThreshold: 10
          readiness: { enabled: false }
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.2.3
        env:
          TZ: America/Denver
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 568
          runAsGroup: 568
          capabilities:
            drop: ["ALL"]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v2/app/version
                port: 8080
              periodSeconds: 10
              failureThreshold: 3
          liveness: { enabled: false }
          startup: { enabled: false }
service:
  # Single app-template service so it renders as `qbittorrent` (the HTTPRoute backend).
  # Gluetun's control port 8000 is exposed via a standalone Service manifest
  # (service-gluetun-control.yaml) to avoid app-template suffixing this one to
  # `qbittorrent-app`.
  app:
    controller: qbittorrent
    ports:
      http:
        port: 8080
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    # Survive a full app teardown (like Plex's config).
    annotations:
      helm.sh/resource-policy: keep
    advancedMounts:
      qbittorrent:
        app:
          - path: /config
  data:
    type: persistentVolumeClaim
    existingClaim: media-data
    advancedMounts:
      qbittorrent:
        app:
          - path: /data
  tun:
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
    advancedMounts:
      qbittorrent:
        gluetun:
          - path: /dev/net/tun
  gluetun-auth:
    type: secret
    name: protonvpn
    advancedMounts:
      qbittorrent:
        gluetun:
          - path: /gluetun/auth/config.toml
            subPath: config.toml
