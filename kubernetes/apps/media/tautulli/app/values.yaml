# Tautulli provides Plex analytics and watch history over the Plex API. It is config-only:
# the retained /config PVC holds SQLite state, and no Plex or shared-media claim is mounted.
# Plex Logs is therefore intentionally unavailable. UID 568 write access is confirmed at rollout.
controllers:
  tautulli:
    type: deployment
    strategy: Recreate
    pod:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/tautulli
          tag: 2.17.2
        env:
          TZ: America/Denver
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status
                port: 8181
              periodSeconds: 10
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status
                port: 8181
              periodSeconds: 30
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status
                port: 8181
              periodSeconds: 5
              failureThreshold: 30
service:
  app:
    controller: tautulli
    ports:
      http:
        port: 8181
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    annotations:
      helm.sh/resource-policy: keep
    globalMounts:
      - path: /config
