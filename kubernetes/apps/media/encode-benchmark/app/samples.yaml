---
# The mounted payload is JSON, not YAML. The runtime image provides jq but not
# yq, so the benchmark scripts must read this file with jq; shipping it as JSON
# is what makes that possible without adding a YAML parser to the image.
#
# runtime.requiredCommands lists every external command the runtime scripts
# invoke. The capability probe reports the full missing set from it in one run,
# and the offline sandbox contracts execute the scripts against exactly these
# commands, so an undeclared dependency fails in CI rather than on a node.
#
# runtime.optionalCommands is report-only. The probe records which of these the
# image provides and never fails on an absent one; they exist so that when a
# required command is missing, the same run answers what could replace it.
apiVersion: v1
kind: ConfigMap
