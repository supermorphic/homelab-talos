---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ./priorityclass.yaml
  - ./samples.yaml
configMapGenerator:
  - name: encode-benchmark-scripts
    files:
      - contract.sh=scripts/contract.sh
      - probe.sh=scripts/probe.sh
      - runmeta.sh=scripts/runmeta.sh
      - benchmark.sh=scripts/benchmark.sh
      - quality-evidence.sh=scripts/quality-evidence.sh
generatorOptions:
  labels:
    app.kubernetes.io/name: encode-benchmark
