---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: encode-benchmark
  labels:
    app.kubernetes.io/name: encode-benchmark
spec:
  groups:
    - name: encode-benchmark
      rules:
        - alert: EncodeBenchmarkJobFailed
          expr: >-
            kube_job_status_failed{
              namespace="media",
              job_name=~"encode-benchmark-.*"
            } > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Encoding benchmark Job {{ $labels.job_name }} failed
            description: >-
              Job {{ $labels.job_name }} failed. Inspect the run with
              `mise exec -- just kube encode-benchmark-results <run-id>`.
        - alert: EncodeBenchmarkJobCompleted
          expr: >-
            kube_job_status_succeeded{
              namespace="media",
              job_name=~"encode-benchmark-.*"
            } > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Encoding benchmark Job {{ $labels.job_name }} completed
            description: >-
              Job {{ $labels.job_name }} completed. Review the run with
              `mise exec -- just kube encode-benchmark-results <run-id>`.
