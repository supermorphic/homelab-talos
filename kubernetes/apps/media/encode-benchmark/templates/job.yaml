---
apiVersion: batch/v1
kind: Job
metadata:
  name: encode-benchmark-template
  namespace: media
  labels:
    app.kubernetes.io/name: encode-benchmark
    homelab-talos/benchmark-dispatch: template
    homelab-talos/benchmark-run: template
    homelab-talos/benchmark-mode: template
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 129600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encode-benchmark
        homelab-talos/benchmark-dispatch: template
        homelab-talos/benchmark-run: template
        homelab-talos/benchmark-mode: template
    spec:
      automountServiceAccountToken: false
      priorityClassName: encode-benchmark-background
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [plex]
      containers:
        - name: benchmark
          image: docker.io/linuxserver/ffmpeg@sha256:4a4ed3a9242b51ab7821c611b4101a6a7dd72517f7f19e3a7b1833cae5020ecb
          command: [/scripts/benchmark.sh, template]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 2
              memory: 2Gi
              ephemeral-storage: 105Gi
              gpu.intel.com/i915: 1
            limits:
              cpu: 8
              memory: 8Gi
              ephemeral-storage: 110Gi
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: media
              mountPath: /media
              subPath: media/movies
              readOnly: true
            - name: out
              mountPath: /out
              subPath: benchmark
            - name: scratch
              mountPath: /scratch
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: samples
              mountPath: /config/samples.json
              subPath: samples.json
              readOnly: true
            - name: image-evidence
              mountPath: /provenance
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: out
          persistentVolumeClaim:
            claimName: media-data
        - name: scratch
          emptyDir:
            sizeLimit: 105Gi
        - name: scripts
          configMap:
            name: encode-benchmark-scripts-d6ddc44bm8
            defaultMode: 0555
        - name: samples
          configMap:
            name: encode-benchmark-samples
            items:
              - key: samples.json
                path: samples.json
        - name: image-evidence
          configMap:
            name: encode-benchmark-image-template
            optional: true
            items:
              - key: image.json
                path: image.json
