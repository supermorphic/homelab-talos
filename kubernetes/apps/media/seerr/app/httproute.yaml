---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: media
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media requests"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=seerr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "seerr.svg"
    gethomepage.dev/href: "https://seerr.lab.supermorphic.com"
    # Live widget uses Seerr's API key from Homepage's SOPS Secret
    # (homepage-seerr). Blank until `just repo homepage-seerr-secrets` runs.
    # Default fields (pending/approved/completed) — no field override.
    gethomepage.dev/widget.type: "seerr"
    gethomepage.dev/widget.url: "http://seerr.media.svc.cluster.local:5055"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
spec:
  hostnames:
    - seerr.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: 5055
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
