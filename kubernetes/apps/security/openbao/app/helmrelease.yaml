apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  chart:
    spec:
      chart: openbao
      version: 0.29.6
      sourceRef:
        kind: HelmRepository
        name: openbao
  interval: 1h
  releaseName: openbao
  install:
    disableWait: true
  timeout: 15m
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
