apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./serviceaccount.yaml
  - ./pdb.yaml
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: openbao-values
    namespace: openbao
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
