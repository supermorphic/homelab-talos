apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: openbao-reader-desired
    namespace: openbao
    files:
      - desired.json
  - name: openbao-reader-policies
    namespace: openbao
    files:
      - operator.json=policies/operator.json
      - backup.json=policies/backup.json
      - acceptance.json=policies/acceptance.json
      - config-reader.json=policies/config-reader.json
      - agent-profiles.json=policies/agent-profiles.json
