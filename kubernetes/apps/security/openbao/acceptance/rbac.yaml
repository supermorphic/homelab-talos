---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issued-reader
  namespace: openbao-acceptance
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-unapproved
  namespace: openbao-acceptance
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-tokenrequest
  namespace: openbao-acceptance
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [openbao-issued-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-tokenrequest
  namespace: openbao-acceptance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-tokenrequest
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-canary-reader
  namespace: openbao-acceptance
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openbao-canary]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-canary-reader
  namespace: openbao-acceptance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-canary-reader
subjects:
  - kind: ServiceAccount
    name: openbao-issued-reader
    namespace: openbao-acceptance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-acceptance
  namespace: openbao-acceptance
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issued-reader
  namespace: openbao-acceptance-wrong
automountServiceAccountToken: false
