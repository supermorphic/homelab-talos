apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-config-reader
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-config-reader
  namespace: openbao
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: openbao-config-reader}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openbao-config-reader}
    spec:
      serviceAccountName: openbao-config-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reader
          image: python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
          command: [python, -B, -m, scripts.openbao.exporter]
          workingDir: /reader
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          ports:
            - {name: metrics, containerPort: 9399}
          readinessProbe:
            tcpSocket: {port: metrics}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /reader/scripts/openbao, readOnly: true}
            - {name: desired, mountPath: /desired, readOnly: true}
            - {name: policies, mountPath: /desired/policies, readOnly: true}
            - {name: identity, mountPath: /identity, readOnly: true}
      volumes:
        - name: code
          configMap: {name: openbao-reader-code}
        - name: desired
          configMap: {name: openbao-reader-desired}
        - name: policies
          configMap: {name: openbao-reader-policies}
        - name: identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao-config-verification
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-config-reader
  namespace: openbao
  labels: {app.kubernetes.io/name: openbao-config-reader}
spec:
  selector: {app.kubernetes.io/name: openbao-config-reader}
  ports:
    - {name: metrics, port: 9399, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao-config-reader
  namespace: openbao
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: openbao-config-reader}
  endpoints:
    - {port: metrics, path: /metrics, interval: 1m}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-config-reader
  namespace: openbao
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: openbao-config-reader}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: "9399", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports: [{port: "8200", protocol: TCP}]
