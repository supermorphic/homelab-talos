---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portainer
  namespace: portainer
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Portainer"
    gethomepage.dev/description: "Read-only Kubernetes runtime visibility"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "portainer.svg"
    gethomepage.dev/href: "https://portainer.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=portainer"
spec:
  hostnames:
    - portainer.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: portainer
          port: 9000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
