---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portainer
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
    - name: internal-gateway
    - name: kube-prometheus-stack
    - name: longhorn
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/monitoring/portainer/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Staged suspended. The operator runs `just bootstrap portainer`; after live
  # acceptance a follow-up PR flips this to false and adds the Gatus probe.
  suspend: true
  timeout: 10m
  wait: true
