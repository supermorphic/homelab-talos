---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      annotations:
        # Roll the pod when the ntfy widget token rotates: sops-hash is
        # `git hash-object homepage-ntfy.sops.yaml`, stamped by `just repo ntfy-identity`.
        # (Named sops-hash, not *-secret-*, so gitleaks does not flag the blob hash.)
        sops-hash: "bdc1eae298928f309760b7fef47a15b5f3743f7e"
        # Roll the pod when the Portainer widget token changes. The guarded
        # Homepage Portainer Secret writer stamps the encrypted blob revision.
        homepage-portainer-sops-hash: "58e54581cc4a050be953188b6e56fdcd779cda9f"
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.lab.supermorphic.com
            # Grafana widget credentials (optional: the pod starts without the
            # Secret; the widget stays blank until `just repo homepage-grafana-secrets`).
            - name: HOMEPAGE_VAR_GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: homepage-grafana
                  key: username
                  optional: true
            - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-grafana
                  key: password
                  optional: true
            # Plex widget token (optional: widget blank until `just repo homepage-plex-secrets`).
            - name: HOMEPAGE_VAR_PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-plex
                  key: token
                  optional: true
            # Portainer widget API key (optional: widget blank until
            # `just repo homepage-portainer-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_PORTAINER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-portainer
                  key: apiKey
                  optional: true
            # ntfy widget token (optional: widget blank until
            # `just repo ntfy-identity ensure homepage` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-ntfy
                  key: token
                  optional: true
            # Prowlarr widget API key (optional: widget blank until
            # `just repo homepage-prowlarr-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-prowlarr
                  key: apiKey
                  optional: true
            # qBittorrent widget WebUI credential (optional: widget blank until
            # `just repo homepage-qbittorrent-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-qbittorrent
                  key: username
                  optional: true
            - name: HOMEPAGE_VAR_QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-qbittorrent
                  key: password
                  optional: true
            # Sonarr widget API key (optional: widget blank until
            # `just repo homepage-sonarr-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-sonarr
                  key: apiKey
                  optional: true
            # Radarr widget API key (optional: widget blank until
            # `just repo homepage-radarr-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-radarr
                  key: apiKey
                  optional: true
            # Lidarr widget API key (optional: widget blank until
            # `just repo homepage-lidarr-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-lidarr
                  key: apiKey
                  optional: true
            # Seerr widget API key (optional: widget blank until
            # `just repo homepage-seerr-secrets` creates the encrypted Secret).
            - name: HOMEPAGE_VAR_SEERR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-seerr
                  key: apiKey
                  optional: true
            - name: HOMEPAGE_VAR_TAUTULLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-tautulli
                  key: apiKey
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: custom-icons
              mountPath: /app/public/icons/allure.svg
              subPath: allure.svg
              readOnly: true
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: custom-icons
          configMap:
            name: homepage-icons
            items:
              - key: allure.svg
                path: allure.svg
        - name: logs
          emptyDir: {}
