# alertmanager-ntfy: a stateless community bridge that turns Alertmanager webhooks into
# ntfy messages. Deployed in the ntfy namespace via the bjw-s app-template chart. Config
# is split: non-secret routing/templates from the alertmanager-ntfy-config ConfigMap, the
# ntfy publisher token from the SOPS alertmanager-ntfy-auth Secret. No PVC (RollingUpdate).
controllers:
  alertmanager-ntfy:
    type: deployment
    strategy: RollingUpdate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Roll the pod when the config or the token changes (the binary reads its config
        # only at startup). config-hash = git hash-object config.yml; sops-hash =
        # git hash-object auth.sops.yaml, stamped by `just repo alertmanager-ntfy-secrets`.
        config-hash: "770fcf8118334be79c8fecedcd945a29d33e1755"
        sops-hash: "55fa9704c2d9f1bd105ce6b9f5d9d23fa3ee32e1"
    containers:
      app:
        image:
          repository: ghcr.io/alexbakker/alertmanager-ntfy
          tag: "1.2.1"
        args:
          - --configs
          - /config/config.yml,/auth/auth.yml
        env:
          TZ: America/Denver
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          # No HTTP health endpoint; a TCP check proves the webhook listener is up.
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              periodSeconds: 10
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              periodSeconds: 30
              failureThreshold: 5
          startup:
            enabled: false
service:
  app:
    controller: alertmanager-ntfy
    ports:
      http:
        port: 8000
persistence:
  config:
    type: configMap
    name: alertmanager-ntfy-config
    globalMounts:
      - path: /config
        readOnly: true
  auth:
    type: secret
    name: alertmanager-ntfy-auth
    globalMounts:
      - path: /auth
        readOnly: true
