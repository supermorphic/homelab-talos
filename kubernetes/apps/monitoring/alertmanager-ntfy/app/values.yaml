# alertmanager-ntfy: a stateless community bridge that turns Alertmanager webhooks into
# ntfy messages. Deployed in the ntfy namespace via the bjw-s app-template chart. Config
# is split: non-secret routing/templates from the alertmanager-ntfy-config ConfigMap, the
# ntfy publisher token from the auth.yml key of the canonical SOPS ntfy-secret (the
# adapter shares the ntfy namespace, so one Secret serves both pods). No PVC (RollingUpdate).
controllers:
  alertmanager-ntfy:
    type: deployment
    strategy: RollingUpdate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Roll the pod when the config or the token changes (the binary reads its config
        # only at startup). config-hash = git hash-object config.yml; sops-hash =
        # git hash-object of the canonical ntfy secret.sops.yaml (which carries auth.yml),
        # stamped by `just repo ntfy-identity`.
        config-hash: "60e2b9c5dc299ee5aa38253265ab69c4f6bb56b6"
        sops-hash: "1bde80fa91807b861efc5df6397e0039e8900709"
    containers:
      app:
        image:
          repository: ghcr.io/alexbakker/alertmanager-ntfy
          tag: "1.2.1"
        args:
          - --configs
          - /config/config.yml,/auth/auth.yml
        env:
          TZ: America/Denver
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        probes:
          # No HTTP health endpoint; a TCP check proves the webhook listener is up.
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              periodSeconds: 10
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8000
              periodSeconds: 30
              failureThreshold: 5
          startup:
            enabled: false
service:
  app:
    controller: alertmanager-ntfy
    ports:
      http:
        port: 8000
persistence:
  config:
    type: configMap
    name: alertmanager-ntfy-config
    globalMounts:
      - path: /config
        readOnly: true
  # Only the auth.yml key is projected from the canonical ntfy-secret; the NTFY_AUTH_*
  # keys stay out of this pod's filesystem.
  auth:
    type: secret
    name: ntfy-secret
    items:
      - key: auth.yml
        path: auth.yml
    globalMounts:
      - path: /auth
        readOnly: true
