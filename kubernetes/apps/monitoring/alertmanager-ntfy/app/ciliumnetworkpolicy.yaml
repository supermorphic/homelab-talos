---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-ntfy
  namespace: ntfy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  ingress:
    # Only Alertmanager (monitoring namespace) may post webhooks to :8000. This hop has
    # no basic auth; the network policy is its access control.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Kubelet TCP liveness/readiness probes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Publish to the in-namespace ntfy server.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
