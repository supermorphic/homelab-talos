---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-kube-state-metrics
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-state-metrics
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      # Pinned to the exact kube-state-metrics chart bundled by kube-prometheus-stack
      # 87.19.0 (KSM app v2.19.1), so the CustomResourceStateMetrics schema matches the
      # bundled exporter and a future consolidation stays a like-for-like move.
      version: 8.0.0
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  releaseName: flux-kube-state-metrics
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-values
      valuesKey: values.yaml
