---
# Minimal RBAC for the dedicated Flux kube-state-metrics exporter: list/watch ONLY the
# Decision-9 Flux resource kinds it turns into gotk_resource_info. No wildcards, and no
# notification/image API groups (not exported). The chart runs with rbac.create: false and
# binds this ClusterRole to its ServiceAccount (flux-kube-state-metrics, from
# fullnameOverride).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-kube-state-metrics
  labels:
    app.kubernetes.io/name: flux-kube-state-metrics
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-kube-state-metrics
  labels:
    app.kubernetes.io/name: flux-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: flux-kube-state-metrics
    namespace: monitoring
