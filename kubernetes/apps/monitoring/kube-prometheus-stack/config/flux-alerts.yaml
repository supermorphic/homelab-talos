---
# Flux reconciliation alerting. Readiness comes from gotk_resource_info, exported by the
# dedicated flux-kube-state-metrics instance — Flux v2.9.2 no longer exposes the per-object
# gotk_reconcile_condition controller metric, so it must not be used. Controller/target
# scrape failure is covered by the active KPS general.rules "TargetDown" alert, so no
# controller-down rule is defined here. Prometheus discovers this rule cluster-wide
# (ruleSelectorNilUsesHelmValues: false); severity "warning" routes to the ntfy "homelab"
# topic via the existing Alertmanager -> alertmanager-ntfy path (no routing change).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  namespace: monitoring
  labels:
    app.kubernetes.io/name: flux
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxReconciliationFailure
          expr: >-
            gotk_resource_info{
              customresource_kind=~"Kustomization|HelmRelease|GitRepository|OCIRepository|HelmRepository",
              ready!="True",
              suspended!="true"
            } == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux {{ $labels.customresource_kind }}
              {{ $labels.exported_namespace }}/{{ $labels.name }} is failing to reconcile
            description: >-
              The Flux {{ $labels.customresource_kind }}
              {{ $labels.exported_namespace }}/{{ $labels.name }} has not reported Ready=True
              for more than 15 minutes, so its desired state may no longer be reconciling.
              Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
              repository) and rendered manifests. Intentionally suspended resources are
              excluded.
        - alert: FluxResourceMetricsMissing
          expr: >-
            absent(gotk_resource_info{customresource_kind="Kustomization"})
            or absent(gotk_resource_info{customresource_kind="HelmRelease"})
            or absent(gotk_resource_info{customresource_kind="GitRepository"})
            or absent(gotk_resource_info{customresource_kind="OCIRepository"})
            or absent(gotk_resource_info{customresource_kind="HelmRepository"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux {{ $labels.customresource_kind }} resource-state metrics are missing
            description: >-
              gotk_resource_info has contained no {{ $labels.customresource_kind }} series for
              more than 15 minutes, so reconciliation failures for that resource kind are
              undetectable. Check the flux-kube-state-metrics Deployment, its ServiceMonitor,
              custom-resource configuration, and its RBAC (CRD discovery plus list/watch on
              the Flux APIs).
