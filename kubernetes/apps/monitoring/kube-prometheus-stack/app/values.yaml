# kube-prometheus-stack sized for the three-node Talos cluster (32 GB RAM/node,
# Longhorn block storage) — every Raspberry-Pi-5 constraint from the legacy repo
# is raised here. Talos does not expose kube-proxy (Cilium replaces it) or the
# controller-manager/scheduler/etcd metrics remotely, so those scrape targets and
# their alert rules are disabled to avoid false "down" alerts.
crds:
  enabled: true

kubeProxy:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false

alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 256Mi
  # First real receiver/route: forward critical+warning to the alertmanager-ntfy adapter
  # (in the ntfy namespace), which reshapes each alert into an ntfy message and routes by
  # severity (critical -> critical topic, warning -> homelab). Alertmanager still owns
  # grouping, dedup, inhibition, repeat intervals, and resolved notifications. Everything
  # else (incl. Watchdog) stays on the chart's null receiver.
  config:
    route:
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: ntfy
          matchers:
            - severity =~ "critical|warning"
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: http://alertmanager-ntfy.ntfy.svc.cluster.local:8000/hook
            send_resolved: true
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: ["namespace", "alertname"]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: ["namespace", "alertname"]
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: ["namespace"]

grafana:
  # Grafana's persistent-storage setup should not rely on overlapping
  # RollingUpdate pods. Use Recreate so that, during Deployment updates, the old
  # Grafana pod terminates before its replacement is created.
  deploymentStrategy:
    type: Recreate
    # Clear the API-defaulted object using the HelmRelease's client-side merge.
    # Explicit null alone is insufficient with server-side apply.
    rollingUpdate: null
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    size: 10Gi
    accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  grafana.ini:
    server:
      root_url: https://grafana.lab.supermorphic.com
      serve_from_sub_path: false

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 30d
    retentionSize: 45GiB
    walCompression: true
    # Scrape every ServiceMonitor/PodMonitor/Rule in the cluster, not only the
    # chart-labeled ones (the Pi build restricted this to save memory).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Shadow-collect Flux resource state while the dedicated exporter remains the
  # sole production alert source. Keep the bundled standard collectors enabled.
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
  rbac:
    # Incremental CRD discovery and Flux list/watch access; retain the chart's
    # existing standard kube-state-metrics authority.
    extraRules:
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list", "watch"]
      - apiGroups: ["kustomize.toolkit.fluxcd.io"]
        resources: ["kustomizations"]
        verbs: ["list", "watch"]
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        resources: ["helmreleases"]
        verbs: ["list", "watch"]
      - apiGroups: ["source.toolkit.fluxcd.io"]
        resources: ["gitrepositories", "ocirepositories", "helmrepositories"]
        verbs: ["list", "watch"]
  prometheus:
    monitor:
      http:
        metricRelabelings:
          - action: replace
            sourceLabels: [__name__]
            regex: gotk_resource_info
            targetLabel: __name__
            replacement: gotk_candidate_resource_info

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
