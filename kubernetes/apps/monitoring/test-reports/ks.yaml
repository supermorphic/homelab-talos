---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: test-reports
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
    - name: internal-gateway
    - name: kube-prometheus-stack
    - name: longhorn
  interval: 1h
  path: ./kubernetes/apps/monitoring/test-reports/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Activated after guarded bootstrap, sanitized publication, and the retained
  # report/PVC pod-recreation proof. Git now preserves that accepted live state.
  suspend: false
  timeout: 10m
  wait: true
