---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-reports
  namespace: test-reports
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Test Reports"
    gethomepage.dev/description: "Retained test evidence"
    gethomepage.dev/group: "Monitoring & Testing"
    gethomepage.dev/icon: "/icons/allure.svg"
    gethomepage.dev/href: "https://tests.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=test-reports"
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://test-reports.test-reports.svc.cluster.local:8080/api/homepage.json"
    gethomepage.dev/widget.refreshInterval: "300000"
    gethomepage.dev/widget.mappings.0.field: "latest"
    gethomepage.dev/widget.mappings.0.label: "LATEST"
    gethomepage.dev/widget.mappings.1.field: "last_run"
    gethomepage.dev/widget.mappings.1.label: "LAST RUN"
    gethomepage.dev/widget.mappings.1.format: "relativeDate"
    gethomepage.dev/widget.mappings.2.field: "last_failure"
    gethomepage.dev/widget.mappings.2.label: "LAST FAILURE"
    gethomepage.dev/widget.mappings.2.format: "relativeDate"
spec:
  hostnames:
    - tests.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: test-reports
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
