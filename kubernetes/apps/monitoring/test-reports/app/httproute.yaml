---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-reports
  namespace: test-reports
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Test Reports"
    gethomepage.dev/description: "Persistent operator-published test results"
    gethomepage.dev/group: "Monitoring & Testing"
    gethomepage.dev/icon: "/icons/allure.svg"
    gethomepage.dev/href: "https://tests.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=test-reports"
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://test-reports.test-reports.svc.cluster.local:8080/api/homepage.json"
    gethomepage.dev/widget.refreshInterval: "300000"
    gethomepage.dev/widget.display: "dynamic-list"
    gethomepage.dev/widget.mappings.items: "items"
    gethomepage.dev/widget.mappings.name: "name"
    gethomepage.dev/widget.mappings.label: "end"
    gethomepage.dev/widget.mappings.limit: "6"
    gethomepage.dev/widget.mappings.format: "relativeDate"
    gethomepage.dev/widget.mappings.target: "https://tests.lab.supermorphic.com{path}"
spec:
  hostnames:
    - tests.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: test-reports
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
