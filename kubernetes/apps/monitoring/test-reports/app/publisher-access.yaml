---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-report-publisher-test-reports
  namespace: test-reports
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [test-reports]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-report-publisher-test-reports
  namespace: test-reports
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-report-publisher-test-reports
subjects:
  - kind: ServiceAccount
    name: homelab-report-publisher
    namespace: kube-system
