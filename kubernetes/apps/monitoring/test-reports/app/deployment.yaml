---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-reports
  namespace: test-reports
  labels:
    app.kubernetes.io/name: test-reports
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: test-reports
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-reports
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-storage
          image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          command:
            - /bin/sh
            - /opt/test-reports/bootstrap-storage.sh
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /opt/test-reports
              readOnly: true
            - name: reports
              mountPath: /srv
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          args:
            - caddy
            - run
            - --config
            - /opt/test-reports/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /opt/test-reports
              readOnly: true
            - name: reports
              mountPath: /srv
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: test-reports-config
            defaultMode: 0555
        - name: reports
          persistentVolumeClaim:
            claimName: test-reports
        - name: tmp
          emptyDir: {}
