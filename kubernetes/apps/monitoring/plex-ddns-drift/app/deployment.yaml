---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-ddns-drift
  namespace: monitoring
  labels:
    app.kubernetes.io/name: plex-ddns-drift
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-ddns-drift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex-ddns-drift
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          command:
            - /bin/sh
            - /opt/plex-ddns-drift/check.sh
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /opt/plex-ddns-drift
              readOnly: true
            - name: metrics
              mountPath: /metrics
        - name: server
          image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          args: [caddy, run, --config, /opt/plex-ddns-drift/Caddyfile, --adapter, caddyfile]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /opt/plex-ddns-drift
              readOnly: true
            - name: metrics
              mountPath: /metrics
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: plex-ddns-drift-config
            defaultMode: 0555
        - name: metrics
          emptyDir: {}
        - name: tmp
          emptyDir: {}
