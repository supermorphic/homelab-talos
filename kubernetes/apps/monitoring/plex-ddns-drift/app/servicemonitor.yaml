---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: plex-ddns-drift
  namespace: monitoring
  labels:
    app.kubernetes.io/name: plex-ddns-drift
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-ddns-drift
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
