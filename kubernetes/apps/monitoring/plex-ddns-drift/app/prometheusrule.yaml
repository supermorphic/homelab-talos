---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: plex-ddns-drift
  namespace: monitoring
  labels:
    app.kubernetes.io/name: plex-ddns-drift
spec:
  groups:
    - name: plex-ddns-drift
      rules:
        - alert: PlexDdnsAddressMismatch
          expr: plex_ddns_check_success == 1 and plex_ddns_addresses_match == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Plex public DNS address drift detected
            description: The public Plex A record does not match the Internet-observed WAN address.
        - alert: PlexDdnsCheckFailed
          expr: plex_ddns_check_success == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Plex DDNS comparison failed
            description: The Plex DDNS collector could not obtain one valid IPv4 address from both comparison endpoints.
        # A wedged collector keeps serving its last metrics file, so check_success
        # stays 1 and absent() stays false. Only the success timestamp going stale
        # distinguishes a hung comparison from a healthy one.
        - alert: PlexDdnsCheckStale
          expr: plex_ddns_last_success_unixtime > 0 and time() - plex_ddns_last_success_unixtime > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Plex DDNS comparison has stopped updating
            description: The Plex DDNS collector recorded no successful comparison in the last 30 minutes while continuing to serve metrics.
        - alert: PlexDdnsMetricsMissing
          expr: absent(plex_ddns_check_success)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Plex DDNS metrics are missing
            description: Prometheus has not received the Plex DDNS comparison metrics.
