---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ntfy"
    gethomepage.dev/description: "Private cluster notifications"
    gethomepage.dev/group: "Monitoring & Testing"
    gethomepage.dev/icon: "ntfy.svg"
    gethomepage.dev/href: "https://ntfy.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=ntfy"
    # Latest critical notification only. Homepage authenticates directly to the
    # in-cluster Service with a dedicated read-only ntfy token.
    gethomepage.dev/widget.type: "ntfy"
    gethomepage.dev/widget.url: "http://ntfy.ntfy.svc.cluster.local"
    gethomepage.dev/widget.topic: "critical"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_NTFY_TOKEN}}"
    gethomepage.dev/widget.fields: '["title","priority","lastReceived"]'
spec:
  # LAN browser/CLI path. Off-site delivery uses the private Tailscale Ingress
  # (tailscale-ingress.yaml); the canonical iOS/base-url host is the tailnet FQDN.
  hostnames:
    - ntfy.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - kind: Service
          name: ntfy
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
