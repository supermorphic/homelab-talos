---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./helmrepository.yaml
  - ./httproute.yaml
  - ./media-integration-api-keys.sops.yaml
  # Task 9 adds ./n8n-canary.sops.yaml only after the operator-managed ciphertext exists.
  - ./namespace.yaml
configMapGenerator:
  - name: gatus-values
    namespace: gatus
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
