---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./helmrepository.yaml
  - ./httproute.yaml
  - ./media-integration-api-keys.sops.yaml
  - ./n8n-canary.sops.yaml
  - ./namespace.yaml
configMapGenerator:
  - name: n8n-test-request-helpers-v1
    namespace: gatus
    files:
      - test-helpers/n8n-restore-request.mjs
      - test-helpers/automation-data-restore-request.mjs
    options:
      immutable: true
  - name: gatus-values
    namespace: gatus
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
