# Retained activation source for the n8n public webhook E2E check. Copy these exact values
# into values.yaml only while the encrypted gatus/n8n-canary Secret and public webhook
# route are active through the reviewed Git procedure in docs/guides/n8n-operations.md.
env:
  GATUS_N8N_CANARY_TOKEN:
    valueFrom:
      secretKeyRef:
        name: n8n-canary
        key: token
config:
  endpoints:
    - name: n8n-webhook-e2e
      group: Automation
      url: "https://hooks.lab.supermorphic.com/webhook/platform-canary"
      method: POST
      interval: 5m
      headers:
        Content-Type: application/json
        X-Platform-Canary: "${GATUS_N8N_CANARY_TOKEN}"
      body: '{"correlation":"gatus-platform-canary"}'
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == ok"
        - "[BODY].correlation == gatus-platform-canary"
        - "len([BODY].executionId) > 0"
      ui:
        hide-errors: true
