# Retained canonical endpoint for first-install staging and verifier fixtures.
# Active values.yaml enrolls this endpoint with durable NocoDB activation.
config:
  endpoints:
    - name: nocodb
      group: Automation
      url: "https://nocodb.lab.supermorphic.com/api/v1/health"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
