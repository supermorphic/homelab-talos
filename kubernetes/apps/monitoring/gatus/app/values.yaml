# Gatus uptime dashboard. Endpoints probe the real user-facing HTTPS URLs behind
# the internal gateway (via Pi-hole DNS), so a green board proves the full path.
# Storage is in-memory: uptime history resets on restart (fine for a status board)
# and avoids a ReadWriteOnce PVC that deadlocks RollingUpdate on Longhorn.
env:
  TZ: America/Denver
  GATUS_PROWLARR_API_KEY:
    valueFrom:
      secretKeyRef:
        name: gatus-media-integration-api-keys
        key: prowlarr_api_key
  GATUS_SONARR_API_KEY:
    valueFrom:
      secretKeyRef:
        name: gatus-media-integration-api-keys
        key: sonarr_api_key
  GATUS_RADARR_API_KEY:
    valueFrom:
      secretKeyRef:
        name: gatus-media-integration-api-keys
        key: radarr_api_key
  GATUS_LIDARR_API_KEY:
    valueFrom:
      secretKeyRef:
        name: gatus-media-integration-api-keys
        key: lidarr_api_key
  GATUS_SEERR_API_KEY:
    valueFrom:
      secretKeyRef:
        name: gatus-media-integration-api-keys
        key: seerr_api_key
  GATUS_N8N_CANARY_TOKEN:
    valueFrom:
      secretKeyRef:
        name: n8n-canary
        key: token
serviceMonitor:
  enabled: true
  interval: 1m
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
ingress:
  enabled: false
gateway:
  enabled: false
config:
  # Serve the Prometheus /metrics endpoint the chart's ServiceMonitor scrapes
  # (without this, /metrics 404s and the gatus target shows down in Prometheus).
  metrics: true
  storage:
    type: memory
  ui:
    title: "Homelab Status"
    header: "Homelab"
  endpoints:
    # Observability UIs (black-box, through the internal gateway).
    - name: grafana
      group: Observability
      url: "https://grafana.lab.supermorphic.com/api/health"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[BODY].database == ok"
    - name: prometheus
      group: Observability
      url: "https://prometheus.lab.supermorphic.com/-/healthy"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: alertmanager
      group: Observability
      url: "https://alertmanager.lab.supermorphic.com/-/healthy"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # Persistent test-report index (black-box through internal DNS, TLS, Gateway,
    # Caddy, and the retained Longhorn-backed current generation).
    - name: test-reports
      group: Observability
      url: "https://tests.lab.supermorphic.com/"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # Platform edge: proves the Envoy gateway data path + wildcard TLS end to end.
    - name: echo
      group: Platform
      url: "https://echo.lab.supermorphic.com/"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # Portainer operational UI (black-box through internal DNS, TLS, Gateway,
    # Service, and the isolated application pod).
    - name: portainer
      group: Platform
      url: "https://portainer.lab.supermorphic.com/"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # ntfy notification service. Probed in-cluster because require-login is on; the
    # unauthenticated /v1/health endpoint proves the server and its storage are up.
    - name: ntfy
      group: Platform
      url: "http://ntfy.ntfy.svc.cluster.local/v1/health"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[BODY].healthy == true"
    # Longhorn UI probed in-cluster so the unauthenticated admin UI is not exposed
    # to the LAN. Longhorn engine/replica/backup health lives in Prometheus.
    - name: longhorn-ui
      group: Storage
      url: "http://longhorn-frontend.longhorn-system.svc.cluster.local/"
      interval: 2m
      conditions:
        - "[STATUS] == 200"
    # Media stack (black-box through the internal gateway). /identity is Plex's
    # unauthenticated health endpoint — proves DNS -> gateway -> Plex is serving.
    - name: plex
      group: Media
      url: "https://plex.lab.supermorphic.com/identity"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # qBittorrent VPN health: probe Gluetun's control server in-cluster (never LAN-
    # exposed). The control server answers 200 even while the tunnel is down, so the
    # body condition (status == running) is what actually detects a VPN drop. Feeds the
    # QbittorrentVpnDown critical PrometheusRule via gatus_results_endpoint_success.
    - name: qbittorrent-vpn
      group: Media
      url: "http://qbittorrent-gluetun-control.media.svc.cluster.local:8000/v1/vpn/status"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == running"
    # Active *arr automation (black-box through the internal gateway). /ping is
    # unauthenticated (no API key) and returns 200 when the app is serving. Add each
    # endpoint when its suspended rollout is accepted and activated in Git; probing
    # staged-but-absent apps creates false alarms.
    - name: prowlarr
      group: Media
      url: "https://prowlarr.lab.supermorphic.com/ping"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: sonarr
      group: Media
      url: "https://sonarr.lab.supermorphic.com/ping"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: radarr
      group: Media
      url: "https://radarr.lab.supermorphic.com/ping"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: lidarr
      group: Media
      url: "https://lidarr.lab.supermorphic.com/ping"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: seerr
      group: Media
      url: "https://seerr.lab.supermorphic.com/api/v1/status"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: tautulli
      group: Media
      url: "https://tautulli.lab.supermorphic.com/status"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    # In-cluster only (no HTTPRoute): probe the ClusterIP Service DNS directly, like
    # qbittorrent-vpn / longhorn-ui. "UP" means the solver is alive, NOT that any
    # Cloudflare-protected indexer works.
    - name: flaresolverr
      group: Media
      url: "http://flaresolverr.media.svc.cluster.local:8191/"
      interval: 1m
      conditions:
        - "[STATUS] == 200"
    - name: prowlarr-native-health
      group: Media Integration
      url: "https://prowlarr.lab.supermorphic.com/api/v1/health"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_PROWLARR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
      ui:
        hide-errors: true
    - name: sonarr-native-health
      group: Media Integration
      url: "https://sonarr.lab.supermorphic.com/api/v3/health"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_SONARR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
      ui:
        hide-errors: true
    - name: radarr-native-health
      group: Media Integration
      url: "https://radarr.lab.supermorphic.com/api/v3/health"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_RADARR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
      ui:
        hide-errors: true
    - name: lidarr-native-health
      group: Media Integration
      url: "https://lidarr.lab.supermorphic.com/api/v1/health"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_LIDARR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
      ui:
        hide-errors: true
    - name: seerr-sonarr-service-read
      group: Media Integration
      url: "https://seerr.lab.supermorphic.com/api/v1/service/sonarr/0"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_SEERR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
        - "[BODY].server.id == 0"
        - "has([BODY].profiles) == true"
        - "has([BODY].rootFolders) == true"
      ui:
        hide-errors: true
    - name: seerr-radarr-service-read
      group: Media Integration
      url: "https://seerr.lab.supermorphic.com/api/v1/service/radarr/0"
      method: GET
      interval: 1m
      headers:
        X-Api-Key: "${GATUS_SEERR_API_KEY}"
      conditions:
        - "[STATUS] == 200"
        - "[BODY].server.id == 0"
        - "has([BODY].profiles) == true"
        - "has([BODY].rootFolders) == true"
      ui:
        hide-errors: true
    # External dependency cert-manager relies on for wildcard-cert renewal.
    - name: letsencrypt-acme
      group: External
      url: "https://acme-v02.api.letsencrypt.org/directory"
      interval: 10m
      conditions:
        - "[STATUS] == 200"
    - name: n8n-platform-canary
      group: Platform
      url: "https://hooks.lab.supermorphic.com/webhook/platform-canary"
      method: POST
      interval: 5m
      headers:
        Content-Type: application/json
        X-Platform-Canary: "${GATUS_N8N_CANARY_TOKEN}"
      body: '{"correlation":"gatus-platform-canary"}'
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == ok"
        - "[BODY].correlation == gatus-platform-canary"
        - "len([BODY].executionId) > 0"
      ui:
        hide-errors: true
