---
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: false
    discover_service_name: []
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
    per_stream_rate_limit: 1MB
    per_stream_rate_limit_burst: 2MB
    max_line_size: 256KB
    max_global_streams_per_user: 5000
    shard_streams:
      enabled: false
    retention_period: 336h
    max_query_lookback: 336h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClass: longhorn
    whenScaled: Retain
    whenDeleted: Retain
    enableStatefulSetAutoDeletePVC: false
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job.longhorn.io/loki-filesystem-trim: enabled
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
