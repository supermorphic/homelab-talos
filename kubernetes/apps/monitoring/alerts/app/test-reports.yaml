---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-reports
  namespace: monitoring
  labels:
    app.kubernetes.io/name: test-reports
spec:
  groups:
    - name: test-reports
      rules:
        - alert: TestReportsPersistentVolumeClaimNotBound
          expr: >-
            absent(
              kube_persistentvolumeclaim_status_phase{
                namespace="test-reports",
                persistentvolumeclaim="test-reports",
                phase="Bound"
              } == 1
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Test report archive claim is absent or unbound
            description: >-
              The test-reports/test-reports PVC has not reported Bound for more
              than five minutes. Published test evidence may be unavailable.
        - alert: TestReportsArchiveCapacityLow
          expr: >-
            (
              kubelet_volume_stats_available_bytes{
                namespace="test-reports",
                persistentvolumeclaim="test-reports"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                namespace="test-reports",
                persistentvolumeclaim="test-reports"
              }
            ) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Test report archive has less than 15% free space
            description: >-
              Retention could not keep the persistent report archive below its
              capacity threshold. Review report sizes and Longhorn capacity.
