---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-config
    - name: envoy-gateway
    - name: metallb-config
  interval: 1h
  path: ./kubernetes/apps/networking/public-gateway/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: false
  timeout: 15m
  wait: true
