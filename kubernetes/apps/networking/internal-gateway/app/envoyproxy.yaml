---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: networking
spec:
  telemetry:
    accessLog:
      settings:
        # Keep the default format for existing routes. Search URLs can contain
        # private query text, so exclude this app's authority from access logs.
        - matches:
            - '!request.host.matches("(?i)^searxng[.]lab[.]supermorphic[.]com[.]?(:[0-9]+)?$")'
          sinks:
            - type: File
              file:
                path: /dev/stdout
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      envoyPDB:
        minAvailable: 1
      envoyService:
        annotations:
          metallb.io/address-pool: internal
          metallb.io/loadBalancerIPs: 192.168.90.30
        externalTrafficPolicy: Local
        type: LoadBalancer
