---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Operator-created ingress ProxyGroup and subnet-router proxy workloads require
    # /dev/net/tun and NET_ADMIN. Scope this Pod Security exception to the tailscale
    # namespace; the label permits but does not grant those settings. See
    # docs/guides/tailscale-operator.md for the current boundary.
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
