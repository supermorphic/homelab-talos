---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Tailscale proxy Pods (operator + ProxyGroup ingress proxies) require
    # /dev/net/tun and run privileged (NET_ADMIN). Scope this exception to the
    # tailscale namespace only. Prior art: trivy-system runs enforce: privileged
    # for the same class of host-access infrastructure workload. See
    # docs/tailscale-operator.md for the rationale.
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
