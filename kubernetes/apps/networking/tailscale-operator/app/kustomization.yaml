---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./oauth.sops.yaml
configMapGenerator:
  - name: tailscale-operator-values
    namespace: tailscale
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
