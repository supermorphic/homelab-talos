---
# OAuth client credentials are supplied out-of-band via the pre-created
# `operator-oauth` Secret (oauth.sops.yaml). Leaving these empty makes the chart
# consume that Secret rather than templating credentials from values.
oauth:
  clientId: ""
  clientSecret: ""

operatorConfig:
  hostname: tailscale-operator
  defaultTags:
    - tag:k8s-operator
  podAnnotations:
    # The Operator reads its mounted OAuth client ID and secret once at startup.
    # The guarded Secret writer stamps the ciphertext revision here so Flux rolls
    # the Deployment whenever those credentials change.
    sops-hash: 9dd42bcb0cffd3e205637e787e1b227adfbab79d

# Scope guard: this deployment provides operator + ingress ProxyGroup only.
# The Kubernetes API server proxy is intentionally disabled — exposing the API
# server to the tailnet is a separate, out-of-scope decision.
apiServerProxyConfig:
  mode: "false"

proxyConfig:
  defaultTags: tag:k8s
