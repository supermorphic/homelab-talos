---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/networking/tailscale-operator/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Staged suspended: the operator-oauth Secret and the tailnet-side prerequisites
  # (OAuth client, ACL tags/grants, MagicDNS + HTTPS certs — see
  # docs/tailscale-operator.md) must exist before reconciliation. Roll out with
  # `just bootstrap tailscale-operator`, then flip to false durably.
  suspend: true
  timeout: 10m
  wait: true
