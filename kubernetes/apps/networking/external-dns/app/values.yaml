annotationFilter: external-dns.k8s.io/audience=internal
domainFilters:
  - lab.supermorphic.com
env:
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: pihole-password
  - name: SSL_CERT_FILE
    value: /etc/ssl/pihole/tls_ca.crt
extraVolumeMounts:
  - name: pihole-ca
    mountPath: /etc/ssl/pihole
    readOnly: true
extraVolumes:
  - name: pihole-ca
    configMap:
      name: pihole-ca
      items:
        - key: tls_ca.crt
          path: tls_ca.crt
gatewayNamespace: networking
interval: 1m
logFormat: json
managedRecordTypes:
  - A
policy: upsert-only
podAnnotations:
  # ExternalDNS reads the Pi-hole password and CA trust at process startup. The
  # guarded provider writers update these source revisions so either change
  # replaces the Pod. Foundation validation verifies both values.
  pihole-ca-hash: "50fe775bcf42a2ff00ff60f3e2ed6a009c53c287"
  sops-hash: "8c2ddbf4259f5314a07d50d76ff8a7b6f8147bf4"
provider:
  name: pihole
registry: noop
resources:
  requests:
    cpu: 10m
    memory: 64Mi
sources:
  - crd
  - gateway-httproute
triggerLoopOnEvent: true
extraArgs:
  gateway-name: internal
  pihole-api-version: "6"
  pihole-server: https://pi.hole
