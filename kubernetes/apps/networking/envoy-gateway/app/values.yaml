crds:
  enabled: true
deployment:
  replicas: 2
podDisruptionBudget:
  minAvailable: 1
config:
  envoyGateway:
    provider:
      type: Kubernetes
      kubernetes:
        watch:
          type: NamespaceSelector
          namespaceSelector:
            matchExpressions:
              - key: gateway.supermorphic.com/access
                operator: In
                values:
                  - internal
                  - public
