---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-platform-canary
  namespace: networking-public
spec:
  hostnames:
    - hooks.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-webhooks
      namespace: networking-public
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: n8n
          namespace: automation
          port: 5678
      matches:
        - path:
            type: Exact
            value: /webhook/platform-canary
