---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: news-graby
  namespace: flux-system
spec:
  dependsOn:
    - name: news
    - name: kube-prometheus-stack
  interval: 1h
  path: ./kubernetes/apps/news/graby/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: true
  timeout: 10m
  wait: true
