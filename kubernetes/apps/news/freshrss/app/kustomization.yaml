---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: news
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./deployment.yaml
  - ./httproute.yaml
  - ./persistentvolumeclaims.yaml
  - ./service.yaml
  - ./servicemonitor.yaml
  - ../../graby
configMapGenerator:
  - name: freshrss-scripts
    files:
      - bootstrap.php=scripts/bootstrap.php
      - ready.php=scripts/ready.php
      - refresh.sh=scripts/refresh.sh
      - start.sh=scripts/start.sh
      - live.sh=scripts/live.sh
      - backup.sh=scripts/backup.sh
      - backup-loop.sh=scripts/backup-loop.sh
      - validate-backup.sh=scripts/validate-backup.sh
      - restore.sh=scripts/restore.sh
      - metrics.php=scripts/metrics.php
      - backup-status.sh=scripts/backup-status.sh
      - extraction-inputs.sh=scripts/extraction-inputs.sh
  - name: freshrss-httpd
    files:
      - httpd.conf
  - name: freshrss-extraction-extension
    files:
      - Client.php=extensions/xExtension-CommunityExtraction/Client.php
      - Preservation.php=extensions/xExtension-CommunityExtraction/Preservation.php
      - configure.php=extensions/xExtension-CommunityExtraction/configure.php
      - extension.php=extensions/xExtension-CommunityExtraction/extension.php
      - metadata.json=extensions/xExtension-CommunityExtraction/metadata.json
generatorOptions:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  immutable: true
