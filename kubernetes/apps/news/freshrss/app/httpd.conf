ServerRoot /var/www
ServerName freshrss
Listen 8080
Listen 9090
PidFile /run/news/httpd.pid
DefaultRuntimeDir /run/news
Mutex fcntl:/run/news mpm-accept
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
GracefulShutdownTimeout 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
Include /etc/apache2/conf.d/php85-module.conf
User #1000
Group #1000
StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 4
MaxConnectionsPerChild 500
TypesConfig /etc/apache2/mime.types
ErrorLog /dev/stderr
LogLevel crit
DocumentRoot /var/www/FreshRSS/p
AllowEncodedSlashes On
php_admin_value session.save_path /tmp/news-sessions
php_admin_value upload_tmp_dir /tmp
php_admin_value sys_temp_dir /tmp
php_admin_value date.timezone UTC
php_admin_value memory_limit 128M
php_admin_flag expose_php Off
php_admin_flag display_errors Off
php_admin_flag log_errors Off
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/FreshRSS/p>
    Options FollowSymLinks
    Require all granted
    Include /var/www/FreshRSS/p/.htaccess
</Directory>
<Directory /var/www/FreshRSS/p/api>
    Include /var/www/FreshRSS/p/api/.htaccess
</Directory>
<VirtualHost *:8080>
    DocumentRoot /var/www/FreshRSS/p
</VirtualHost>
<VirtualHost *:9090>
    DocumentRoot /opt/news
    Alias /metrics /opt/news/metrics.php
    <Directory /opt/news>
        Options None
        Require all denied
        <Files metrics.php>
            Require all granted
        </Files>
    </Directory>
</VirtualHost>
