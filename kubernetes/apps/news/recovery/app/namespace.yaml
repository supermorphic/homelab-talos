---
apiVersion: v1
kind: Namespace
metadata:
  name: news-recovery-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolation
  namespace: news-recovery-test
spec:
  endpointSelector: {}
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: recovery
  namespace: news-recovery-test
spec:
  hard:
    pods: '2'
    persistentvolumeclaims: '5'
    requests.storage: 5Gi
    secrets: '1'
    configmaps: '2'
    limits.cpu: '6'
    limits.memory: 5Gi
