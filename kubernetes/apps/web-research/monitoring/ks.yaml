---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-research-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: searxng
    - name: crawl4ai-proxy
    - name: gatus
  interval: 1h
  path: ./kubernetes/apps/web-research/monitoring
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Unsuspend with the four Gatus endpoint additions after platform acceptance.
  suspend: true
  timeout: 5m
  wait: true
