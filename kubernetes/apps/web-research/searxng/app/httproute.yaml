---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "SearXNG"
    gethomepage.dev/description: "Private web search"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "searxng.svg"
    gethomepage.dev/href: "https://searxng.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=searxng"
spec:
  hostnames:
    - searxng.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: searxng
          port: 8080
