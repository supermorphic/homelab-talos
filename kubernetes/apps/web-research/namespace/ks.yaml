---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-research
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  path: ./kubernetes/apps/web-research/namespace/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: false
  timeout: 5m
  wait: true
