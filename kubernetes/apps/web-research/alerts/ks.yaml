---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-research-alerts
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
  interval: 1h
  path: ./kubernetes/apps/web-research/alerts/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Unsuspend with native Crawl4AI; select Gatus rules only after acceptance.
  suspend: true
  timeout: 5m
  wait: true
