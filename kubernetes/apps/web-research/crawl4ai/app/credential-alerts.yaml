---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crawl4ai-credentials
spec:
  groups:
    - name: crawl4ai-credentials
      rules:
        - alert: Crawl4aiCredentialRefreshDegraded
          expr: crawl4ai_credential_refresh_degraded{namespace="web-research",service="crawl4ai-health"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Crawl4AI automatic credential renewal is degraded
            description: Existing validated credentials remain usable until their usable expiry. Inspect credential agent health and issuer availability; never distribute administrative credentials to consumers.
        - alert: Crawl4aiCredentialValidationDegraded
          expr: crawl4ai_credential_validation_degraded{namespace="web-research",service="crawl4ai-health"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Crawl4AI background credential validation is degraded
            description: Background validation cannot confirm the active credential. Cached admission continues for an unexpired credential unless the backend explicitly rejects it.
        - alert: Crawl4aiCredentialUnavailable
          expr: crawl4ai_credential_ready{namespace="web-research",service="crawl4ai-health"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Crawl4AI has no usable platform credential
            description: Crawl admission fails closed while the agent automatically attempts recovery.
        - alert: Crawl4aiCredentialMetricsMissing
          expr: absent(crawl4ai_credential_ready{namespace="web-research",service="crawl4ai-health"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Crawl4AI credential health metrics are missing
            description: Check the credential agent, its ServiceMonitor, and Prometheus scrape health.
