---
apiVersion: v1
kind: Service
metadata:
  name: crawl4ai-native
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crawl4ai
  ports:
    - name: native
      port: 11235
      targetPort: native
---
apiVersion: v1
kind: Service
metadata:
  name: crawl4ai-auth
spec:
  type: ClusterIP
  # Auth and monitoring must remain reachable during cold-start token recovery.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: crawl4ai
  ports:
    - name: auth
      port: 9000
      targetPort: auth
---
apiVersion: v1
kind: Service
metadata:
  name: crawl4ai-health
  labels:
    app.kubernetes.io/name: crawl4ai-health
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: crawl4ai
  ports:
    - name: health
      port: 9001
      targetPort: health
