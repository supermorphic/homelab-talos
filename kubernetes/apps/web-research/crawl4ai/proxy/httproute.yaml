---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crawl4ai
  namespace: web-research
spec:
  parentRefs:
  - name: crawl4ai
  rules:
  - matches:
    - method: POST
      path:
        type: Exact
        value: /crawl
    backendRefs:
    - name: crawl4ai-native
      port: 11235
    timeouts:
      request: 95s
      backendRequest: 90s
