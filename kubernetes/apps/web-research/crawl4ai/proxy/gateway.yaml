---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: crawl4ai
  namespace: web-research
spec:
  gatewayClassName: internal
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: crawl4ai
