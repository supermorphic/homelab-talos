---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: crawl4ai
  namespace: web-research
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: crawl4ai
  connection:
    bufferLimit: 8Mi
    connectionLimit:
      value: 4
      maxRequestsPerConnection: 1
      maxStreamDuration: 100s
  http2:
    initialStreamWindowSize: 8Mi
    initialConnectionWindowSize: 8Mi
    maxConcurrentStreams: 1
  timeout:
    http:
      idleTimeout: 15s
