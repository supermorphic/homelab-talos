---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: crawl4ai
  namespace: web-research
spec:
  concurrency: 2
  telemetry:
    accessLog:
      disable: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: crawl4ai
        type: ClusterIP
      envoyDeployment:
        name: crawl4ai-proxy
        replicas: 1
        # The controller adds this sidecar with only a memory request by default.
        # Bound it as well so the complete Pod has a finite 320 MiB ceiling.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits:
                          memory: 64Mi
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.38.3@sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
