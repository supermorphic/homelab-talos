---
cluster:
  id: 1
  name: nuc-cluster

ipam:
  mode: kubernetes

ipv4:
  enabled: true
ipv6:
  enabled: false

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: false

operator:
  replicas: 2
  rollOutPods: true

rollOutCiliumPods: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
  # Flow-level signal for the Plex remote-access detection gate
  # (docs/specs/014-plex-remote-access-detection.md). Identity source
  # context collapses every off-cluster address to reserved:world, so the series count
  # does not grow with the number of hosts probing the port; `ip` would mint a series
  # per source address on an Internet-facing port. destinationContext is `workload`, not
  # `pod`: a pod name changes on every rollout and would mint a fresh label value each
  # time, so `pod` would still grow cardinality over the 30-day retention even though it
  # is bounded at any single instant. No serviceMonitor key belongs here: this file also
  # installs Cilium during bootstrap, before the Prometheus CRDs exist.
  metrics:
    enabled:
      - "flow:sourceContext=identity;destinationContext=workload"
      - "tcp:sourceContext=identity;destinationContext=workload"
      - "drop:sourceContext=identity;destinationContext=workload"

envoy:
  enabled: false
gatewayAPI:
  enabled: false
l2announcements:
  enabled: false
bgpControlPlane:
  enabled: false

dashboards:
  enabled: false
prometheus:
  enabled: false
