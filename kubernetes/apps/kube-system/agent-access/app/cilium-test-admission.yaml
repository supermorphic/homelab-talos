        dyn([{"fromEndpoints": [{"matchLabels": {"io.kubernetes.pod.namespace": "cilium-test-ccnp2"}}]}])})
        || (request.name == "host-firewall-egress" && variables.item.spec == {"nodeSelector": dyn({}), "egress":
        dyn([dyn({"toEntities": ["health", "kube-apiserver", "remote-node", "world"]}), dyn({"toEndpoints":
        [{"matchExpressions": [dyn({"key": dyn("name"), "operator": dyn("NotIn"), "values": dyn(["echo-other-node"])}),
        dyn({"key": "io.cilium.k8s.policy.cluster", "operator": "Exists"})]}]})])}) || (request.name == "host-firewall-ingress"
        && variables.item.spec == {"nodeSelector": dyn({}), "ingress": dyn([dyn({"fromEntities": ["health",
        "kube-apiserver", "remote-node", "world"]}), dyn({"fromEndpoints": [{"matchExpressions": [dyn({"key":
        dyn("name"), "operator": dyn("NotIn"), "values": dyn(["client"])}), dyn({"key": "io.cilium.k8s.policy.cluster",
        "operator": "Exists"})]}]})])})'
      message: Keep the complete pinned connectivity policy specification; host firewall fixtures are
        an explicit dedicated exception.
    - expression: 'request.operation == ''UPDATE'' ? object.metadata.uid == oldObject.metadata.uid : true'
      message: Preserve the existing policy identity on apply.
