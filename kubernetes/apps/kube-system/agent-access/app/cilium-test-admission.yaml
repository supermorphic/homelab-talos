apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-cilium-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - namespaces
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-cilium-connectivity'
  variables:
    - name: item
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
  validations:
    - expression: request.namespace == '' && request.subResource == '' && request.name in ['cilium-test-1','cilium-test-ccnp1','cilium-test-ccnp2']
        && variables.item.apiVersion == 'v1' && variables.item.kind == 'Namespace' && variables.item.metadata.name
        == request.name && (!has(variables.item.metadata.namespace) || variables.item.metadata.namespace
        == '') && variables.item.all(k, k in ['apiVersion','kind','metadata','spec','status']) && !has(variables.item.metadata.ownerReferences)
        && (!has(variables.item.metadata.finalizers) || variables.item.metadata.finalizers.size() == 0)
        && variables.item.spec.all(k, k == 'finalizers' && variables.item.spec[k] == ['kubernetes']) &&
        (request.operation == 'CREATE' || (has(variables.item.metadata.uid) && variables.item.metadata.uid
        != ''))
      message: Only the three registered connectivity fixture namespaces may be allocated, updated or
        removed.
    - expression: variables.item.metadata.labels['app.kubernetes.io/name'] == 'cilium-cli' && variables.item.metadata.labels['pod-security.kubernetes.io/enforce']
        == 'privileged' && variables.item.metadata.labels.all(k, k in ['app.kubernetes.io/name','pod-security.kubernetes.io/enforce']
        || (k == 'kubernetes.io/metadata.name' && variables.item.metadata.labels[k] == request.name))
        && variables.item.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$')
        && variables.item.metadata.annotations.all(k, k == 'homelab.supermorphic.com/test-run' || (k ==
        'clustermesh.cilium.io/global' && variables.item.metadata.annotations[k] == 'true'))
      message: Fixture identity, privileged connectivity mode and checked run ownership are mandatory.
    - expression: 'request.operation == ''UPDATE'' ? (oldObject.metadata.annotations[''homelab.supermorphic.com/test-run'']
        == object.metadata.annotations[''homelab.supermorphic.com/test-run''] && oldObject.metadata.annotations.all(k,
        k in object.metadata.annotations && object.metadata.annotations[k] == oldObject.metadata.annotations[k])
        && object.metadata.labels == oldObject.metadata.labels && object.metadata.all(k, k in [''resourceVersion'',''managedFields'',''annotations'']
        || (k in oldObject.metadata && object.metadata[k] == oldObject.metadata[k])) && oldObject.metadata.all(k,
        k in [''resourceVersion'',''managedFields'',''annotations''] || (k in object.metadata && object.metadata[k]
        == oldObject.metadata[k])) && object.all(k, k == ''metadata'' || (k in oldObject && object[k]
        == oldObject[k])) && oldObject.all(k, k == ''metadata'' || (k in object && object[k] == oldObject[k])))
        : true'
      message: The pinned client may only add its global-namespace annotation; existing namespace identity
        and specification remain unchanged.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-cilium-namespaces
spec:
  policyName: homelab-test-cilium-namespaces
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-cilium-ephemeral-diagnostics
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - pods/ephemeralcontainers
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-cilium-connectivity'
  variables:
    - name: before
      expression: 'has(oldObject.spec.ephemeralContainers) ? oldObject.spec.ephemeralContainers : []'
    - name: after
      expression: object.spec.ephemeralContainers
    - name: added
      expression: variables.after[variables.after.size() - 1]
    - name: source
      expression: oldObject.spec.containers.filter(c, c.name == variables.added.targetContainerName)[0]
  validations:
    - expression: request.namespace == 'kube-system' && request.subResource == 'ephemeralcontainers' &&
        request.name == oldObject.metadata.name && oldObject.metadata.namespace == 'kube-system' && oldObject.metadata.uid
        != '' && ((variables.added.targetContainerName == 'cilium-agent' && oldObject.metadata.labels['k8s-app']
        == 'cilium') || (variables.added.targetContainerName == 'tetragon' && oldObject.metadata.labels['app.kubernetes.io/name']
        == 'tetragon') || (variables.added.targetContainerName == 'spire-server' && oldObject.metadata.labels.app
        == 'spire-server'))
      message: Stopped-container diagnostics may reach only existing Cilium, Tetragon or SPIRE server
        containers in kube-system.
    - expression: 'variables.after.size() == variables.before.size() + 1 && variables.after.filter(c,
        c.name != variables.added.name) == variables.before && variables.added.name.matches(''^sysdump-[0-9]{1,10}$'')
        && variables.added.command == [''/bin/sleep'',''1d''] && variables.added.image == variables.source.image
        && (has(variables.added.env) ? variables.added.env : []) == (has(variables.source.env) ? variables.source.env
        : []) && (has(variables.added.volumeMounts) ? variables.added.volumeMounts : []) == (has(variables.source.volumeMounts)
        ? variables.source.volumeMounts : []) && has(variables.added.securityContext) == has(variables.source.securityContext)
        && (has(variables.source.securityContext) ? variables.added.securityContext == variables.source.securityContext
        : true) && variables.added.all(k, k in [''name'',''targetContainerName'',''image'',''command'',''env'',''volumeMounts'',''securityContext'']
        || (k == ''resources'' && variables.added[k] == {}) || (k == ''imagePullPolicy'' && variables.added[k]
        == ''IfNotPresent'') || (k == ''terminationMessagePath'' && variables.added[k] == ''/dev/termination-log'')
        || (k == ''terminationMessagePolicy'' && variables.added[k] == ''File'') || (k in [''stdin'',''stdinOnce'',''tty'']
        && !variables.added[k]))'
      message: Append exactly one canonical sleeping sysdump container copied from its existing source;
        preserve all earlier entries.
    - expression: object.metadata.all(k, k in ['resourceVersion','managedFields'] || (k in oldObject.metadata
        && object.metadata[k] == oldObject.metadata[k])) && oldObject.metadata.all(k, k in ['resourceVersion','managedFields']
        || (k in object.metadata && object.metadata[k] == oldObject.metadata[k])) && object.spec.all(k,
        k == 'ephemeralContainers' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == 'ephemeralContainers' || (k in object.spec && object.spec[k] == oldObject.spec[k]))
        && object.all(k, k in ['metadata','spec'] || (k in oldObject && object[k] == oldObject[k])) &&
        oldObject.all(k, k in ['metadata','spec'] || (k in object && object[k] == oldObject[k]))
      message: Keep the complete stored Pod identity, specification, status and runtime authority unchanged
        except for that appended container.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-cilium-ephemeral-diagnostics
spec:
  policyName: homelab-test-cilium-ephemeral-diagnostics
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-cilium-system-connect
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CONNECT
        resources:
          - pods/exec
          - pods/portforward
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-cilium-connectivity'
  validations:
    - expression: request.namespace == 'kube-system' && request.subResource in ['exec','portforward']
        && (request.name.matches('^cilium-[a-z0-9]{5}$') || request.name.matches('^cilium-envoy-[a-z0-9]{5}$')
        || request.name.matches('^cilium-operator-[a-z0-9]{5,10}-[a-z0-9]{5}$') || request.name.matches('^hubble-[a-z0-9]{5}$')
        || request.name.matches('^hubble-relay-[a-z0-9]{5,10}-[a-z0-9]{5}$') || request.name.matches('^clustermesh-apiserver-[a-z0-9]{5,10}-[a-z0-9]{5}$')
        || request.name.matches('^tetragon-[a-z0-9]{5}$') || request.name.matches('^spire-server-[0-9]{1,4}$')
        || request.name.matches('^sysdump-[a-z0-9]{5}$'))
      message: Cilium runtime connections may reach only registered system component and sysdump recovery
        Pod names.
    - expression: 'request.subResource == ''exec'' ? ((!has(object.stdin) || !object.stdin) && (!has(object.tty)
        || !object.tty) && ((request.name.matches(''^cilium-[a-z0-9]{5}$'') && (object.container in [''cilium-agent'']
        || object.container.matches(''^sysdump-[0-9]{1,10}$''))) || (request.name.matches(''^cilium-envoy-[a-z0-9]{5}$'')
        && (object.container in [''cilium-envoy''])) || (request.name.matches(''^cilium-operator-[a-z0-9]{5,10}-[a-z0-9]{5}$'')
        && (object.container in [''cilium-operator''])) || (request.name.matches(''^hubble-[a-z0-9]{5}$'')
        && (object.container in [''hubble''])) || (request.name.matches(''^hubble-relay-[a-z0-9]{5,10}-[a-z0-9]{5}$'')
        && (object.container in [''hubble-relay''])) || (request.name.matches(''^clustermesh-apiserver-[a-z0-9]{5,10}-[a-z0-9]{5}$'')
        && (object.container in [''apiserver'', ''kvstoremesh'', ''etcd''])) || (request.name.matches(''^tetragon-[a-z0-9]{5}$'')
        && (object.container in [''tetragon''] || object.container.matches(''^sysdump-[0-9]{1,10}$'')))
        || (request.name.matches(''^spire-server-[0-9]{1,4}$'') && (object.container in [''spire-server'']
        || object.container.matches(''^sysdump-[0-9]{1,10}$''))) || (request.name.matches(''^sysdump-[a-z0-9]{5}$'')
        && (object.container in [''cilium-agent'', ''tetragon'', ''spire-server''])))) : true'
      message: Exec permits the canonical component or recovery container without interactive input; this
        profile has privileged application runtime authority.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-cilium-system-connect
spec:
  policyName: homelab-test-cilium-system-connect
  validationActions:
    - Deny
