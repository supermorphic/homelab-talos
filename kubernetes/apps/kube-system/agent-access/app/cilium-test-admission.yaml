        || variables.item.metadata.finalizers.size() == 0) && (request.operation == 'CREATE' || (has(variables.item.metadata.uid)
        && variables.item.metadata.uid != ''))
      message: Only canonical named cluster-wide connectivity fixtures without extra ownership or runtime
        fields are permitted.
    - expression: '(request.name == "allow-egress-specific-namespace-ccnp" && variables.item.spec == {"endpointSelector":
        dyn({"matchLabels": {"io.kubernetes.pod.namespace": "cilium-test-ccnp1", "kind": "ccnp"}}), "egress":
