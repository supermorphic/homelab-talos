    - name: item
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
    - name: pod
      expression: variables.item.spec
    - name: container
      expression: variables.pod.containers[0]
  validations:
    - expression: request.operation in ['CREATE','DELETE'] && request.namespace == 'kube-system' && request.subResource
        == '' && request.name.matches('^sysdump-[a-z0-9]{5}$') && variables.item.apiVersion == 'v1' &&
        variables.item.kind == 'Pod' && variables.item.metadata.name == request.name && variables.item.metadata.generateName
        == 'sysdump-' && variables.item.metadata.namespace == request.namespace && (request.operation
        == 'CREATE' || (has(variables.item.metadata.uid) && variables.item.metadata.uid != '')) && (!has(variables.item.metadata.ownerReferences)
        || variables.item.metadata.ownerReferences.size() == 0) && (!has(variables.item.metadata.finalizers)
        || variables.item.metadata.finalizers.size() == 0)
      message: Only native generated sysdump recovery Pods in kube-system may be created or deleted; no
        Pod updates.
    - expression: variables.pod.containers.size() == 1 && (!has(variables.pod.initContainers) || variables.pod.initContainers.size()
        == 0) && (!has(variables.pod.ephemeralContainers) || variables.pod.ephemeralContainers.size()
        == 0) && variables.pod.restartPolicy == 'Never' && has(variables.pod.nodeName) && variables.pod.nodeName
        != '' && variables.container.command == ['/bin/sleep','1d'] && (!has(variables.container.args)
