        == 0) && (!has(variables.container.stdin) || !variables.container.stdin) && (!has(variables.container.tty)
        || !variables.container.tty)
      message: Retain one noninteractive native recovery sleeper on the selected source node.
    - expression: (variables.pod.serviceAccountName == 'cilium' && variables.container.name == 'cilium-agent'
        && variables.container.image.matches('^quay[.]io/cilium/cilium(:|@).+$')) || (variables.pod.serviceAccountName
        == 'tetragon' && variables.container.name == 'tetragon' && variables.container.image.matches('^quay[.]io/cilium/tetragon(:|@).+$'))
        || (variables.pod.serviceAccountName == 'spire-server' && variables.container.name == 'spire-server'
        && variables.container.image.matches('^ghcr[.]io/spiffe/spire-server(:|@).+$'))
