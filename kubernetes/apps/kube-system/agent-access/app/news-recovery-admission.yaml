      \ ||\n           (has(variables.item.data) && !has(variables.item.stringData)\
      \ && variables.item.data.size() == 6 &&\n            variables.item.data.all(k,\
      \ k in ['postgres-password','db-password','backup-password','monitoring-password','operator-password','api-password']\
      \ &&\n              variables.item.data[k].matches('^[A-Za-z0-9+/]{64}$')))))"
    message: The ephemeral Secret has only the six synthetic fixture passwords.
