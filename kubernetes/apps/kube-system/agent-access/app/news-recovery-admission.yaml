      \ ||\n             (object.container == 'database' && object.command == ['pg_ctl','--pgdata=/var/lib/postgresql/data/pgdata','--mode=fast','--no-wait','stop'])\
      \ ||\n             (object.container == 'helper' && object.command in [['sh','/opt/news/drill-helper.sh','capture'],['sh','/opt/news/drill-helper.sh','captured']]))))\
      \ &&\n          (!has(object.tty) || !object.tty) && object.stdout && object.stderr\
      \ &&\n          (request.name.endsWith('-source') ? (!has(object.stdin) || !object.stdin)\
      \ : object.stdin)"
    message: Only non-interactive fixture phase commands may execute.
---
