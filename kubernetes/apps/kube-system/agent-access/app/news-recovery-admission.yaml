  - expression: "request.namespace == 'news-recovery-test' && request.operation !=\
      \ 'UPDATE' &&\n      variables.run.matches('^[0-9a-f]{12}$') && variables.item.metadata.namespace\
      \ == request.namespace &&\n      variables.item.metadata.labels == {'homelab-talos/run-id':\
      \ dyn(variables.run), 'homelab-talos/test': dyn('news-restore-drill')} &&\n\
      \      !has(variables.item.metadata.ownerReferences) &&\n      (!has(variables.item.metadata.finalizers)\
      \ || variables.item.metadata.finalizers.size() == 0 ||\n       (variables.item.kind\
      \ == 'PersistentVolumeClaim' && variables.item.metadata.finalizers == ['kubernetes.io/pvc-protection']))\
      \ &&\n      (request.operation == 'DELETE' || !has(variables.item.metadata.annotations))\
      \ &&\n      (request.operation != 'DELETE' || (has(variables.item.metadata.uid)\
      \ && variables.item.metadata.uid != ''))"
    message: Only immutable run-owned synthetic recovery inputs are allowed.
  - expression: "variables.item.kind != 'PersistentVolumeClaim' ||\n          (variables.item.metadata.name\
      \ in [dyn(('news-drill-' + variables.run + \"-source-db\")),dyn(('news-drill-'\
      \ + variables.run + \"-source-data\")),dyn(('news-drill-' + variables.run +\
      \ \"-backups\")),dyn(('news-drill-' + variables.run + \"-restored-db\")),dyn(('news-drill-'\
      \ + variables.run + \"-restored-data\"))] &&\n           variables.item.spec.storageClassName\
      \ == 'longhorn' && variables.item.spec.accessModes == ['ReadWriteOnce'] &&\n\
      \           variables.item.spec.resources.requests == {'storage':'1Gi'} &&\n\
      \           variables.item.spec.resources.all(k, k == 'requests') && variables.item.spec.all(k,\n\
