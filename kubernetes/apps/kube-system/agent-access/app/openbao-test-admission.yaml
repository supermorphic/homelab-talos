---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-member-tunnels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CONNECT
        resources:
          - pods/portforward
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username in ['system:serviceaccount:kube-system:homelab-test-openbao-ha',
        'system:serviceaccount:kube-system:homelab-test-openbao-lifecycle']
  validations:
    - expression: |-
        request.namespace == 'openbao' && request.subResource == 'portforward' &&
        request.name in ['openbao-0', 'openbao-1', 'openbao-2'] && object.ports == [8200]
      message: HA and lifecycle tunnels may reach only the three named member API ports.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-member-tunnels
spec:
  policyName: homelab-test-openbao-member-tunnels
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-ha-eviction
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods/eviction
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-ha'
  validations:
    - expression: |-
        request.namespace == 'openbao' && request.subResource == 'eviction' &&
        request.name in ['openbao-0', 'openbao-1', 'openbao-2'] &&
        object.apiVersion == 'policy/v1' && object.kind == 'Eviction' &&
        object.metadata.name == request.name && object.metadata.namespace == request.namespace &&
        object.all(k, k in ['apiVersion', 'kind', 'metadata', 'deleteOptions']) &&
        object.metadata.all(k, k in ['name', 'namespace'] || (k == 'creationTimestamp' && object.metadata[k] == null)) &&
        object.deleteOptions.all(k, k == 'preconditions') &&
        object.deleteOptions.preconditions.size() == 2 &&
        type(object.deleteOptions.preconditions.uid) == string && object.deleteOptions.preconditions.uid != '' &&
        type(object.deleteOptions.preconditions.resourceVersion) == string && object.deleteOptions.preconditions.resourceVersion != ''
      message: HA may evict only a named member using current UID and resource version preconditions;
        preserve the API PDB enforcement.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-ha-eviction
spec:
  policyName: homelab-test-openbao-ha-eviction
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-probe-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - pods
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username in ['system:serviceaccount:kube-system:homelab-test-openbao-issuance',
        'system:serviceaccount:kube-system:homelab-test-openbao-ha']
  variables:
    - name: pod
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
    - name: issuer
      expression: request.namespace == 'openbao'
    - name: core
      expression: 'variables.issuer ? {"restartPolicy":"Never","activeDeadlineSeconds":1800,"automountServiceAccountToken":false,"enableServiceLinks":false,"serviceAccountName":"openbao","securityContext":{"runAsNonRoot":true,"runAsUser":65532,"seccompProfile":{"type":"RuntimeDefault"},"fsGroup":65532}}
        : {"restartPolicy":"Never","activeDeadlineSeconds":1800,"automountServiceAccountToken":false,"enableServiceLinks":false,"serviceAccountName":"openbao-acceptance","securityContext":{"runAsNonRoot":true,"runAsUser":65532,"seccompProfile":{"type":"RuntimeDefault"}}}'
    - name: container
      expression: '{"name":"probe","image":"python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6","command":["python","-c","import
        time; time.sleep(1800)"],"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"200m","memory":"128Mi"}}}'
    - name: sources
      expression: 'variables.issuer ? [{"secret":{"name":"openbao-issuer-token-v1","items":[{"key":"token","path":"token"}]}},{"configMap":{"name":"kube-root-ca.crt","items":[{"key":"ca.crt","path":"ca.crt"}]}}]
        : [{"serviceAccountToken":{"path":"token","expirationSeconds":600,"audience":"openbao-kubernetes-broker"}},{"configMap":{"name":"kube-root-ca.crt","items":[{"key":"ca.crt","path":"ca.crt"}]}}]'
    - name: defaults
      expression: '{"dnsPolicy":"ClusterFirst","schedulerName":"default-scheduler","terminationGracePeriodSeconds":30,"priority":0,"preemptionPolicy":"PreemptLowerPriority","hostNetwork":false,"hostPID":false,"hostIPC":false,"shareProcessNamespace":false,"hostUsers":true,"setHostnameAsFQDN":false,"initContainers":[],"ephemeralContainers":[]}'
    - name: containerDefaults
      expression: '{"imagePullPolicy":"IfNotPresent","terminationMessagePath":"/dev/termination-log","terminationMessagePolicy":"File","stdin":false,"stdinOnce":false,"tty":false}'
    - name: security
      expression: '{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}}'
  validations:
    - expression: |-
        request.subResource == '' &&
        ((variables.issuer && request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-issuance' && variables.pod.metadata.name.matches('^openbao-issuer-[0-9a-f]{16}$')) ||
        (request.namespace == 'openbao-acceptance' && variables.pod.metadata.name.matches('^openbao-acceptance-[0-9a-f]{16}$'))) &&
        variables.pod.metadata.name == request.name && variables.pod.metadata.namespace == request.namespace &&
        variables.pod.metadata.labels == {'app.kubernetes.io/name':'openbao-acceptance'} &&
        variables.pod.metadata.annotations.size() == 1 && variables.pod.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$') &&
        !has(variables.pod.metadata.ownerReferences) && (!has(variables.pod.metadata.finalizers) || variables.pod.metadata.finalizers.size() == 0) &&
        (request.operation != 'UPDATE' || (object.metadata.uid == oldObject.metadata.uid && object.metadata.labels == oldObject.metadata.labels && object.metadata.annotations == oldObject.metadata.annotations && object.spec == oldObject.spec))
      message: Only the registered acceptance and issuer probe parents, with stable ownership and specification,
        are admitted.
    - expression: |-
        variables.core.all(k, k in variables.pod.spec && variables.pod.spec[k] == variables.core[k]) &&
        variables.pod.spec.all(k, k in variables.core || k in ['containers','volumes','nodeName','tolerations','serviceAccount'] || (k in variables.defaults && variables.pod.spec[k] == variables.defaults[k])) &&
        (!has(variables.pod.spec.serviceAccount) || variables.pod.spec.serviceAccount == variables.core.serviceAccountName) &&
        (!has(variables.pod.spec.nodeName) || variables.pod.spec.nodeName == '' || (request.operation in ['UPDATE','DELETE'] && type(variables.pod.spec.nodeName) == string && variables.pod.spec.nodeName != '')) &&
        (!has(variables.pod.spec.tolerations) || (variables.pod.spec.tolerations.size() <= 2 && variables.pod.spec.tolerations.all(t, t in [
        {'key':'node.kubernetes.io/not-ready','operator':'Exists','effect':'NoExecute','tolerationSeconds':300},
        {'key':'node.kubernetes.io/unreachable','operator':'Exists','effect':'NoExecute','tolerationSeconds':300}])))
      message: Probe workload identity, scheduling, lifetime and Pod security settings are fixed.
    - expression: |-
        variables.pod.spec.containers.size() == 1 &&
        variables.container.all(k, k in variables.pod.spec.containers[0] && variables.pod.spec.containers[0][k] == variables.container[k]) &&
        variables.pod.spec.containers[0].all(k, k in variables.container || k in ['volumeMounts', 'securityContext'] || (k in variables.containerDefaults && variables.pod.spec.containers[0][k] == variables.containerDefaults[k])) &&
        variables.pod.spec.containers[0].volumeMounts.size() == 1 &&
        variables.pod.spec.containers[0].volumeMounts[0].name == 'identity' && variables.pod.spec.containers[0].volumeMounts[0].mountPath == '/identity' && variables.pod.spec.containers[0].volumeMounts[0].readOnly &&
        variables.pod.spec.containers[0].volumeMounts[0].all(k, k in ['name','mountPath','readOnly'] || (k == 'mountPropagation' && variables.pod.spec.containers[0].volumeMounts[0][k] == 'None') || (k == 'recursiveReadOnly' && variables.pod.spec.containers[0].volumeMounts[0][k] == 'Disabled')) &&
        variables.security.all(k, k in variables.pod.spec.containers[0].securityContext && variables.pod.spec.containers[0].securityContext[k] == variables.security[k]) &&
        variables.pod.spec.containers[0].securityContext.all(k, k in variables.security ||
        (k == 'privileged' && !variables.pod.spec.containers[0].securityContext.privileged) ||
        (k == 'procMount' && variables.pod.spec.containers[0].securityContext.procMount == 'Default'))
      message: Probe image, program, resources, container security and identity mount are fixed.
    - expression: |-
        variables.pod.spec.volumes.size() == 1 && variables.pod.spec.volumes[0].name == 'identity' &&
        variables.pod.spec.volumes[0].all(k, k in ['name','projected']) &&
        variables.pod.spec.volumes[0].projected.all(k, k in ['sources','defaultMode']) &&
        variables.pod.spec.volumes[0].projected.sources == variables.sources &&
        (variables.issuer ? variables.pod.spec.volumes[0].projected.defaultMode == 288 :
        (!has(variables.pod.spec.volumes[0].projected.defaultMode) || variables.pod.spec.volumes[0].projected.defaultMode == 420))
      message: Only the accepted projected workload identity or the issuer profile explicit stable issuer
        source may be mounted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-probe-pods
spec:
  policyName: homelab-test-openbao-probe-pods
  validationActions:
    - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-probe-exec
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CONNECT
        resources:
          - pods/exec
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username in ['system:serviceaccount:kube-system:homelab-test-openbao-issuance',
        'system:serviceaccount:kube-system:homelab-test-openbao-ha']
  variables:
    - name: bridge
      expression: '"\nimport http.client, json, socket, ssl, sys\nfrom pathlib import Path\ntry:\n    args
        = json.load(sys.stdin)\n    bao = args[''target''] == ''bao''\n    hostname = ''openbao.lab.supermorphic.com''
        if bao else ''kubernetes.default.svc''\n    context = ssl.create_default_context() if bao else
        ssl.create_default_context(cafile=''/identity/ca.crt'')\n    connection = http.client.HTTPSConnection(hostname,
        8200 if bao else 443, context=context, timeout=15)\n    if bao:\n        connection._create_connection
        = lambda address, timeout, source_address: socket.create_connection((''openbao.openbao.svc'',
        8200), timeout=timeout)\n    headers = {''Content-Type'': ''application/json''}\n    token = args.get(''token'')\n    if
        not bao and token is None:\n        token = Path(''/identity/token'').read_text().strip()\n    if
        token:\n        headers[''X-Vault-Token'' if bao else ''Authorization''] = token if bao else ''Bearer
        '' + token\n    headers.update(args.get(''headers'') or {})\n    payload = args.get(''payload'')\n    if
        args.get(''login''):\n        payload[''jwt''] = Path(''/identity/token'').read_text().strip()\n    connection.request(args[''method''],
        args[''path''], json.dumps(payload) if payload is not None else None, headers)\n    response =
        connection.getresponse()\n    data = response.read(1048577)\n    if len(data) > 1048576:\n        raise
        ValueError()\n    body = json.loads(data) if data and 200 <= response.status < 300 else {}\n    print(json.dumps({''status'':
        response.status, ''body'': body}))\n    connection.close()\nexcept Exception:  # noqa: BLE001
        -- Discard credential-bearing adapter exception text.\n    sys.exit(1)\n"'
    - name: claims
      expression: '"\nimport base64, json, sys\nfrom pathlib import Path\ntry:\n    token = Path(''/identity/token'').read_text().strip()\n    part
        = token.split(''.'')[1]\n    claims = json.loads(base64.urlsafe_b64decode(part + ''='' * (-len(part)
        % 4)))\n    valid = (''exp'' not in claims\n             and claims.get(''sub'') == ''system:serviceaccount:openbao:openbao''\n             and
        claims.get(''kubernetes.io/serviceaccount/secret.name'') == sys.argv[1])\n    print(json.dumps({''stable_issuer'':
        valid}))\nexcept Exception:\n    print(json.dumps({''stable_issuer'': False}))\n"'
  validations:
    - expression: |-
        request.subResource == 'exec' && object.container == 'probe' && (!has(object.tty) || !object.tty) &&
        ((request.namespace == 'openbao' && request.name.matches('^openbao-issuer-[0-9a-f]{16}$') && request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-issuance') ||
        (request.namespace == 'openbao-acceptance' && request.name.matches('^openbao-acceptance-[0-9a-f]{16}$'))) &&
        ((object.command == ['python','-c',variables.bridge] && has(object.stdin) && object.stdin) ||
        (request.namespace == 'openbao' && object.command == ['python','-c',variables.claims,'openbao-issuer-token-v1'] && (!has(object.stdin) || !object.stdin)))
      message: Probe exec admits only the canonical API bridge or issuer-claim program on registered probe
        Pods; issuer bytes remain inside the probe.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-probe-exec
spec:
  policyName: homelab-test-openbao-probe-exec
  validationActions:
    - Deny
