        && oldObject.metadata.uid != '' && oldObject.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$')
        && oldObject.metadata.labels.app == 'openbao-restore-scratch' && oldObject.metadata.ownerReferences.size()
        == 1 && oldObject.metadata.ownerReferences[0].apiVersion == 'apps/v1' && oldObject.metadata.ownerReferences[0].kind
        == 'StatefulSet' && oldObject.metadata.ownerReferences[0].name == 'scratch' && oldObject.metadata.ownerReferences[0].uid
        != '' && oldObject.metadata.ownerReferences[0].controller
