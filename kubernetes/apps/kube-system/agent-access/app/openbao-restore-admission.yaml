apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-restore-exec
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CONNECT
        resources:
          - pods/exec
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-restore'
  variables:
    - name: bridge
      expression: '"\nimport http.client, json, sys\ntry:\n    args = json.loads(sys.stdin.buffer.readline(65536))\n    connection
        = http.client.HTTPConnection(\"127.0.0.1\", 8200, timeout=30)\n    headers = {\"Content-Type\":
        \"application/json\", \"X-Vault-No-Request-Forwarding\": \"true\"}\n    if args.get(\"token\"):\n        headers[\"X-Vault-Token\"]
        = args[\"token\"]\n    if \"length\" in args:\n        headers[\"Content-Length\"] = str(args[\"length\"])\n        headers[\"Content-Type\"]
        = \"application/octet-stream\"\n        body = sys.stdin.buffer\n    else:\n        body = json.dumps(args[\"payload\"]).encode()
        if args.get(\"payload\") is not None else None\n    connection.request(args[\"method\"], \"/v1/\"
        + args[\"path\"], body, headers)\n    response = connection.getresponse()\n    data = response.read(1048577)\n    if
        len(data) > 1048576:\n        raise ValueError()\n    body = json.loads(data) if data and 200
        <= response.status < 300 else {}\n    if (response.status == 500 and args[\"method\"] == \"GET\"\n            and
        args[\"path\"] == \"auth/homelab-jwt/config\"\n            and json.loads(data) == {\"errors\":
        [''1 error occurred:\\n\\t* error initializing \"kubernetes\" provider_config: error reading service
        account token file: open /var/run/secrets/kubernetes.io/serviceaccount/token: no such file or
        directory\\n\\n'']}):\n        body = {\"provider_unavailable\": True}\n    if (response.status
        == 400 and args[\"method\"] == \"POST\"\n            and args[\"path\"] == \"auth/homelab-userpass/login/openbao-operator\"\n            and
        json.loads(data) == {\"errors\": [\"invalid username or password\"]}):\n        body = {\"authentication_failed\":
        True}\n    print(json.dumps({\"status\": response.status, \"body\": body}))\nexcept Exception:\n    sys.exit(1)\n"'
    - name: probe
      expression: '"\nimport errno, json, socket, sys\ntry:\n    targets = json.load(sys.stdin)\n    with
        socket.create_connection((\"127.0.0.1\", 8200), timeout=3):\n        pass\n    result = {\"loopback\":
        True}\n    for group, endpoints in targets.items():\n        denied = bool(endpoints)\n        for
        address, port in endpoints:\n            try:\n                with socket.create_connection((address,
        port), timeout=3):\n                    denied = False\n            except OSError as error:\n                #
        Refusal, DNS failure, and unreachable routes are not proof of\n                # enforcement.
        Only a timed-out connection meets this oracle.\n                if not isinstance(error, TimeoutError)
        and error.errno != errno.ETIMEDOUT:\n                    denied = False\n        result[group]
        = denied\n    print(json.dumps(result))\nexcept Exception:\n    sys.exit(1)\n"'
  validations:
    - expression: request.namespace == 'openbao-restore-test' && request.name == 'scratch-0' && request.subResource
        == 'exec' && object.container == 'runner' && has(object.stdin) && object.stdin && (!has(object.tty)
        || !object.tty) && object.command in [[dyn('python'),dyn('-c'),dyn(variables.bridge)],[dyn('python'),dyn('-c'),dyn(variables.probe)]]
      message: Only fixed loopback restore and isolation programs may execute in the unmounted scratch
        runner.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-restore-exec
spec:
  policyName: homelab-test-openbao-restore-exec
  validationActions:
    - Deny
