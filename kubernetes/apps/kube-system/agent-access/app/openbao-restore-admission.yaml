apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-restore-private
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - secrets
          - configmaps
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-restore'
  variables:
    - name: item
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
    - name: configPattern
      expression: '"^disable_mlock = true\nraw_storage_endpoint = true\naudit \"file\" \"homelab\" \\{\n  description
        = \"Homelab hashed audit output\"\n  options \\{\n    file_path = \"stdout\"\n    log_raw = \"false\"\n    hmac_accessor
        = \"true\"\n  \\}\n\\}\napi_addr = \"http://127\\.0\\.0\\.1:8200\"\ncluster_addr = \"https://127\\.0\\.0\\.1:8201\"\nlistener
        \"tcp\" \\{\n  address = \"127\\.0\\.0\\.1:8200\"\n  cluster_address = \"127\\.0\\.0\\.1:8201\"\n  tls_disable
        = true\n\\}\nstorage \"raft\" \\{\n  path = \"/openbao/data\"\n  node_id = \"scratch\"\n\\}\nseal
        \"static\" \\{\n  current_key_id = \"[A-Za-z0-9_.-]{1,80}\"\n  current_key = \"file:///scratch\\-seal/key\"\n\\}\n$"'
  validations:
    - expression: request.namespace == 'openbao-restore-test' && request.subResource == '' && request.operation
        != 'UPDATE' && ((request.name == 'scratch-seal' && variables.item.kind == 'Secret') || (request.name
        == 'scratch-config' && variables.item.kind == 'ConfigMap')) && variables.item.apiVersion == 'v1'
        && variables.item.metadata.name == request.name && variables.item.metadata.namespace == 'openbao-restore-test'
        && variables.item.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$')
        && variables.item.metadata.annotations.all(k, k == 'homelab.supermorphic.com/test-run') && (!has(variables.item.metadata.labels)
        || variables.item.metadata.labels.size() == 0) && !has(variables.item.metadata.ownerReferences)
        && (!has(variables.item.metadata.finalizers) || variables.item.metadata.finalizers.size() == 0)
        && (request.operation != 'DELETE' || (has(variables.item.metadata.uid) && variables.item.metadata.uid
        != '')) && variables.item.immutable && variables.item.all(k, k in ['apiVersion','kind','metadata','immutable','type','data'])
      message: Only immutable, run-owned scratch private fixtures may be created or removed.
    - expression: 'variables.item.kind == ''Secret'' ? (variables.item.type == ''Opaque'' && variables.item.data.size()
        == 1 && ''key'' in variables.item.data && type(variables.item.data.key) == string && variables.item.data.key.size()
        > 0 && variables.item.data.key.size() <= 65536) : (!has(variables.item.type) && variables.item.data.size()
        == 1 && variables.item.data[''server.hcl''].matches(variables.configPattern))'
      message: The seal has one key; configuration is the fixed loopback-only, hashed-audit scratch program.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-restore-private
