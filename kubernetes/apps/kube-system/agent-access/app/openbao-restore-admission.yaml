apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-restore-statefulset
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - statefulsets
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-restore'
  variables:
    - name: item
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
    - name: core
      expression: '{"serviceName":dyn("scratch"),"replicas":dyn(1),"updateStrategy":dyn({"type":"OnDelete"}),"selector":dyn({"matchLabels":{"app":"openbao-restore-scratch"}})}'
    - name: pod
      expression: variables.item.spec.template.spec
    - name: podCore
      expression: '{"serviceAccountName":dyn("scratch"),"automountServiceAccountToken":dyn(false),"enableServiceLinks":dyn(false),"securityContext":dyn({"runAsNonRoot":dyn(true),"runAsUser":dyn(100),"runAsGroup":dyn(1000),"fsGroup":dyn(1000),"seccompProfile":dyn({"type":"RuntimeDefault"})})}'
    - name: podDefaults
      expression: '{"dnsPolicy":dyn("ClusterFirst"),"schedulerName":dyn("default-scheduler"),"restartPolicy":dyn("Always"),"terminationGracePeriodSeconds":dyn(30),"hostNetwork":dyn(false),"hostPID":dyn(false),"hostIPC":dyn(false),"initContainers":dyn([]),"ephemeralContainers":dyn([]),"tolerations":dyn([])}'
    - name: containers
      expression: '[{"name":dyn("server"),"image":dyn("quay.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315"),"command":dyn(["bao","server","-config=/scratch-config/server.hcl"]),"securityContext":dyn({"allowPrivilegeEscalation":dyn(false),"capabilities":dyn({"drop":["ALL"]})}),"resources":dyn({"requests":{"cpu":"100m","memory":"256Mi"},"limits":{"cpu":"1","memory":"1Gi"}}),"volumeMounts":dyn([dyn({"name":"data","mountPath":"/openbao/data"}),dyn({"name":dyn("seal"),"mountPath":dyn("/scratch-seal"),"readOnly":dyn(true)}),dyn({"name":dyn("config"),"mountPath":dyn("/scratch-config"),"readOnly":dyn(true)})])},{"name":dyn("runner"),"image":dyn("python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6"),"command":dyn(["python","-c","import
        time; time.sleep(86400)"]),"securityContext":dyn({"allowPrivilegeEscalation":dyn(false),"capabilities":dyn({"drop":["ALL"]}),"readOnlyRootFilesystem":dyn(true)}),"resources":dyn({"requests":{"cpu":"25m","memory":"32Mi"},"limits":{"cpu":"250m","memory":"128Mi"}})}]'
    - name: containerDefaults
      expression: '{"imagePullPolicy":dyn("IfNotPresent"),"terminationMessagePath":dyn("/dev/termination-log"),"terminationMessagePolicy":dyn("File"),"stdin":dyn(false),"stdinOnce":dyn(false),"tty":dyn(false)}'
    - name: volumes
      expression: '[{"name":dyn("data"),"persistentVolumeClaim":dyn({"claimName":"scratch-data"})},{"name":dyn("seal"),"secret":dyn({"secretName":dyn("scratch-seal"),"defaultMode":dyn(288)})},{"name":dyn("config"),"configMap":dyn({"name":"scratch-config"})}]'
  validations:
    - expression: request.namespace == 'openbao-restore-test' && request.subResource == '' && request.operation
        != 'UPDATE' && request.name == 'scratch' && variables.item.kind == 'StatefulSet' && variables.item.apiVersion
        == 'apps/v1' && variables.item.metadata.name == 'scratch' && variables.item.metadata.namespace
        == 'openbao-restore-test' && variables.item.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$')
        && variables.item.metadata.annotations.all(k, k == 'homelab.supermorphic.com/test-run') && (!has(variables.item.metadata.labels)
        || variables.item.metadata.labels.size() == 0) && !has(variables.item.metadata.ownerReferences)
        && (!has(variables.item.metadata.finalizers) || variables.item.metadata.finalizers.size() == 0)
        && (request.operation != 'DELETE' || (has(variables.item.metadata.uid) && variables.item.metadata.uid
        != ''))
      message: Only the run-owned scratch StatefulSet may be created or deleted.
    - expression: variables.core.all(k, k in variables.item.spec && variables.item.spec[k] == variables.core[k])
        && variables.item.spec.all(k, k in variables.core || k == 'template' || (k == 'podManagementPolicy'
        && variables.item.spec[k] == 'OrderedReady') || (k == 'revisionHistoryLimit' && variables.item.spec[k]
        == 10) || (k == 'persistentVolumeClaimRetentionPolicy' && variables.item.spec[k] == {'whenDeleted':'Retain','whenScaled':'Retain'}))
        && variables.item.spec.template.all(k, k in ['metadata','spec']) && variables.item.spec.template.metadata.labels
        == {'app':'openbao-restore-scratch'} && variables.item.spec.template.metadata.annotations == variables.item.metadata.annotations
        && variables.item.spec.template.metadata.all(k, k in ['labels','annotations'] || (k == 'creationTimestamp'
        && variables.item.spec.template.metadata[k] == null))
      message: Scratch controller count, selector and template ownership are fixed.
    - expression: variables.podCore.all(k, k in variables.pod && variables.pod[k] == variables.podCore[k])
        && variables.pod.all(k, k in variables.podCore || k in ['containers','volumes'] || (k in variables.podDefaults
        && variables.pod[k] == variables.podDefaults[k]) || (k == 'serviceAccount' && variables.pod[k]
        == 'scratch'))
      message: Scratch Pod identity, security and scheduling are fixed.
    - expression: variables.pod.containers.size() == 2 && [0,1].all(i, variables.containers[i].all(k,
        k in ['securityContext','volumeMounts'] || (k in variables.pod.containers[i] && variables.pod.containers[i][k]
        == variables.containers[i][k])) && variables.pod.containers[i].all(k, k in variables.containers[i]
        || (k in variables.containerDefaults && variables.pod.containers[i][k] == variables.containerDefaults[k]))
        && variables.containers[i].securityContext.all(k, k in variables.pod.containers[i].securityContext
        && variables.pod.containers[i].securityContext[k] == variables.containers[i].securityContext[k])
        && variables.pod.containers[i].securityContext.all(k, k in variables.containers[i].securityContext
        || (k == 'privileged' && !variables.pod.containers[i].securityContext.privileged) || (k == 'procMount'
        && variables.pod.containers[i].securityContext.procMount == 'Default'))) && !has(variables.pod.containers[1].volumeMounts)
        && variables.pod.containers[0].volumeMounts.size() == 3 && [0,1,2].all(i, variables.containers[0].volumeMounts[i].all(k,
        k in variables.pod.containers[0].volumeMounts[i] && variables.pod.containers[0].volumeMounts[i][k]
        == variables.containers[0].volumeMounts[i][k]) && variables.pod.containers[0].volumeMounts[i].all(k,
        k in variables.containers[0].volumeMounts[i] || (k == 'readOnly' && i == 0 && !variables.pod.containers[0].volumeMounts[i].readOnly)
        || (k == 'mountPropagation' && variables.pod.containers[0].volumeMounts[i][k] == 'None') || (k
        == 'recursiveReadOnly' && variables.pod.containers[0].volumeMounts[i][k] == 'Disabled'))) && variables.pod.volumes.size()
        == 3 && variables.pod.volumes[0] == variables.volumes[0] && variables.pod.volumes[1] == variables.volumes[1]
        && variables.pod.volumes[2].name == 'config' && variables.pod.volumes[2].all(k, k in ['name','configMap'])
        && variables.pod.volumes[2].configMap.name == 'scratch-config' && variables.pod.volumes[2].configMap.all(k,
        k == 'name' || (k == 'defaultMode' && variables.pod.volumes[2].configMap[k] == 420))
      message: Only pinned server and unmounted runner programs with fixed resources and data/seal/config
        mounts are admitted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-restore-statefulset
spec:
  policyName: homelab-test-openbao-restore-statefulset
  validationActions:
    - Deny
