apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-openbao-restore-storage
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - persistentvolumeclaims
  matchConditions:
    - name: dedicated-profile
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-openbao-restore'
  variables:
    - name: item
      expression: 'request.operation == ''DELETE'' ? oldObject : object'
  validations:
    - expression: request.namespace == 'openbao-restore-test' && request.subResource == '' && request.operation
        != 'UPDATE' && request.name == 'scratch-data' && variables.item.kind == 'PersistentVolumeClaim'
        && variables.item.apiVersion == 'v1' && variables.item.metadata.name == 'scratch-data' && variables.item.metadata.namespace
        == 'openbao-restore-test' && variables.item.metadata.annotations['homelab.supermorphic.com/test-run'].matches('^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$')
        && variables.item.metadata.annotations.all(k, k == 'homelab.supermorphic.com/test-run' || (request.operation
        == 'DELETE' && k in ['pv.kubernetes.io/bind-completed','pv.kubernetes.io/bound-by-controller','volume.kubernetes.io/storage-provisioner','volume.beta.kubernetes.io/storage-provisioner','volume.kubernetes.io/selected-node']))
        && (!has(variables.item.metadata.labels) || variables.item.metadata.labels.size() == 0) && !has(variables.item.metadata.ownerReferences)
        && (!has(variables.item.metadata.finalizers) || variables.item.metadata.finalizers.size() == 0
        || (request.operation == 'DELETE' && variables.item.metadata.finalizers == ['kubernetes.io/pvc-protection']))
        && (request.operation != 'DELETE' || (has(variables.item.metadata.uid) && variables.item.metadata.uid
        != ''))
      message: Only the owned scratch claim may be allocated and removed.
    - expression: variables.item.spec.accessModes == ['ReadWriteOnce'] && variables.item.spec.storageClassName
        == 'longhorn' && variables.item.spec.resources == {'requests':{'storage':'10Gi'}} && variables.item.spec.all(k,
        k in ['accessModes','storageClassName','resources'] || (k == 'volumeMode' && variables.item.spec[k]
        == 'Filesystem') || (request.operation == 'DELETE' && k == 'volumeName' && variables.item.spec[k]
        == 'pvc-' + variables.item.metadata.uid))
      message: Scratch storage must be a fresh bounded Longhorn volume, never a clone or existing claim.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-openbao-restore-storage
spec:
  policyName: homelab-test-openbao-restore-storage
  validationActions:
