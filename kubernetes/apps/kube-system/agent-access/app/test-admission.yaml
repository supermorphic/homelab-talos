apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-qbit-manage-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
    - name: qbit-manage
      expression: >-
        (request.operation == 'DELETE' ? oldObject : object).metadata.labels['homelab-talos/test'] == 'qbit-manage-policy'
  variables:
    - name: job
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: pod
      expression: variables.job.spec.template.spec
    - name: app
      expression: variables.pod.containers[0]
    - name: init
      expression: variables.pod.initContainers[0]
    - name: run
      expression: variables.job.metadata.labels['homelab-talos/run-id']
    - name: phase
      expression: "variables.init.command[3]"
  validations:
    - expression: >-
        request.operation != 'UPDATE' && request.namespace == 'media' &&
        variables.run.matches('^[a-z0-9]{8,24}$') &&
        variables.phase in ['cz-apply', 'cz-repeat', 'private', 'limits', 'cleanup', 'cleanup-repeat'] &&
        variables.job.metadata.name == 'qbm-e2e-' + variables.run + '-' + variables.phase &&
        variables.job.spec.activeDeadlineSeconds == 120 &&
        variables.job.spec.ttlSecondsAfterFinished in [600, 3600] &&
        !has(variables.job.metadata.ownerReferences) && !has(variables.job.metadata.annotations) &&
        (!has(variables.job.metadata.finalizers) || variables.job.metadata.finalizers.size() == 0) &&
        !has(variables.job.spec.template.metadata.annotations) && !has(variables.job.spec.template.metadata.ownerReferences) &&
        variables.job.metadata.labels['homelab-talos/e2e-run'] == variables.run &&
        variables.job.metadata.labels['homelab-talos/e2e-target'] == 'qbit-manage-policy' &&
        variables.job.spec.template.metadata.labels['homelab-talos/e2e-run'] == variables.run &&
        variables.job.spec.template.metadata.labels['homelab-talos/e2e-target'] == 'qbit-manage-policy'
      message: qbit_manage jobs must use an owned run and one of the six registered phases.
    - expression: >-
        variables.pod.containers.size() == 1 && variables.pod.initContainers.size() == 1 &&
        !has(variables.pod.ephemeralContainers) && variables.pod.restartPolicy == 'Never' &&
        variables.pod.automountServiceAccountToken == false &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default']) &&
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        !has(variables.pod.hostAliases) && !has(variables.pod.dnsConfig) &&
        (!has(variables.pod.dnsPolicy) || variables.pod.dnsPolicy == 'ClusterFirst') &&
        !has(variables.pod.imagePullSecrets) && !has(variables.pod.priorityClassName) &&
        (!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler') &&
        variables.pod.securityContext.runAsNonRoot && variables.pod.securityContext.runAsUser == 568 &&
        variables.pod.securityContext.runAsGroup == 568 && variables.pod.securityContext.fsGroup == 568 &&
        variables.pod.securityContext.fsGroupChangePolicy == 'OnRootMismatch' &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        !has(variables.pod.securityContext.seccompProfile.localhostProfile) &&
        !has(variables.pod.securityContext.sysctls) && !has(variables.pod.securityContext.supplementalGroups) &&
        !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions) &&
        !has(variables.pod.securityContext.appArmorProfile)
      message: qbit_manage jobs require the fixed tokenless application identity and network context.
    - expression: >-
        (variables.pod.containers + variables.pod.initContainers).all(c,
          c.image == 'ghcr.io/stuffanthings/qbit_manage:v4.10.0' && !has(c.args) &&
          !has(c.lifecycle) && !has(c.workingDir) && !has(c.ports) && !has(c.volumeDevices) &&
          !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) &&
          (!has(c.restartPolicy) || c.restartPolicy == '') &&
          (!has(c.stdin) || !c.stdin) && (!has(c.tty) || !c.tty) &&
          c.securityContext.allowPrivilegeEscalation == false && c.securityContext.capabilities.drop == ['ALL'] &&
          !has(c.securityContext.capabilities.add) &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          (!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot) &&
          (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser == 568) &&
          (!has(c.securityContext.runAsGroup) || c.securityContext.runAsGroup == 568) &&
          !has(c.securityContext.seccompProfile) && !has(c.securityContext.procMount) &&
          !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions) &&
          !has(c.securityContext.appArmorProfile)) &&
        variables.init.name == 'init-config' &&
        variables.init.command == ['python3', '/helpers/qbm-policy-config.py', variables.run, variables.phase] &&
        !has(variables.init.env) && !has(variables.init.envFrom) &&
        variables.app.name == 'app' && variables.app.command == ['/bin/sh', '-eu', '/helpers/qbm-policy-run.sh'] &&
        variables.app.envFrom.size() == 1 && has(variables.app.envFrom[0].secretRef) &&
        variables.app.envFrom[0].secretRef.name == 'qbit-manage-secret' &&
