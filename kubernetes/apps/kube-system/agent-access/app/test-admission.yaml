apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-flux-reconcile
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [source.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [gitrepositories]
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [kustomizations]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: previous
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: requestedAt
      expression: "'reconcile.fluxcd.io/requestedAt'"
  validations:
    - expression: >-
        request.namespace == 'flux-system' && (
          (request.resource.group == 'source.toolkit.fluxcd.io' && request.resource.resource == 'gitrepositories' && request.name == 'flux-system') ||
          (request.resource.group == 'kustomize.toolkit.fluxcd.io' && request.resource.resource == 'kustomizations' && request.name == 'flux-canary')) &&
        object.metadata.name == oldObject.metadata.name && object.metadata.namespace == oldObject.metadata.namespace &&
        object.spec == oldObject.spec &&
        (has(object.metadata.labels) == has(oldObject.metadata.labels)) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences)) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        (has(object.metadata.finalizers) == has(oldObject.metadata.finalizers)) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        (has(object.metadata.generateName) == has(oldObject.metadata.generateName)) &&
        (!has(object.metadata.generateName) || object.metadata.generateName == oldObject.metadata.generateName)
      message: Tests may request reconciliation only on the named source and encrypted canary, preserving their specification and ownership.
    - expression: >-
        variables.requestedAt in variables.annotations &&
        variables.annotations[variables.requestedAt].matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]{1,9})?(Z|[+-][0-9]{2}:[0-9]{2})$') &&
        variables.annotations.all(k, k == variables.requestedAt ||
          (k in variables.previous && variables.annotations[k] == variables.previous[k])) &&
        variables.previous.all(k, k == variables.requestedAt || k in variables.annotations)
      message: The reconciliation timestamp is the only annotation a test may change.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-flux-reconcile
spec:
  policyName: homelab-test-flux-reconcile
  validationActions: [Deny]
