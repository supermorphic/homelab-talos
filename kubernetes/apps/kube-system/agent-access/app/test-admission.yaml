apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-n8n-persistence-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
    - name: n8n-persistence
      expression: >-
        (request.operation == 'DELETE' ? oldObject : object).metadata.labels['homelab-talos/test'] == 'n8n-persistence'
  variables:
    - name: job
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: pod
      expression: variables.job.spec.template.spec
    - name: container
      expression: variables.pod.containers[0]
    - name: run
      expression: variables.job.metadata.labels['homelab-talos/run-id']
    - name: phase
      expression: "variables.job.metadata.name.endsWith('-write') ? 'write' : (variables.job.metadata.name.endsWith('-verify') ? 'verify' : 'cleanup')"
  validations:
    - expression: >-
        variables.job.metadata.name == 'n8n-persistence-' + variables.run + '-' + variables.phase &&
        variables.job.spec.activeDeadlineSeconds == 300 &&
        has(variables.pod.nodeName) && variables.pod.nodeName != '' &&
        variables.pod.securityContext.fsGroup == 1000 &&
        !has(variables.pod.securityContext.runAsUser) && !has(variables.pod.securityContext.runAsGroup) &&
        variables.container.securityContext.runAsUser == 1000 &&
        variables.container.securityContext.runAsGroup == 1000 &&
        variables.container.securityContext.runAsNonRoot &&
        variables.container.name == 'sentinel' &&
        variables.container.image == 'docker.n8n.io/n8nio/n8n:2.36.7' &&
        variables.container.command == ['/bin/sh', '-ceu'] && variables.container.args.size() == 1 &&
        variables.container.args[0] == (variables.phase == 'write' ?
          'umask 077; printf %s "$SENTINEL_VALUE" >"$SENTINEL"; sync; test "$(cat "$SENTINEL")" = "$SENTINEL_VALUE"' :
          (variables.phase == 'verify' ?
            'test "$(cat "$SENTINEL")" = "$SENTINEL_VALUE"; rm -f -- "$SENTINEL"; test ! -e "$SENTINEL"' :
            'rm -f -- "$SENTINEL"; test ! -e "$SENTINEL"'))
      message: Persistence helpers must use the fixed program and application user.
    - expression: >-
        variables.container.env.size() == 2 &&
        variables.container.env.exists(e, e.name == 'SENTINEL' && !has(e.valueFrom) &&
          e.value == '/data/.homelab-n8n-persistence-' + variables.run) &&
        variables.container.env.exists(e, e.name == 'SENTINEL_VALUE' && !has(e.valueFrom) &&
          e.value == 'homelab-n8n-persistence-' + variables.run) &&
        variables.pod.volumes.size() == 1 && variables.pod.volumes[0].name == 'data' &&
        has(variables.pod.volumes[0].persistentVolumeClaim) &&
        variables.pod.volumes[0].persistentVolumeClaim.claimName == 'n8n-data' &&
        variables.container.volumeMounts.size() == 1 &&
        variables.container.volumeMounts[0].name == 'data' &&
        variables.container.volumeMounts[0].mountPath == '/data' &&
        !has(variables.container.volumeMounts[0].subPath) &&
        !has(variables.container.volumeMounts[0].subPathExpr)
      message: Persistence helpers may touch only their run-specific sentinel on the n8n claim.
---
