apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-n8n-request-jobs
spec:
  policyName: homelab-test-n8n-request-jobs
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-disruption
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [pods]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: pod
      expression: oldObject
    - name: app
      expression: >-
        'app.kubernetes.io/name' in variables.pod.metadata.labels ?
          variables.pod.metadata.labels['app.kubernetes.io/name'] : ''
    - name: owner
      expression: variables.pod.metadata.ownerReferences[0]
    - name: deployment
      expression: >-
        (request.namespace == 'automation' && variables.app == 'n8n') ||
        (request.namespace == 'media' && variables.app == 'qbittorrent') ||
        (request.namespace == 'portainer' && variables.app == 'portainer') ||
        (request.namespace == 'test-reports' && variables.app == 'test-reports')
  validations:
    - expression: >-
        variables.pod.metadata.namespace == request.namespace && variables.pod.metadata.name == request.name &&
        variables.pod.metadata.ownerReferences.size() == 1 && variables.owner.controller &&
        variables.owner.apiVersion == 'apps/v1' && variables.owner.uid != '' && (
          (variables.deployment && variables.owner.kind == 'ReplicaSet' &&
            variables.owner.name.matches('^' + variables.app + '-[a-z0-9]+$') &&
            request.name.matches('^' + variables.owner.name + '-[a-z0-9]{5}$')) ||
          (request.namespace == 'automation' && variables.app == 'n8n-postgresql' &&
            variables.owner.kind == 'StatefulSet' && variables.owner.name == 'n8n-postgresql' &&
            request.name == 'n8n-postgresql-0') ||
          (request.namespace == 'tailscale' &&
            variables.pod.metadata.labels['tailscale.supermorphic.com/component'] == 'lab-subnet-router' &&
            variables.owner.kind == 'StatefulSet' &&
            variables.owner.name.matches('^ts-lab-subnet-router-[a-z0-9]{5}$') &&
            request.name.matches('^' + variables.owner.name + '-[01]$'))
        )
      message: Only registered application disruption targets may be deleted.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-disruption
spec:
  policyName: homelab-test-disruption
  validationActions: [Deny]
