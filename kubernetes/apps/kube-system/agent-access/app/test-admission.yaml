apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-n8n-restore-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
    - name: n8n-database-helper
      expression: >-
        (request.operation == 'DELETE' ? oldObject : object).metadata.labels['homelab-talos/test'] == 'n8n-restore-drill' &&
        (request.operation == 'DELETE' ? oldObject : object).metadata.labels['homelab-talos/role'] == 'database-helper'
  variables:
    - name: job
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: pod
      expression: variables.job.spec.template.spec
    - name: container
      expression: variables.pod.containers[0]
    - name: run
      expression: variables.job.metadata.labels['homelab-talos/run-id']
    - name: load
      expression: variables.job.metadata.name.endsWith('-load')
  validations:
    - expression: >-
        request.namespace == 'automation' && request.operation != 'UPDATE' &&
        variables.run.matches('^[0-9a-f]{12}$') &&
        variables.job.metadata.name == 'n8n-restore-' + variables.run + (variables.load ? '-load' : '-drop') &&
        variables.job.metadata.labels['homelab-talos/test'] == 'n8n-restore-drill' &&
        variables.job.metadata.labels['homelab-talos/role'] == 'database-helper' &&
        !has(variables.job.metadata.ownerReferences) &&
        !has(variables.job.metadata.annotations) &&
        variables.job.spec.template.metadata.labels['homelab-talos/test'] == 'n8n-restore-drill' &&
        variables.job.spec.template.metadata.labels['homelab-talos/run-id'] == variables.run &&
        variables.job.spec.template.metadata.labels['homelab-talos/role'] == 'database-helper' &&
        !has(variables.job.spec.template.metadata.annotations) &&
        variables.job.spec.template.metadata.labels.all(k, k in [
          'homelab-talos/test', 'homelab-talos/run-id', 'homelab-talos/role',
          'batch.kubernetes.io/controller-uid', 'batch.kubernetes.io/job-name', 'controller-uid', 'job-name']) &&
        variables.job.spec.activeDeadlineSeconds == 1800 && variables.job.spec.backoffLimit == 0 &&
        (!has(variables.job.spec.parallelism) || variables.job.spec.parallelism == 1) &&
        (!has(variables.job.spec.completions) || variables.job.spec.completions == 1) &&
        (!has(variables.job.spec.manualSelector) || !variables.job.spec.manualSelector)
      message: Only bounded n8n scratch database helper jobs are permitted.
    - expression: >-
        variables.pod.automountServiceAccountToken == false &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == '' || variables.pod.serviceAccountName == 'default') &&
        variables.pod.restartPolicy == 'Never' && variables.pod.containers.size() == 1 &&
        !has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers) &&
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        !has(variables.pod.hostAliases) && !has(variables.pod.dnsConfig) &&
        (!has(variables.pod.dnsPolicy) || variables.pod.dnsPolicy == 'ClusterFirst') &&
        !has(variables.pod.imagePullSecrets) &&
        variables.pod.securityContext.runAsNonRoot && variables.pod.securityContext.runAsUser == 70 &&
        variables.pod.securityContext.runAsGroup == 70 && variables.pod.securityContext.fsGroup == 70 &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        !has(variables.pod.securityContext.sysctls) && !has(variables.pod.securityContext.supplementalGroups) &&
        !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions) &&
        !has(variables.pod.securityContext.appArmorProfile) &&
        !has(variables.pod.priorityClassName) &&
        (!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler')
      message: Helper jobs cannot select a different identity, network, or security context.
    - expression: >-
        variables.container.name == 'restore' && variables.container.image == 'postgres:17.11-alpine3.24' &&
        variables.container.command == ['/bin/sh', '-eu', variables.load ? '/helpers/n8n-restore-load.sh' : '/helpers/n8n-restore-drop.sh'] &&
        !has(variables.container.args) && !has(variables.container.envFrom) &&
        !has(variables.container.lifecycle) && !has(variables.container.workingDir) &&
        !has(variables.container.livenessProbe) && !has(variables.container.readinessProbe) &&
        !has(variables.container.startupProbe) &&
        !has(variables.container.ports) && !has(variables.container.volumeDevices) &&
        (!has(variables.container.stdin) || !variables.container.stdin) &&
        (!has(variables.container.tty) || !variables.container.tty) &&
        variables.container.securityContext.allowPrivilegeEscalation == false &&
        variables.container.securityContext.readOnlyRootFilesystem &&
        variables.container.securityContext.capabilities.drop == ['ALL'] &&
        !has(variables.container.securityContext.capabilities.add) &&
        (!has(variables.container.securityContext.privileged) || !variables.container.securityContext.privileged) &&
        !has(variables.container.securityContext.runAsUser) && !has(variables.container.securityContext.runAsGroup) &&
        !has(variables.container.securityContext.seccompProfile) &&
        !has(variables.container.securityContext.procMount) &&
        !has(variables.container.securityContext.seLinuxOptions) &&
        !has(variables.container.securityContext.windowsOptions) &&
        !has(variables.container.securityContext.appArmorProfile) &&
        (!has(variables.container.securityContext.runAsNonRoot) || variables.container.securityContext.runAsNonRoot)
      message: Helpers must execute the Git-managed immutable program with the fixed image.
    - expression: >-
        variables.container.env.size() == 5 &&
        variables.container.env.exists(e, e.name == 'PGHOST' && e.value == 'n8n-postgresql.automation.svc.cluster.local' && !has(e.valueFrom)) &&
        variables.container.env.exists(e, e.name == 'PGPORT' && e.value == '5432' && !has(e.valueFrom)) &&
        variables.container.env.exists(e, e.name == 'PGUSER' && e.value == 'postgres' && !has(e.valueFrom)) &&
        variables.container.env.exists(e, e.name == 'RESTORE_DATABASE' && e.value == 'n8n_restore_' + variables.run && !has(e.valueFrom)) &&
        variables.container.env.exists(e, e.name == 'PGPASSWORD' && (!has(e.value) || e.value == '') &&
          has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name == 'postgresql-credentials' &&
          e.valueFrom.secretKeyRef.key == 'postgres-superuser-password' &&
          !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef))
      message: Helper credentials may be used only with the canonical scratch database.
    - expression: >-
        variables.pod.volumes.size() == (variables.load ? 3 : 2) &&
        variables.pod.volumes.exists(v, v.name == 'helpers' && has(v.configMap) && v.configMap.name == 'n8n-test-helpers-v1' && !has(v.configMap.items)) &&
        variables.pod.volumes.exists(v, v.name == 'tmp' && has(v.emptyDir)) &&
        (!variables.load || variables.pod.volumes.exists(v, v.name == 'backups' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'n8n-postgresql-backups')) &&
        variables.container.volumeMounts.size() == (variables.load ? 3 : 2) &&
        variables.container.volumeMounts.exists(m, m.name == 'helpers' && m.mountPath == '/helpers' && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.container.volumeMounts.exists(m, m.name == 'tmp' && m.mountPath == '/tmp' && !has(m.subPath) && !has(m.subPathExpr)) &&
        (!variables.load || variables.container.volumeMounts.exists(m, m.name == 'backups' && m.mountPath == '/backups' && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)))
      message: Helpers may mount only their fixed program, backup source, and scratch directory.
