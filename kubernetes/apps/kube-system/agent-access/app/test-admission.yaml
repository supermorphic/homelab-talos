        variables.container.env.exists(e, e.name == 'RUN_HASH' && !has(e.valueFrom) && e.value == variables.run) &&
        variables.container.env.exists(e, e.name == 'HOME' && !has(e.valueFrom) && e.value == '/tmp') &&
        variables.container.env.exists(e, e.name == 'CANARY_TOKEN' && (!has(e.value) || e.value == '') &&
          has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name == 'n8n-canary' && e.valueFrom.secretKeyRef.key == 'token' &&
          !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef)) &&
        variables.pod.volumes.size() == 2 &&
        variables.pod.volumes.exists(v, v.name == 'helpers' && has(v.configMap) && v.configMap.name == 'n8n-test-request-helpers-v1' && !has(v.configMap.items)) &&
        variables.pod.volumes.exists(v, v.name == 'tmp' && has(v.emptyDir)) &&
        variables.container.volumeMounts.size() == 2 &&
        variables.container.volumeMounts.exists(m, m.name == 'helpers' && m.mountPath == '/helpers' && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.container.volumeMounts.exists(m, m.name == 'tmp' && m.mountPath == '/tmp' && !has(m.subPath) && !has(m.subPathExpr))
      message: Request jobs may use only their fixed program, scratch directory, and canary token for the run endpoint.
