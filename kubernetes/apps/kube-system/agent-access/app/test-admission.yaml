---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-media-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
    - name: media
      expression: request.namespace == 'media'
  validations:
    - expression: >-
        (!has(object.tty) || !object.tty) &&
        ((request.name.matches('^(qbit-manage|sonarr|qbittorrent|plex)-[a-z0-9]{5,10}-[a-z0-9]{5}$') &&
          object.container == 'app') ||
         (request.name.matches('^plex-policy-(control|selected)-[0-9]{10}-[0-9]+$') &&
          (!has(object.container) || object.container in ['', 'probe']) && (!has(object.stdin) || !object.stdin)))
      message: Media runtime access is limited to the application container of registered targets and non-interactive policy probes.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-media-runtime
spec:
  policyName: homelab-test-media-runtime
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-storage
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [persistentvolumeclaims]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: claim
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: >-
        request.namespace == 'longhorn-system' &&
        variables.claim.metadata.name.matches('^storage-provisioning-[0-9]+-[0-9]+$') &&
        has(variables.claim.metadata.labels) &&
        'homelab-talos/test' in variables.claim.metadata.labels &&
        variables.claim.metadata.labels['homelab-talos/test'] == 'storage-provisioning'
      message: Only fresh storage provisioning test claims are permitted.
    - expression: >-
        variables.claim.spec.accessModes == ['ReadWriteOnce'] &&
        variables.claim.spec.storageClassName == 'longhorn' &&
        variables.claim.spec.resources.requests.storage == '1Gi' &&
        (!has(variables.claim.spec.volumeMode) || variables.claim.spec.volumeMode == 'Filesystem') &&
        !has(variables.claim.spec.dataSource) &&
        !has(variables.claim.spec.dataSourceRef) &&
        !has(variables.claim.spec.selector) &&
        (request.operation == 'DELETE' ||
          !has(variables.claim.spec.volumeName) || variables.claim.spec.volumeName == '')
      message: Storage tests must provision a fresh one GiB Longhorn claim.
    - expression: request.operation != 'UPDATE'
      message: Test claims cannot be changed after creation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-storage
spec:
  policyName: homelab-test-storage
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-report-exec
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  validations:
    - expression: >-
        request.namespace != 'test-reports' || (
          request.name.matches('^test-reports-[a-z0-9]+-[a-z0-9]+$') &&
          object.container == 'caddy' &&
          (!has(object.stdin) || !object.stdin) &&
          (!has(object.tty) || !object.tty) &&
          object.command.size() == 2 && (
            object.command == ['readlink', '/srv/state/current'] ||
            object.command == ['cat', '/srv/state/current/catalog.json'] || (
              object.command[0] == 'sha256sum' && (
                object.command[1].matches('^/srv/reports/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}-(agent|github-actions|operator)-[0-9a-f]{8}/awesome/index[.]html$') ||
                object.command[1].matches('^/srv/artifacts/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}-(agent|github-actions|operator)-[0-9a-f]{8}[.]tar[.]gz$')
              )
            )
          )
        )
      message: Report persistence tests may read only canonical report evidence.
