    - expression: >-
        variables.service.spec.ports.size() == 1 && variables.service.spec.ports[0].name == 'http' &&
        variables.service.spec.ports[0].port == 5678 && variables.service.spec.ports[0].targetPort == 'http' &&
        variables.service.spec.ports[0].protocol == 'TCP' &&
        (!has(variables.service.spec.ports[0].nodePort) || variables.service.spec.ports[0].nodePort == 0) &&
        !has(variables.service.spec.ports[0].appProtocol)
      message: The n8n restore Service exposes only its canonical HTTP port.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-services
spec:
  policyName: homelab-test-services
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-network-policies
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cilium.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE, DELETE]
        resources: [ciliumnetworkpolicies]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: policy
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: run
      expression: variables.policy.metadata.labels['homelab-talos/run-id']
    - name: automation
      expression: request.namespace == 'automation'
    - name: rules
      expression: "variables.automation ? variables.policy.specs : [variables.policy.spec]"
    - name: outbound
      expression: "variables.automation ? [variables.rules[0], variables.rules[1]] : variables.rules"
    - name: dns
      expression: "{'k8s:io.kubernetes.pod.namespace': 'kube-system', 'k8s:k8s-app': 'kube-dns'}"
    - name: application
      expression: >-
        {'homelab-talos/test': 'n8n-restore-drill', 'homelab-talos/run-id': variables.run, 'homelab-talos/role': 'n8n'}
    - name: helper
      expression: >-
        {'homelab-talos/test': 'n8n-restore-drill', 'homelab-talos/run-id': variables.run, 'homelab-talos/role': 'database-helper'}
    - name: requester
      expression: >-
        {'homelab-talos/test': 'n8n-restore-drill', 'homelab-talos/run-id': variables.run, 'homelab-talos/role': 'request'}
    - name: databasePeer
      expression: "{'k8s:io.kubernetes.pod.namespace': 'automation', 'app.kubernetes.io/name': 'n8n-postgresql'}"
    - name: applicationPeer
      expression: >-
        {'k8s:io.kubernetes.pod.namespace': 'automation', 'homelab-talos/test': 'n8n-restore-drill',
          'homelab-talos/run-id': variables.run, 'homelab-talos/role': 'n8n'}
    - name: requestPeer
      expression: >-
        {'k8s:io.kubernetes.pod.namespace': 'gatus', 'homelab-talos/test': 'n8n-restore-drill',
          'homelab-talos/run-id': variables.run, 'homelab-talos/role': 'request'}
    - name: databaseClientPeer
      expression: >-
        {'k8s:io.kubernetes.pod.namespace': 'automation', 'homelab-talos/test': 'n8n-restore-drill', 'homelab-talos/run-id': variables.run}
  validations:
    - expression: >-
        request.namespace in ['automation', 'gatus'] && request.operation != 'UPDATE' &&
        variables.run.matches('^[0-9a-f]{12}$') &&
        variables.policy.metadata.name == 'n8n-restore-' + variables.run + (variables.automation ? '-automation' : '-request') &&
        variables.policy.metadata.labels['homelab-talos/test'] == 'n8n-restore-drill' &&
        !has(variables.policy.metadata.ownerReferences) && !has(variables.policy.metadata.annotations) &&
        (variables.automation ? (!has(variables.policy.spec) && variables.rules.size() == 3) :
          (!has(variables.policy.specs) && variables.rules.size() == 1)) &&
        variables.rules.all(r, !has(r.nodeSelector) && !has(r.ingressDeny) && !has(r.egressDeny) &&
          !has(r.enableDefaultDeny) && !has(r.log) && !has(r.labels) && !has(r.description) &&
          !has(r.endpointSelector.matchExpressions)) &&
        (variables.automation ? (
          variables.rules[0].endpointSelector.matchLabels == variables.application &&
          variables.rules[1].endpointSelector.matchLabels == variables.helper &&
          variables.rules[2].endpointSelector.matchLabels == {'app.kubernetes.io/name': 'n8n-postgresql'} &&
          !has(variables.rules[2].egress) && variables.rules[1].ingress.size() == 0) : (
          variables.rules[0].endpointSelector.matchLabels == variables.requester && variables.rules[0].ingress.size() == 0))
      message: Only the complete run-specific n8n restore policy allocation is permitted.
    - expression: >-
        variables.rules.all(r,
          (!has(r.ingress) || r.ingress.all(i,
            !has(i.fromCIDR) && !has(i.fromCIDRSet) && !has(i.fromEntities) && !has(i.fromGroups) &&
            !has(i.fromNodes) && !has(i.fromRequires) && !has(i.authentication) && !has(i.icmps) &&
            i.fromEndpoints.size() == 1 && !has(i.fromEndpoints[0].matchExpressions) && i.toPorts.size() == 1 &&
            i.toPorts.all(p, !has(p.listener) && !has(p.originatingTLS) && !has(p.rules) && !has(p.serverNames) && !has(p.terminatingTLS)))) &&
          (!has(r.egress) || r.egress.all(e,
            !has(e.toCIDR) && !has(e.toCIDRSet) && !has(e.toEntities) && !has(e.toFQDNs) &&
            !has(e.toGroups) && !has(e.toNodes) && !has(e.toRequires) && !has(e.toServices) &&
            !has(e.authentication) && !has(e.icmps) &&
            e.toEndpoints.size() == 1 && !has(e.toEndpoints[0].matchExpressions) && e.toPorts.size() == 1 &&
            e.toPorts.all(p, !has(p.listener) && !has(p.originatingTLS) && !has(p.rules) && !has(p.serverNames) && !has(p.terminatingTLS)))))
      message: Restore policy rules cannot add alternative peers, authentication, ICMP, L7, TLS, or listener behavior.
    - expression: >-
        variables.outbound.all(r, r.egress.size() == 2 &&
          r.egress[0].toEndpoints[0].matchLabels == variables.dns &&
          r.egress[0].toPorts[0].ports.size() == 2 &&
          r.egress[0].toPorts[0].ports.all(p, p.port == '53' && p.protocol in ['UDP', 'TCP'] && !has(p.endPort)) &&
          r.egress[0].toPorts[0].ports.exists(p, p.protocol == 'UDP') &&
          r.egress[0].toPorts[0].ports.exists(p, p.protocol == 'TCP') &&
          r.egress[1].toEndpoints[0].matchLabels == (variables.automation ? variables.databasePeer : variables.applicationPeer) &&
          r.egress[1].toPorts[0].ports.size() == 1 &&
          r.egress[1].toPorts[0].ports[0].port == (variables.automation ? '5432' : '5678') &&
          r.egress[1].toPorts[0].ports[0].protocol == 'TCP' && !has(r.egress[1].toPorts[0].ports[0].endPort))
      message: Restore egress permits only cluster DNS and the canonical database or run application peer.
    - expression: >-
        !variables.automation || (
          variables.rules[0].ingress.size() == 1 &&
          variables.rules[0].ingress[0].fromEndpoints[0].matchLabels == variables.requestPeer &&
          variables.rules[0].ingress[0].toPorts[0].ports.size() == 1 &&
          variables.rules[0].ingress[0].toPorts[0].ports[0].port == '5678' &&
          variables.rules[0].ingress[0].toPorts[0].ports[0].protocol == 'TCP' &&
          !has(variables.rules[0].ingress[0].toPorts[0].ports[0].endPort) &&
          variables.rules[2].ingress.size() == 1 &&
          variables.rules[2].ingress[0].fromEndpoints[0].matchLabels == variables.databaseClientPeer &&
          variables.rules[2].ingress[0].toPorts[0].ports.size() == 1 &&
          variables.rules[2].ingress[0].toPorts[0].ports[0].port == '5432' &&
          variables.rules[2].ingress[0].toPorts[0].ports[0].protocol == 'TCP' &&
          !has(variables.rules[2].ingress[0].toPorts[0].ports[0].endPort))
      message: Restore ingress permits only the matching request and database helper peers on their fixed ports.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-network-policies
spec:
  policyName: homelab-test-network-policies
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-flux-fixtures
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, DELETE]
        resources: [kustomizations]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: fixture
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: name
      expression: variables.fixture.metadata.name
  validations:
    - expression: >-
        request.namespace == 'flux-system' &&
        variables.name.matches('^flux-alert-e2e-[0-9]{14}-[0-9]+$') &&
        variables.fixture.metadata.labels['homelab-talos/test'] == 'flux-alert-delivery' &&
        !has(variables.fixture.metadata.ownerReferences) && !has(variables.fixture.metadata.annotations) &&
        (!has(variables.fixture.metadata.finalizers) ||
          (request.operation == 'DELETE' && variables.fixture.metadata.finalizers == ['finalizers.fluxcd.io'])) &&
        variables.fixture.spec.interval == '1m' && variables.fixture.spec.retryInterval == '30s' &&
        variables.fixture.spec.timeout == '30s' && !variables.fixture.spec.prune && variables.fixture.spec.wait &&
        variables.fixture.spec.path == './.homelab-talos-tests/' + variables.name &&
        variables.fixture.spec.sourceRef.apiVersion == 'source.toolkit.fluxcd.io/v1' &&
        variables.fixture.spec.sourceRef.kind == 'GitRepository' &&
        variables.fixture.spec.sourceRef.name == variables.name + '-source-does-not-exist' &&
        (!has(variables.fixture.spec.sourceRef.namespace) || variables.fixture.spec.sourceRef.namespace == 'flux-system')
      message: Only the canonical missing-source Flux alert fixture is permitted.
    - expression: >-
        !has(variables.fixture.spec.buildMetadata) && !has(variables.fixture.spec.commonMetadata) &&
        !has(variables.fixture.spec.components) && !has(variables.fixture.spec.decryption) &&
        !has(variables.fixture.spec.deletionPolicy) && !has(variables.fixture.spec.dependsOn) &&
        (!has(variables.fixture.spec.force) || !variables.fixture.spec.force) &&
        !has(variables.fixture.spec.healthCheckExprs) && !has(variables.fixture.spec.healthChecks) &&
        !has(variables.fixture.spec.ignore) && !has(variables.fixture.spec.ignoreMissingComponents) &&
        !has(variables.fixture.spec.images) && !has(variables.fixture.spec.kubeConfig) &&
        !has(variables.fixture.spec.namePrefix) && !has(variables.fixture.spec.nameSuffix) &&
        !has(variables.fixture.spec.patches) && !has(variables.fixture.spec.postBuild) &&
        !has(variables.fixture.spec.serviceAccountName) &&
        (!has(variables.fixture.spec.suspend) || !variables.fixture.spec.suspend) &&
        !has(variables.fixture.spec.targetNamespace)
      message: Alert fixtures cannot add deployment, credential, transformation, or alternate controller behavior.
---
apiVersion: admissionregistration.k8s.io/v1
