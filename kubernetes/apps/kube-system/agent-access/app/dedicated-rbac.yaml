---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-flux-restart
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-cilium-connectivity
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-node-reschedule
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-conformance
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-openbao-issuance
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-openbao-ha
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-openbao-restore
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-test-openbao-lifecycle
  namespace: kube-system
automountServiceAccountToken: false
---
# Sonobuoy's canonical workload and RBAC lifecycle requires administrator authority.
# This exception belongs only to the dedicated conformance identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-conformance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-test-conformance
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-test-flux-restart
  namespace: flux-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [source-controller, kustomize-controller, helm-controller, notification-controller]
    verbs: [patch, update]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [patch, update]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [flux-canary, cluster-apps]
    verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-test-flux-restart
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-test-flux-restart
subjects:
  - kind: ServiceAccount
    name: homelab-test-flux-restart
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-flux-restart-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: homelab-test-flux-restart
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-flux-restart-observation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-observer-extra
subjects:
  - kind: ServiceAccount
    name: homelab-test-flux-restart
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-test-node-scheduling
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
    resourceNames:
      - nuc1
      - nuc2
      - nuc3
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-node-scheduling
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-test-node-scheduling
subjects:
  - kind: ServiceAccount
    name: homelab-test-node-reschedule
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-test-node-reschedule-runtime
  namespace: media
rules:
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - get
      - create
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-test-node-reschedule-runtime
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-test-node-reschedule-runtime
subjects:
  - kind: ServiceAccount
    name: homelab-test-node-reschedule
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-node-reschedule-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: homelab-test-node-reschedule
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-test-node-reschedule-observation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-observer-extra
subjects:
  - kind: ServiceAccount
    name: homelab-test-node-reschedule
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-test-openbao-member-tunnels
  namespace: openbao
rules:
  - apiGroups:
      - ''
    resources:
      - pods/portforward
    resourceNames:
