---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: homelab-test-restore-databases
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [statefulsets]
  matchConditions:
    - name: test-runner
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:homelab-test-runner'
  variables:
    - name: workload
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: family
      expression: variables.workload.metadata.labels['homelab-talos/test']
    - name: run
      expression: variables.workload.metadata.labels['homelab-talos/run-id']
    - name: role
      expression: variables.workload.metadata.labels['homelab-talos/role']
    - name: n8n
      expression: variables.role == 'n8n-database'
    - name: prefix
      expression: "(variables.family == 'nocodb-restore-drill' ? 'nc' : 'ad') + '-restore-' + variables.run"
    - name: name
      expression: "variables.prefix + (variables.n8n ? '-n8n-db' : '-db')"
    - name: claim
      expression: "variables.prefix + (variables.n8n ? '-n8n-data' : variables.family == 'nocodb-restore-drill' ? '-db-data' : '-ad-data')"
    - name: labels
      expression: "{'homelab-talos/test': variables.family, 'homelab-talos/run-id': variables.run, 'homelab-talos/role': variables.role}"
    - name: pod
      expression: variables.workload.spec.template.spec
    - name: container
      expression: variables.pod.containers[0]
  validations:
    - expression: >-
        request.operation != 'UPDATE' && variables.run.matches('^[0-9a-f]{12}$') &&
        variables.workload.metadata.name == variables.name &&
        variables.workload.metadata.labels == variables.labels &&
        ((variables.family == 'automation-data-restore-drill' &&
          ((request.namespace == 'automation-data' && variables.role == 'ad-database') ||
           (request.namespace == 'automation' && variables.role == 'n8n-database'))) ||
         (variables.family == 'nocodb-restore-drill' && request.namespace == 'automation-data' && variables.role == 'database')) &&
        !has(variables.workload.metadata.annotations) && !has(variables.workload.metadata.ownerReferences) &&
        (!has(variables.workload.metadata.finalizers) || variables.workload.metadata.finalizers.size() == 0) &&
        variables.workload.spec.replicas == 1 && variables.workload.spec.serviceName == variables.name &&
        variables.workload.spec.selector.matchLabels == variables.labels &&
        !has(variables.workload.spec.selector.matchExpressions) &&
        variables.workload.spec.template.metadata.labels == variables.labels &&
        !has(variables.workload.spec.template.metadata.annotations) &&
        !has(variables.workload.spec.template.metadata.ownerReferences) &&
        !has(variables.workload.spec.template.metadata.finalizers) &&
        !has(variables.workload.spec.volumeClaimTemplates) && !has(variables.workload.spec.ordinals) &&
        (!has(variables.workload.spec.persistentVolumeClaimRetentionPolicy) ||
          (variables.workload.spec.persistentVolumeClaimRetentionPolicy.whenDeleted == 'Retain' &&
           variables.workload.spec.persistentVolumeClaimRetentionPolicy.whenScaled == 'Retain')) &&
        (!has(variables.workload.spec.podManagementPolicy) || variables.workload.spec.podManagementPolicy == 'OrderedReady') &&
        (!has(variables.workload.spec.updateStrategy) ||
          (variables.workload.spec.updateStrategy.type == 'RollingUpdate' &&
           (!has(variables.workload.spec.updateStrategy.rollingUpdate) ||
            ((!has(variables.workload.spec.updateStrategy.rollingUpdate.partition) || variables.workload.spec.updateStrategy.rollingUpdate.partition == 0) &&
             !has(variables.workload.spec.updateStrategy.rollingUpdate.maxUnavailable)))))
      message: Only new run-owned single-member restore databases are permitted.
    - expression: >-
        variables.pod.automountServiceAccountToken == false &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == '' || variables.pod.serviceAccountName == 'default') &&
        variables.pod.containers.size() == 1 && !has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers) &&
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) && (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        !has(variables.pod.hostAliases) && !has(variables.pod.dnsConfig) &&
        (!has(variables.pod.dnsPolicy) || variables.pod.dnsPolicy == 'ClusterFirst') &&
        !has(variables.pod.nodeName) && !has(variables.pod.nodeSelector) && !has(variables.pod.affinity) &&
        !has(variables.pod.imagePullSecrets) && !has(variables.pod.priorityClassName) && !has(variables.pod.resourceClaims) &&
        !has(variables.pod.runtimeClassName) &&
        !has(variables.pod.readinessGates) && !has(variables.pod.schedulingGates) &&
        (!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler') &&
        (!has(variables.pod.restartPolicy) || variables.pod.restartPolicy == 'Always') &&
        variables.pod.securityContext.fsGroup == 70 && variables.pod.securityContext.fsGroupChangePolicy == 'OnRootMismatch' &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        !has(variables.pod.securityContext.seccompProfile.localhostProfile) &&
        !has(variables.pod.securityContext.runAsUser) && !has(variables.pod.securityContext.runAsGroup) &&
        !has(variables.pod.securityContext.sysctls) && !has(variables.pod.securityContext.supplementalGroups) &&
        !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions) &&
        !has(variables.pod.securityContext.appArmorProfile)
      message: Restore databases cannot select another identity, host access, DNS override, or additional containers.
    - expression: >-
        variables.container.name == 'postgresql' && variables.container.image == 'postgres:17.11-alpine3.24' &&
        variables.container.imagePullPolicy == 'IfNotPresent' &&
        !has(variables.container.command) && !has(variables.container.args) && !has(variables.container.envFrom) &&
        !has(variables.container.lifecycle) && !has(variables.container.livenessProbe) && !has(variables.container.startupProbe) &&
        (!has(variables.container.stdin) || !variables.container.stdin) && (!has(variables.container.tty) || !variables.container.tty) &&
        !has(variables.container.volumeDevices) && !has(variables.container.restartPolicy) &&
        variables.container.securityContext.allowPrivilegeEscalation == false &&
        variables.container.securityContext.readOnlyRootFilesystem && variables.container.securityContext.runAsNonRoot &&
        variables.container.securityContext.runAsUser == 70 && variables.container.securityContext.runAsGroup == 70 &&
        variables.container.securityContext.capabilities.drop == ['ALL'] &&
        !has(variables.container.securityContext.capabilities.add) &&
        (!has(variables.container.securityContext.privileged) || !variables.container.securityContext.privileged) &&
        !has(variables.container.securityContext.procMount) && !has(variables.container.securityContext.seccompProfile) &&
        !has(variables.container.securityContext.seLinuxOptions) && !has(variables.container.securityContext.windowsOptions) &&
        !has(variables.container.securityContext.appArmorProfile) &&
        variables.container.resources.requests == {'cpu': '50m', 'memory': '128Mi'} &&
        variables.container.resources.limits == {'memory': '1Gi'} && !has(variables.container.resources.claims) &&
        variables.container.env.size() == (variables.n8n ? 4 : 3) &&
        variables.container.env.exists(e, e.name == 'PGDATA' && e.value == '/var/lib/postgresql/data/pgdata' && !has(e.valueFrom)) &&
        variables.container.env.exists(e, e.name == 'POSTGRES_DB' && e.value == 'postgres' && !has(e.valueFrom)) &&
        (!variables.n8n || variables.container.env.exists(e, e.name == 'POSTGRES_USER' && e.value == 'n8n' && !has(e.valueFrom))) &&
        variables.container.env.exists(e, e.name == 'POSTGRES_PASSWORD' && (!has(e.value) || e.value == '') &&
          e.valueFrom.secretKeyRef.name == 'postgresql-credentials' &&
          e.valueFrom.secretKeyRef.key == (variables.n8n ? 'n8n-password' : 'postgres-superuser-password') &&
          !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef))
      message: Restore databases must use the pinned PostgreSQL entrypoint and the fixed namespace credential reference.
    - expression: >-
        variables.pod.volumes.size() == 3 &&
        variables.pod.volumes.exists(v, v.name == 'data' && v.persistentVolumeClaim.claimName == variables.claim &&
          (!has(v.persistentVolumeClaim.readOnly) || !v.persistentVolumeClaim.readOnly)) &&
        variables.pod.volumes.exists(v, v.name == 'run' && has(v.emptyDir)) &&
        variables.pod.volumes.exists(v, v.name == 'tmp' && has(v.emptyDir)) &&
        variables.container.volumeMounts.size() == 3 &&
        variables.container.volumeMounts.exists(v, v.name == 'data' && v.mountPath == '/var/lib/postgresql/data') &&
        variables.container.volumeMounts.exists(v, v.name == 'run' && v.mountPath == '/var/run/postgresql') &&
        variables.container.volumeMounts.exists(v, v.name == 'tmp' && v.mountPath == '/tmp') &&
        variables.container.volumeMounts.all(v, !has(v.subPath) && !has(v.subPathExpr) &&
          (!has(v.readOnly) || !v.readOnly) && (!has(v.mountPropagation) || v.mountPropagation == 'None')) &&
        variables.container.ports.size() == 1 && variables.container.ports[0].name == 'postgresql' &&
        variables.container.ports[0].containerPort == 5432 &&
        (!has(variables.container.ports[0].hostPort) || variables.container.ports[0].hostPort == 0) &&
        (!has(variables.container.ports[0].hostIP) || variables.container.ports[0].hostIP == '') &&
        (!has(variables.container.ports[0].protocol) || variables.container.ports[0].protocol == 'TCP') &&
        variables.container.readinessProbe.exec.command == ['pg_isready', '--username=' + (variables.n8n ? 'n8n' : 'postgres'), '--dbname=postgres'] &&
        !has(variables.container.readinessProbe.httpGet) && !has(variables.container.readinessProbe.tcpSocket) &&
        !has(variables.container.readinessProbe.grpc) && variables.container.readinessProbe.periodSeconds == 5 &&
        variables.container.readinessProbe.failureThreshold == (variables.family == 'nocodb-restore-drill' ? 120 : 60)
      message: Restore databases may mount only their fresh claim and expose the canonical local readiness command.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: homelab-test-restore-databases
spec:
  policyName: homelab-test-restore-databases
  validationActions: [Deny]
