---
# Applied to the built-in "default" group, so every Longhorn volume is covered
# unless it opts out. Daily snapshot retained 7 days; daily backup to the CIFS
# target retained 7 days.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: snapshot
  groups:
    - default
  retain: 7
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 2
---
# Loki compaction and retention remove files inside the volume. This weekly trim
# reports the resulting free blocks to Longhorn so replicas can reclaim space.
# It intentionally does not join the default snapshot and backup group.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: loki-filesystem-trim
  namespace: longhorn-system
spec:
  cron: "0 4 * * 0"
  task: filesystem-trim
  retain: 0
  concurrency: 1
