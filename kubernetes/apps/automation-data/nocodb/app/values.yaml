---
replicaCount: 1

updateStrategy:
  type: Recreate
  # Helm otherwise merges the chart's default RollingUpdate fields into this strategy,
  # which Kubernetes rejects for a Recreate Deployment.
  rollingUpdate: null

worker:
  enabled: false

autoscaling:
  enabled: false

image:
  registry: docker.io
  repository: nocodb/nocodb
  tag: "2026.10.1"
  digest: sha256:8c2dd06896d95e750d55010e529972c22c1ee73b22dce321b1d2de2e7d5cd6ae

externalDatabase:
  existingSecret: nocodb-credentials
  existingSecretUrlKey: DATABASE_URL

auth:
  existingSecret: nocodb-credentials

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

networkPolicy:
  enabled: false

nocodb:
  publicUrl: https://nocodb.lab.supermorphic.com
  disableMux: true
  disableTelemetry: true
  extraEnvVars:
    - name: NC_ALLOW_LOCAL_EXTERNAL_DBS
      value: "true"
    - name: NC_DISABLE_SINGLE_SESSION_ENFORCEMENT
      value: "true"
    - name: NC_DISABLE_SUPPORT_CHAT
      value: "true"
    - name: NC_ADMIN_EMAIL
      valueFrom:
        secretKeyRef:
          name: nocodb-credentials
          key: NC_ADMIN_EMAIL
    - name: NC_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nocodb-credentials
          key: NC_ADMIN_PASSWORD
