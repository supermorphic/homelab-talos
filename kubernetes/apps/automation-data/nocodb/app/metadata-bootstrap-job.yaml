---
apiVersion: batch/v1
kind: Job
metadata:
  name: nocodb-metadata-bootstrap
  labels:
    app.kubernetes.io/name: nocodb-metadata-bootstrap
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nocodb-metadata-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:17.11-alpine3.24
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
              \set metadata_password `printenv NOCODB_METADATA_PASSWORD`
              SELECT platform_operations.provision_nocodb_metadata(:'metadata_password');
              SQL
          env:
            - name: PGDATABASE
              value: automation_data_control
            - name: PGHOST
              value: automation-data-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: automation_data_provisioner
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: provisioner-password
            - name: NOCODB_METADATA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nocodb-credentials
                  key: metadata-password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
