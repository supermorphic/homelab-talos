---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation-data
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./cronjob.yaml
  - ./persistentvolumeclaims.yaml
  - ./postgresql-credentials.sops.yaml
  - ./scoped-test-fixtures.yaml
  - ./service.yaml
  - ./servicemonitor.yaml
  - ./statefulset.yaml
configMapGenerator:
  - name: automation-data-test-helpers-v1
    options:
      immutable: true
      disableNameSuffixHash: true
    files:
      - restore-validation.sh=test-helpers/restore-validation.sh
      - restore-permissions.sh=test-helpers/restore-permissions.sh
      - restore-selection.sh=test-helpers/restore-selection.sh
      - restore-body.sh=test-helpers/restore-body.sh
      - automation-data-restore.sh=test-helpers/automation-data-restore.sh
      - nocodb-restore-preflight.sh=test-helpers/nocodb-restore-preflight.sh
      - nocodb-restore.sh=test-helpers/nocodb-restore.sh
      - nocodb-restore-assertions.sh=test-helpers/nocodb-restore-assertions.sh
      - nocodb-application-probe.sh=test-helpers/nocodb-application-probe.sh
      - provision-error.sh=test-helpers/provision-error.sh
      - automation-data-bundle.sh=test-helpers/automation-data-bundle.sh
      - backup.sh=scripts/backup.sh
      - update-backup-status.sql=scripts/update-backup-status.sql
  - name: automation-data-postgresql-init
    files:
      - init-platform.sh=scripts/init-platform.sh
      - nocodb-extension.sql=scripts/nocodb-extension.sql
      - application-login.sql=scripts/application-login.sql
      - nocodb-metadata.sql=scripts/nocodb-metadata.sql
      - platform-control.sql=scripts/platform-control.sql
      - domain-validation.sql=scripts/domain-validation.sql
      - migrate-control.sh=scripts/migrate-control.sh
  - name: automation-data-postgresql-backup
    files:
      - backup.sh=scripts/backup.sh
      - update-backup-status.sql=scripts/update-backup-status.sql
  - name: automation-data-postgresql-upgrade
    files:
      - credential-discovery.sql=scripts/credential-discovery.sql
      - nocodb-discovery.sql=scripts/nocodb-discovery.sql
      - nocodb-extension.sql=scripts/nocodb-extension.sql
      - application-login.sql=scripts/application-login.sql
      - nocodb-metadata.sql=scripts/nocodb-metadata.sql
      - upgrade-nocodb.sql=scripts/upgrade-nocodb.sql
      - domain-validation.sql=scripts/domain-validation.sql
  - name: automation-data-postgresql-sql-exporter
    files:
      - sql-exporter.yml
generatorOptions:
  labels:
    reconcile.fluxcd.io/watch: Enabled
