---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: automation-data-postgresql
  labels:
    app.kubernetes.io/name: automation-data-postgresql
spec:
  replicas: 1
  serviceName: automation-data-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: automation-data-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-data-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:17.11-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: automation_data_control
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --auth-local=trust
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-superuser-password
            - name: PROVISIONER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: provisioner-password
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: backup-password
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: exporter-password
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - pg_isready
                - --host=127.0.0.1
                - --port=5432
                - --username=postgres
                - --dbname=automation_data_control
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --host=127.0.0.1
                - --port=5432
                - --username=postgres
                - --dbname=automation_data_control
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - --host=127.0.0.1
                - --port=5432
                - --username=postgres
                - --dbname=automation_data_control
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/00-init-platform.sh
              subPath: init-platform.sh
              readOnly: true
            - name: init
              mountPath: /scripts/platform-control.sql
              subPath: platform-control.sql
              readOnly: true
            - name: postgresql-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
        - name: sql-exporter
          image: burningalchemist/sql_exporter:0.24.6
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/config/sql-exporter.yml
            - --web.listen-address=:9399
          env:
            - name: SQLEXPORTER_TARGET_DSN
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: exporter-dsn
          ports:
            - name: metrics
              containerPort: 9399
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: sql-exporter
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: automation-data-postgresql-data
        - name: init
          configMap:
            name: automation-data-postgresql-init
            defaultMode: 0555
        - name: postgresql-run
          emptyDir: {}
        - name: sql-exporter
          configMap:
            name: automation-data-postgresql-sql-exporter
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
