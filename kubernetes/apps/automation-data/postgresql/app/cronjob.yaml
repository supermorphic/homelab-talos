---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: automation-data-postgresql-backup
  labels:
    app.kubernetes.io/name: automation-data-postgresql-backup
spec:
  schedule: "30 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: automation-data-postgresql-backup
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: automation-data-postgresql-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17.11-alpine3.24
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/backup.sh
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: PGDATABASE
                  value: automation_data_control
                - name: PGHOST
                  value: automation-data-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: automation_data_backup
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: backup-password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: backup-script
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: backup-script
                  mountPath: /scripts/update-backup-status.sql
                  subPath: update-backup-status.sql
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: automation-data-postgresql-backups
            - name: backup-script
              configMap:
                name: automation-data-postgresql-backup
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
