---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: career-ops-boundary-releases
  namespace: career-ops
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: career-ops-retain
  accessModes:
  - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
