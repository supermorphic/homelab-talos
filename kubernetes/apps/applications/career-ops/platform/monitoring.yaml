---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: career-ops-coordinator
  namespace: career-ops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cv-coordinator
  namespaceSelector:
    matchNames:
    - career-ops
  endpoints:
  - port: metrics
    path: /metrics
    interval: 1m
    scrapeTimeout: 10s
    metricRelabelings:
    - action: keep
      sourceLabels:
      - __name__
      regex: cv_render_(metrics_schema_info|ready|database_ready|renderer_egress_blocked|overdue_work|recent_failures)
    - action: labelkeep
      regex: __name__|namespace|service|job|instance|endpoint|pod|version
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: career-ops-coordinator
  namespace: career-ops
spec:
  groups:
  - name: career-ops.availability
    interval: 1m
    rules:
    - record: career_ops_coordinator_expected
      expr: vector(1)
    # Any missing or unhealthy required signal means renders, uploads and downloads
    # are blocked; an absent target must alert as well as up == 0.
    - alert: CareerOpsCVServiceDown
      expr: (((min(up{namespace="career-ops",service="cv-coordinator"}) or vector(0)) == 0) or ((min(cv_render_ready{namespace="career-ops",service="cv-coordinator"}) or vector(0))
        != 1) or ((min(cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}) or vector(0)) != 1) or ((min(cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"})
        or vector(0)) != 1) or ((max(cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}) or vector(0)) != 1) or
        (max(absent(cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"})) == 1) or (max(absent(cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"})) == 1))
        and on() (career_ops_coordinator_expected == 1)
      for: 5m
      labels:
        namespace: career-ops
        service: cv-coordinator
        severity: critical
      annotations:
        summary: Career Ops CV service is down
        description: 'CV renders, uploads and downloads are blocked. Status: https://cv.lab.supermorphic.com/readyz'
    - alert: CareerOpsCVWorkStuck
      expr: (max(cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}) > 0) and on() (career_ops_coordinator_expected == 1)
      for: 15m
      labels:
        namespace: career-ops
        service: cv-coordinator
        severity: warning
      annotations:
        summary: Career Ops CV work is stuck
        description: 'At least one CV request is past its deadline. Status: https://cv.lab.supermorphic.com/readyz'
    # Designed outcomes such as a page overflow return to composition and are not
    # counted; the application keeps a one-hour failure window, so this resolves.
    - alert: CareerOpsCVRendersFailing
      expr: (max(cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}) > 0) and on() (career_ops_coordinator_expected == 1)
      for: 1m
      labels:
        namespace: career-ops
        service: cv-coordinator
        severity: warning
      annotations:
        summary: Career Ops CV renders are failing
        description: 'A CV request exhausted its retries or failed for an infrastructure reason in the last hour.
          Status: https://cv.lab.supermorphic.com/readyz'
