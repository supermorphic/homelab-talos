---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: career-ops-boundary-coordinator
  namespace: career-ops
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: career-ops-boundary-renderer
  namespace: career-ops
automountServiceAccountToken: false
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: career-ops-boundary-fixtures
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: career-ops
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      operations:
      - CREATE
      - UPDATE
      - DELETE
    - apiGroups:
      - batch
      apiVersions:
      - v1
      resources:
      - jobs
      operations:
      - CREATE
      - UPDATE
      - DELETE
  variables:
  - name: item
    expression: 'request.operation == ''DELETE'' ? dyn(oldObject) : dyn(object)'
  - name: pod
    expression: 'variables.item.kind == ''Pod'' ? variables.item.spec : variables.item.spec.template.spec'
  - name: meta
    expression: 'variables.item.kind == ''Pod'' ? variables.item.metadata : variables.item.spec.template.metadata'
  - name: account
    expression: 'has(variables.pod.serviceAccountName) ? variables.pod.serviceAccountName : ''default'''
  - name: fixture
    expression: variables.account in ['career-ops-boundary-coordinator','career-ops-boundary-renderer']
  - name: jobName
    expression: 'variables.item.kind == ''Job'' ? variables.item.metadata.name : (has(variables.item.metadata.ownerReferences)
      && variables.item.metadata.ownerReferences.size() == 1 ? variables.item.metadata.ownerReferences[0].name :
      '''')'
  - name: mode
    expression: 'variables.jobName == ''career-ops-boundary-seed'' ? ''seed'' : variables.jobName == ''career-ops-boundary-write''
      ? ''write'' : variables.jobName == ''career-ops-boundary-read'' ? ''read'' : ''cleanup'''
  - name: controller
    expression: request.userInfo.username in ['system:kube-controller-manager','system:serviceaccount:kube-system:job-controller','system:serviceaccount:kube-system:generic-garbage-collector']
  validations:
  - expression: variables.item.kind != 'Job' || !(variables.item.metadata.name in ['career-ops-boundary-seed','career-ops-boundary-write','career-ops-boundary-read','career-ops-boundary-cleanup'])
      || variables.fixture
    message: Native fixture Job names require their isolated identities.
  - expression: '!variables.fixture || (variables.item.kind in [''Job'',''Pod''] && variables.jobName in [''career-ops-boundary-seed'',''career-ops-boundary-write'',''career-ops-boundary-read'',''career-ops-boundary-cleanup'']
      && variables.account == (variables.mode in [''seed'',''cleanup''] ? ''career-ops-boundary-coordinator'' :
      ''career-ops-boundary-renderer''))'
    message: Native identities are limited to four named fixture Jobs and their Pods.
  - expression: '!variables.fixture || (variables.item.kind == ''Job'' ? ((request.userInfo.username == ''system:serviceaccount:kube-system:homelab-test-runner''
      && request.operation in [''CREATE'',''DELETE'']) || (variables.controller && request.operation == ''UPDATE''))
      && (!has(variables.item.metadata.ownerReferences) || variables.item.metadata.ownerReferences.size() == 0)
      : ((variables.controller || (request.operation == ''UPDATE'' && request.userInfo.username.startsWith(''system:node:'')))
      && variables.item.metadata.ownerReferences.size() == 1 && variables.item.metadata.ownerReferences[0].kind
      == ''Job'' && variables.item.metadata.ownerReferences[0].apiVersion == ''batch/v1'' && has(variables.item.metadata.ownerReferences[0].controller)
      && variables.item.metadata.ownerReferences[0].controller))'
    message: Only the test runner creates fixture Jobs; only trusted controllers create their Pods.
  - expression: '!variables.fixture || (variables.pod.containers.size() == 1 && variables.pod.containers[0].image
      == ''python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6'' && variables.pod.containers[0].command
      == [''python'',''-I'',''-B'',''/fixture/probe.py''] && variables.pod.containers[0].args.size() == 5 && variables.pod.containers[0].args[0]
      == variables.mode && variables.pod.containers[0].args[1].matches(''^[0-9a-f]{32}$'') && [variables.pod.containers[0].args[2],variables.pod.containers[0].args[3],variables.pod.containers[0].args[4]].all(a,
      a.matches(''^[0-9]{1,3}([.][0-9]{1,3}){3}$'')) && !has(variables.pod.containers[0].env) && !has(variables.pod.containers[0].envFrom) && !has(variables.pod.containers[0].lifecycle) && !has(variables.pod.containers[0].livenessProbe) && !has(variables.pod.containers[0].readinessProbe) && !has(variables.pod.containers[0].startupProbe)
      && (!has(variables.pod.containers[0].workingDir) || variables.pod.containers[0].workingDir == ''/''))'
    message: Fixture images, commands, phases and non-secret arguments are fixed.
  - expression: '!variables.fixture || (has(variables.meta.labels) && ''homelab.supermorphic.com/test-run'' in variables.meta.labels
      && variables.meta.labels[''homelab.supermorphic.com/test-run''] == variables.pod.containers[0].args[1] && variables.meta.labels[''homelab.supermorphic.com/test-phase''] == variables.mode &&
      (variables.item.kind != ''Job'' || variables.item.metadata.labels[''homelab.supermorphic.com/test-run''] ==
      variables.pod.containers[0].args[1]))'
    message: Fixture run ownership must match its program arguments.
  - expression: '!variables.fixture || (variables.pod.securityContext.runAsUser == 1000 && variables.pod.securityContext.fsGroup
      == 1000 && !has(variables.pod.securityContext.supplementalGroups) && (!has(variables.pod.nodeSelector) ||
      (variables.pod.nodeSelector.size() == 1 && ''kubernetes.io/hostname'' in variables.pod.nodeSelector)) && !has(variables.pod.affinity)
      && (!has(variables.pod.tolerations) || (variables.item.kind == ''Pod'' && variables.pod.tolerations.size() <= 2 && variables.pod.tolerations.all(t, t.key in [''node.kubernetes.io/not-ready'',''node.kubernetes.io/unreachable''] && t.operator == ''Exists'' && t.effect == ''NoExecute'' && t.tolerationSeconds == 300 && t.all(k, k in [''key'',''operator'',''effect'',''tolerationSeconds''])))) && !has(variables.pod.priorityClassName))'
    message: Fixture scheduling and filesystem identities are bounded.
  - expression: '!variables.fixture || (has(variables.pod.volumes) && variables.pod.volumes.exists(v, v.name ==
      ''program'' && has(v.configMap) && v.configMap.name == ''career-ops-boundary-program'') && variables.pod.volumes.all(v,
      has(v.configMap) || has(v.persistentVolumeClaim)))'
    message: Fixtures use only the platform program and isolated claims.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: career-ops-boundary-fixtures
spec:
  policyName: career-ops-boundary-fixtures
  validationActions:
  - Deny
