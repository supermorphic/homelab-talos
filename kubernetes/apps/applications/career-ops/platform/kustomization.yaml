---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./namespace.yaml
- ./rbac.yaml
- ./workload-admission.yaml
- ./resource-admission.yaml
- ./network-policy.yaml
- ./storageclass.yaml
- ./quota.yaml
- ./monitoring.yaml
- ./native-fixtures.yaml
configMapGenerator:
- name: career-ops-boundary-program
  namespace: career-ops
  files:
  - probe.py=native-probe.py
  - mount-probe.py
  options:
    disableNameSuffixHash: true
