---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: career-ops-deny
  namespace: career-ops
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
  - fromEntities:
    - none
  egress:
  - toEntities:
    - none
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: career-ops-coordinator
  namespace: career-ops
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: cv-coordinator
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: envoy-gateway-system
        gateway.envoyproxy.io/owning-gateway-name: internal
        gateway.envoyproxy.io/owning-gateway-namespace: networking
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: prometheus
        operator.prometheus.io/name: kube-prometheus-stack-prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: TCP
      - port: '53'
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: automation-data
        app.kubernetes.io/name: automation-data-postgresql
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: cv-renderer
        k8s:io.kubernetes.pod.namespace: career-ops
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
---
# The sandboxed renderer accepts render calls from the coordinator only and has
# no egress rule, so the namespace default-deny blocks all of its traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: career-ops-renderer
  namespace: career-ops
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: cv-renderer
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.policy.serviceaccount: cv-coordinator
        k8s:io.kubernetes.pod.namespace: career-ops
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: career-ops-boundary-coordinator
  namespace: career-ops
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: career-ops-boundary-coordinator
  ingress: []
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: TCP
      - port: '53'
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: automation-data
        app.kubernetes.io/name: automation-data-postgresql
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
---
# Shared HTTPS destinations: application download validation owns exact paths and hashes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: career-ops-preparation
  namespace: career-ops
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.policy.serviceaccount: cv-prepare
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: TCP
      - port: '53'
        protocol: UDP
      rules:
        dns:
        - matchName: corefonts.sourceforge.net
        - matchName: deb.debian.org
        - matchName: downloads.sourceforge.net
        - matchName: files.pythonhosted.org
        - matchName: forgejo.infra.supermorphic.com
        - matchName: packages.typst.org
        - matchName: psychz.dl.sourceforge.net
  - toFQDNs:
    - matchName: corefonts.sourceforge.net
    - matchName: deb.debian.org
    - matchName: downloads.sourceforge.net
    - matchName: files.pythonhosted.org
    - matchName: forgejo.infra.supermorphic.com
    - matchName: packages.typst.org
    - matchName: psychz.dl.sourceforge.net
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
