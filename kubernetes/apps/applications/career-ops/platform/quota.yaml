---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: career-ops-capacity
  namespace: career-ops
spec:
  hard:
    requests.cpu: 250m
    limits.cpu: '6'
    requests.memory: 1088Mi
    limits.memory: 8Gi
    requests.ephemeral-storage: 384Mi
    limits.ephemeral-storage: 12Gi
    pods: '6'
    count/jobs.batch: '2'
    count/deployments.apps: '4'
    services: '4'
    count/httproutes.gateway.networking.k8s.io: '2'
    configmaps: '32'
    count/serviceaccounts: '10'
    count/rolebindings.rbac.authorization.k8s.io: '4'
    persistentvolumeclaims: '0'
    requests.storage: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: career-ops-container-bounds
  namespace: career-ops
spec:
  limits:
  - type: Container
    min:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 64Mi
    max:
      cpu: '2'
      memory: 4Gi
      ephemeral-storage: 4Gi
