---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: career-ops-capacity
  namespace: career-ops
spec:
  hard:
    requests.cpu: '6'
    limits.cpu: '16'
    requests.memory: 12Gi
    limits.memory: 24Gi
    requests.ephemeral-storage: 16Gi
    limits.ephemeral-storage: 32Gi
    pods: '16'
    count/jobs.batch: '64'
    count/deployments.apps: '4'
    services: '8'
    count/httproutes.gateway.networking.k8s.io: '4'
    configmaps: '64'
    count/serviceaccounts: '16'
    count/rolebindings.rbac.authorization.k8s.io: '16'
    persistentvolumeclaims: '10'
    requests.storage: 64Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: career-ops-container-bounds
  namespace: career-ops
spec:
  limits:
  - type: Container
    min:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 64Mi
    max:
      cpu: '2'
      memory: 4Gi
      ephemeral-storage: 4Gi
