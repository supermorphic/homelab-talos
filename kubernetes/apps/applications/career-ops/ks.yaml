---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: career-ops-platform
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
  - name: cilium
  - name: internal-gateway
  - name: automation-data-postgresql
  - name: longhorn-config
  - name: kube-prometheus-stack
  interval: 1h
  path: ./kubernetes/apps/applications/career-ops/platform
  prune: false
  deletionPolicy: Orphan
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: false
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: career-ops-connection
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
  - name: career-ops-platform
  interval: 1h
  path: ./kubernetes/apps/applications/career-ops/connection
  prune: false
  deletionPolicy: Orphan
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  suspend: true
  timeout: 5m
  wait: true
