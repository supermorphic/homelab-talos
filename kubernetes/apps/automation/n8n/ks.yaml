---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  dependsOn:
    - name: automation
    - name: cilium
    - name: internal-gateway
    - name: kube-prometheus-stack
    - name: longhorn
    - name: n8n-postgresql
    - name: public-webhook-gateway
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/apps/automation/n8n/app
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Task 9 selects operator-generated ciphertext before the attended rollout.
  suspend: false
  timeout: 15m
  wait: true
