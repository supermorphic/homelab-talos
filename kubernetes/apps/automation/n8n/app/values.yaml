image:
  repository: docker.n8n.io/n8nio/n8n
  tag: 2.36.7

replicaCount: 1

queueMode:
  enabled: false

webhookProcessor:
  enabled: false

multiMain:
  enabled: false

taskRunners:
  enabled: false
  # Chart 1.11.0 otherwise creates an unused random auth Secret even while disabled.
  authToken:
    existingSecret: n8n-runtime
    existingSecretKey: N8N_RUNNERS_AUTH_TOKEN

strategy:
  type: Recreate

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: false
  webhookProcessor:
    enabled: false

persistence:
  enabled: true
  existingClaim: n8n-data

resources:
  main:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: null
      memory: 1Gi

rbac:
  create: false

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: false

networkPolicy:
  enabled: false

hpa:
  main:
    enabled: false
  worker:
    enabled: false
  webhookProcessor:
    enabled: false

keda:
  enabled: false

pdb:
  enabled: false

webhook:
  enabled: true
  url: ""

executions:
  data:
    saveOnError: all
    saveOnSuccess: all
    saveOnProgress: false
    saveManualExecutions: true
  pruning:
    enabled: true
    maxAge: 336
    maxCount: 10000

config:
  timezone: America/Denver
  extraEnv:
    - name: N8N_WEBHOOK_URL
      value: https://hooks.lab.supermorphic.com/
    - name: N8N_EDITOR_BASE_URL
      value: https://n8n.lab.supermorphic.com/
    - name: N8N_PROXY_HOPS
      value: "1"
    - name: N8N_METRICS
      value: "true"
    - name: N8N_METRICS_INCLUDE_WORKFLOW_STATISTICS
      value: "true"
    - name: N8N_METRICS_INCLUDE_DB_POOL_METRICS
      value: "true"
    - name: N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL
      value: "false"
    - name: N8N_METRICS_INCLUDE_NODE_TYPE_LABEL
      value: "false"
    - name: N8N_METRICS_INCLUDE_CREDENTIAL_TYPE_LABEL
      value: "false"
    - name: N8N_DIAGNOSTICS_ENABLED
      value: "false"
    - name: N8N_VERSION_NOTIFICATIONS_ENABLED
      value: "false"
    - name: N8N_PERSONALIZATION_ENABLED
      value: "false"
    - name: N8N_DEFAULT_BINARY_DATA_MODE
      value: filesystem

secretRefs:
  existingSecret: n8n-runtime

database:
  type: postgresdb
  useExternal: true
  host: n8n-postgresql.automation.svc.cluster.local
  port: 5432
  database: n8n
  schema: public
  user: n8n
  passwordSecret:
    name: postgresql-credentials
    key: n8n-password

redis:
  enabled: false

s3:
  enabled: false

license:
  enabled: false
