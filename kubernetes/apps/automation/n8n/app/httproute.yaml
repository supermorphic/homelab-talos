---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  annotations:
    external-dns.k8s.io/audience: internal
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "n8n"
    gethomepage.dev/description: "Workflow automation"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "n8n.svg"
    gethomepage.dev/href: "https://n8n.lab.supermorphic.com"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=n8n"
spec:
  hostnames:
    - n8n.lab.supermorphic.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: n8n
          port: 5678
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
