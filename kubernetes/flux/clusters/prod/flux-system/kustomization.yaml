---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: kustomize-controller
  patch: "- op: add\n  path: /spec/template/spec/containers/0/args/-\n  value: --no-remote-bases=true\n"
