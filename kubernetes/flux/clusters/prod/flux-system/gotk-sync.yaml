# Flux bootstrap source; changes require review and an attended source cutover.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system-forgejo
  url: https://forgejo.infra.supermorphic.com/supermorphic/homelab-talos.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/flux/clusters/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
