<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img" aria-labelledby="title desc">
  <title id="title">Plex dedicated public Envoy trust boundaries</title>
  <desc id="desc">The public path from the untrusted Internet through the UniFi WAN boundary, a dedicated public Envoy Gateway, and the Cilium ingress boundary to the Plex pod with its writable config volume and read-only media. Separate branches show the consequences of an Envoy compromise and a Plex compromise, followed by what the design does not expose, the DDNS credential and TLS key boundaries, and a comparative exposure ranking of Relay, the dedicated Envoy, and direct Plex publication.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101727"/>
      <stop offset="1" stop-color="#171226"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <style>
      text { font-family: Helvetica; }
      .title { font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 22px; font-weight: 400; fill: #aeb9ca; }
      .section { font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #b8c4d5; }
      .heading { font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 18px; font-weight: 400; fill: #d2d9e5; }
      .small { font-size: 16px; font-weight: 400; fill: #c5cfdd; }
      .strong { font-weight: 700; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1800" height="1210" fill="url(#background)"/>

  <text x="72" y="74" class="title">Dedicated public Envoy — trust boundaries</text>
  <text x="72" y="112" class="subtitle">What one WAN port on a dedicated data plane exposes, and what still separates it from the rest of the homelab</text>

  <rect x="72" y="150" width="1656" height="282" rx="18" fill="#1b2434" stroke="#344156" filter="url(#shadow)"/>
  <rect x="72" y="150" width="1656" height="50" rx="18" fill="#253147"/>
  <rect x="72" y="182" width="1656" height="18" fill="#253147"/>
  <text x="98" y="183" class="body" fill="#f8fafc">Inbound public path — four boundaries before Plex</text>

  <g>
    <rect x="104" y="218" width="284" height="192" rx="14" fill="#451a1a" stroke="#ef4444" stroke-width="3"/>
    <text x="128" y="251" class="label">UNTRUSTED</text>
    <text x="128" y="290" class="heading">Internet</text>
    <text x="128" y="323" class="small">
      <tspan x="128" dy="0">Scanning and probing are</tspan>
      <tspan x="128" dy="24" class="strong">certain</tspan>
      <tspan x="128" dy="24">once 443 is open.</tspan>
      <tspan x="128" dy="24">Exploitation is not.</tspan>
    </text>

    <line x1="394" y1="314" x2="410" y2="314" stroke="#f87171" stroke-width="5"/>
    <path d="M420 314 L408 306 L408 322 Z" fill="#f87171"/>

    <rect x="431" y="218" width="284" height="192" rx="14" fill="#422006" stroke="#f59e0b" stroke-width="3"/>
    <text x="455" y="251" class="label">BOUNDARY 1</text>
    <text x="455" y="290" class="heading">UniFi WAN</text>
    <text x="455" y="323" class="small">
      <tspan x="455" dy="0">Stateful firewall.</tspan>
      <tspan x="455" dy="24" class="strong">One DNAT: TCP 443</tspan>
      <tspan x="455" dy="24">to one VIP. No UPnP,</tspan>
      <tspan x="455" dy="24">no AAAA, no IPv6.</tspan>
    </text>

    <line x1="721" y1="314" x2="737" y2="314" stroke="#fbbf24" stroke-width="5"/>
    <path d="M747 314 L735 306 L735 322 Z" fill="#fbbf24"/>

    <rect x="758" y="218" width="284" height="192" rx="14" fill="#0e2f3a" stroke="#22d3ee" stroke-width="3"/>
    <text x="782" y="251" class="label">BOUNDARY 2</text>
    <text x="782" y="290" class="heading">Public Envoy</text>
    <text x="782" y="323" class="small">
      <tspan x="782" dy="0">Terminates TLS and</tspan>
      <tspan x="782" dy="24">normalises HTTP. Serves</tspan>
      <tspan x="782" dy="24">one exact hostname.</tspan>
      <tspan x="782" dy="24" class="strong">Does not authenticate.</tspan>
    </text>

    <line x1="1048" y1="314" x2="1064" y2="314" stroke="#67e8f9" stroke-width="5"/>
    <path d="M1074 314 L1062 306 L1062 322 Z" fill="#67e8f9"/>

    <rect x="1085" y="218" width="284" height="192" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
    <text x="1109" y="251" class="label">BOUNDARY 3</text>
    <text x="1109" y="290" class="heading">Cilium ingress</text>
    <text x="1109" y="323" class="small">
      <tspan x="1109" dy="0">Only observed consumers</tspan>
      <tspan x="1109" dy="24">may reach TCP 32400.</tspan>
      <tspan x="1109" dy="24">Egress limited to DNS</tspan>
      <tspan x="1109" dy="24">and world:443.</tspan>
    </text>

    <line x1="1375" y1="314" x2="1391" y2="314" stroke="#60a5fa" stroke-width="5"/>
    <path d="M1401 314 L1389 306 L1389 322 Z" fill="#60a5fa"/>

    <rect x="1412" y="218" width="284" height="192" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="3"/>
    <text x="1436" y="251" class="label">ATTACK SURFACE</text>
    <text x="1436" y="290" class="heading">Plex pod</text>
    <text x="1436" y="323" class="small">
      <tspan x="1436" dy="0">Non-root 568, caps</tspan>
      <tspan x="1436" dy="24">dropped, no SA token.</tspan>
      <tspan x="1436" dy="24" class="strong">Config PVC writable.</tspan>
      <tspan x="1436" dy="24" class="strong">Media read-only.</tspan>
    </text>
  </g>

  <text x="72" y="472" class="section">Two distinct compromise branches</text>

  <g>
    <rect x="72" y="496" width="808" height="300" rx="16" fill="#1d2636" stroke="#22d3ee" stroke-width="2"/>
    <text x="100" y="537" class="heading" fill="#67e8f9">If the public Envoy is compromised</text>
    <circle cx="108" cy="577" r="5" fill="#22d3ee"/>
    <text x="126" y="584" class="small">The attacker holds the Plex hostname's key only. The wildcard</text>
    <text x="126" y="608" class="small">covering every other internal service is untouched.</text>
    <circle cx="108" cy="642" r="5" fill="#22d3ee"/>
    <text x="126" y="649" class="small">Requests can be proxied to Plex, but the Cilium policy still</text>
    <text x="126" y="673" class="small">bounds everything Plex itself is permitted to reach.</text>
    <circle cx="108" cy="707" r="5" fill="#22d3ee"/>
    <text x="126" y="714" class="small">Removing the single UniFi DNAT ends the exposure and leaves</text>
    <text x="126" y="738" class="small">every internal path serving unchanged.</text>

    <rect x="920" y="496" width="808" height="300" rx="16" fill="#1d2636" stroke="#ef4444" stroke-width="2"/>
    <text x="948" y="537" class="heading" fill="#fca5a5">If Plex is compromised</text>
    <circle cx="956" cy="577" r="5" fill="#fb7185"/>
    <text x="974" y="584" class="small">Read or alter the database, server token, metadata, and</text>
    <text x="974" y="608" class="small">settings on the writable config volume.</text>
    <circle cx="956" cy="642" r="5" fill="#fb7185"/>
    <text x="974" y="649" class="small">Media is mounted read-only: it can be read and exfiltrated,</text>
    <text x="974" y="673" class="small">but not encrypted or destroyed.</text>
    <circle cx="956" cy="707" r="5" fill="#fb7185"/>
    <text x="974" y="714" class="small">No service-account token, so the Kubernetes API is not directly</text>
    <text x="974" y="738" class="small">reachable. Node, kernel, and GPU escape remain residual.</text>
  </g>

  <g>
    <rect x="72" y="828" width="525" height="300" rx="16" fill="#102a25" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="869" class="heading" fill="#6ee7b7">Not exposed by this design</text>
    <circle cx="108" cy="909" r="5" fill="#34d399"/>
    <text x="126" y="916" class="small">No route to the shared internal gateway,</text>
    <text x="126" y="940" class="small">and no wildcard public route.</text>
    <circle cx="108" cy="974" r="5" fill="#34d399"/>
    <text x="126" y="981" class="small">No Kubernetes API, Talos API, node admin,</text>
    <text x="126" y="1005" class="small">or Envoy admin endpoint is reachable.</text>
    <circle cx="108" cy="1039" r="5" fill="#34d399"/>
    <text x="126" y="1046" class="small">No arbitrary cluster service and no arbitrary</text>
    <text x="126" y="1070" class="small">VLAN port. One host, one backend, one port.</text>

    <rect x="637" y="828" width="525" height="300" rx="16" fill="#2b2109" stroke="#f59e0b" stroke-width="2"/>
    <text x="665" y="869" class="heading" fill="#fcd34d">Credential and key boundaries</text>
    <circle cx="673" cy="909" r="5" fill="#fbbf24"/>
    <text x="691" y="916" class="small">DDNS token: zone-scoped, expiring, held by</text>
    <text x="691" y="940" class="small">UniFi. Separate from cert-manager's token.</text>
    <circle cx="673" cy="974" r="5" fill="#fbbf24"/>
    <text x="691" y="981" class="small">Public TLS key: scoped to the Plex hostname.</text>
    <text x="691" y="1005" class="small">Never the wildcard, never a shared key.</text>
    <circle cx="673" cy="1039" r="5" fill="#fbbf24"/>
    <text x="691" y="1046" class="small">A stolen DNS token can still repoint other</text>
    <text x="691" y="1070" class="small">records in the zone. Accepted residual risk.</text>

    <rect x="1202" y="828" width="526" height="300" rx="16" fill="#1b2434" stroke="#475569" stroke-width="2"/>
    <text x="1230" y="869" class="heading">Comparative exposure ranking</text>

    <rect x="1230" y="890" width="470" height="68" rx="10" fill="#102a25" stroke="#10b981" stroke-width="2"/>
    <text x="1248" y="918" class="body strong">Plex Relay — fallback</text>
    <text x="1248" y="942" class="small">Lowest exposure; cannot meet the Sonos goal.</text>

    <rect x="1230" y="970" width="470" height="68" rx="10" fill="#0e2f3a" stroke="#22d3ee" stroke-width="2"/>
    <text x="1248" y="998" class="body strong">Dedicated public Envoy — selected</text>
    <text x="1248" y="1022" class="small">Hardened edge, exact hostname, isolated key.</text>

    <rect x="1230" y="1050" width="470" height="68" rx="10" fill="#321b20" stroke="#f87171" stroke-width="2"/>
    <text x="1248" y="1078" class="body strong">Direct Plex 32400 — rejected</text>
    <text x="1248" y="1102" class="small">Plex's own parser directly Internet-facing.</text>
  </g>

  <text x="72" y="1174" class="subtitle">Discovery becomes certain; successful exploitation does not. Envoy replaces Plex's parser at the edge but does not authenticate.</text>
</svg>
