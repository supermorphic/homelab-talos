<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Plex split-horizon data flow</title>
  <desc id="desc">One hostname resolved two ways. LAN clients reach Plex through Pi-hole and the existing internal Envoy Gateway. The Plex and Sonos cloud resolves the same hostname through Cloudflare DNS-only to the dynamic Xfinity WAN address, one UniFi TCP 443 DNAT, and a dedicated public Envoy Gateway. A failure-domain boundary separates the two, and Plex Relay is retained as a fallback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101727"/>
      <stop offset="1" stop-color="#171226"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <style>
      text { font-family: Helvetica; }
      .title { font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 22px; font-weight: 400; fill: #aeb9ca; }
      .section { font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #b8c4d5; }
      .heading { font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 18px; font-weight: 400; fill: #d2d9e5; }
      .small { font-size: 16px; font-weight: 400; fill: #c5cfdd; }
      .strong { font-weight: 700; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#background)"/>

  <text x="72" y="74" class="title">Plex split-horizon data flow</text>
  <text x="72" y="112" class="subtitle">One hostname, two answers: LAN clients keep the internal path while the Plex and Sonos cloud reaches a dedicated public Envoy</text>

  <rect x="72" y="150" width="1656" height="240" rx="18" fill="#1b2434" stroke="#344156" filter="url(#shadow)"/>
  <rect x="72" y="150" width="1656" height="50" rx="18" fill="#253147"/>
  <rect x="72" y="182" width="1656" height="18" fill="#253147"/>
  <text x="98" y="183" class="body" fill="#f8fafc">Private horizon — unchanged by this design</text>

  <g>
    <rect x="104" y="218" width="330" height="150" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
    <text x="130" y="251" class="label">LAN + WI-FI</text>
    <text x="130" y="290" class="heading">Clients</text>
    <text x="130" y="323" class="small">
      <tspan x="130" dy="0">Apple TV, Plex iOS, Plexamp</tspan>
      <tspan x="130" dy="24" class="strong">192.168.10.0/24</tspan>
    </text>

    <line x1="450" y1="293" x2="482" y2="293" stroke="#60a5fa" stroke-width="5"/>
    <path d="M492 293 L478 283 L478 303 Z" fill="#60a5fa"/>

    <rect x="514" y="218" width="330" height="150" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
    <text x="540" y="251" class="label">PRIVATE DNS</text>
    <text x="540" y="290" class="heading">Pi-hole</text>
    <text x="540" y="323" class="small">
      <tspan x="540" dy="0">Answers the hostname with</tspan>
      <tspan x="540" dy="24">the internal gateway VIP.</tspan>
    </text>

    <line x1="860" y1="293" x2="892" y2="293" stroke="#60a5fa" stroke-width="5"/>
    <path d="M902 293 L888 283 L888 303 Z" fill="#60a5fa"/>

    <rect x="924" y="218" width="330" height="150" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
    <text x="950" y="251" class="label">SHARED GATEWAY</text>
    <text x="950" y="290" class="heading">Internal Envoy</text>
    <text x="950" y="323" class="small">
      <tspan x="950" dy="0">Wildcard *.lab TLS.</tspan>
      <tspan x="950" dy="24">MetalLB pool internal.</tspan>
    </text>

    <line x1="1270" y1="293" x2="1302" y2="293" stroke="#60a5fa" stroke-width="5"/>
    <path d="M1312 293 L1298 283 L1298 303 Z" fill="#60a5fa"/>

    <rect x="1334" y="218" width="362" height="150" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="3"/>
    <text x="1360" y="251" class="label">BACKEND</text>
    <text x="1360" y="290" class="heading">Plex Service</text>
    <text x="1360" y="323" class="small">
      <tspan x="1360" dy="0" class="strong">ClusterIP TCP 32400</tspan>
      <tspan x="1360" dy="24">Untouched by this design.</tspan>
    </text>
  </g>

  <text x="72" y="410" class="small" fill="#fca5a5">Failure-domain boundary — a public-side failure stops here and never crosses into the private horizon</text>
  <line x1="72" y1="422" x2="1728" y2="422" stroke="#f87171" stroke-width="3" stroke-dasharray="12 10" opacity="0.85"/>

  <rect x="72" y="440" width="1656" height="300" rx="18" fill="#1b2434" stroke="#344156" filter="url(#shadow)"/>
  <rect x="72" y="440" width="1656" height="50" rx="18" fill="#253147"/>
  <rect x="72" y="472" width="1656" height="18" fill="#253147"/>
  <text x="98" y="473" class="body" fill="#f8fafc">Public horizon — new, and reversible by removing one UniFi rule</text>

  <g>
    <rect x="104" y="512" width="284" height="170" rx="14" fill="#451a1a" stroke="#ef4444" stroke-width="3"/>
    <text x="128" y="545" class="label">UNTRUSTED</text>
    <text x="128" y="584" class="heading">Plex + Sonos</text>
    <text x="128" y="617" class="small">
      <tspan x="128" dy="0">Cloud workflow resolves</tspan>
      <tspan x="128" dy="24">the public hostname and</tspan>
      <tspan x="128" dy="24">connects inbound.</tspan>
    </text>

    <line x1="394" y1="597" x2="410" y2="597" stroke="#f87171" stroke-width="5"/>
    <path d="M420 597 L408 589 L408 605 Z" fill="#f87171"/>

    <rect x="431" y="512" width="284" height="170" rx="14" fill="#422006" stroke="#f59e0b" stroke-width="3"/>
    <text x="455" y="545" class="label">PUBLIC DNS</text>
    <text x="455" y="584" class="heading">Cloudflare</text>
    <text x="455" y="617" class="small">
      <tspan x="455" dy="0" class="strong">A record only</tspan>
      <tspan x="455" dy="24">proxied = false</tspan>
      <tspan x="455" dy="24">TTL 300 seconds</tspan>
    </text>

    <line x1="721" y1="597" x2="737" y2="597" stroke="#fbbf24" stroke-width="5"/>
    <path d="M747 597 L735 589 L735 605 Z" fill="#fbbf24"/>

    <rect x="758" y="512" width="284" height="170" rx="14" fill="#422006" stroke="#f59e0b" stroke-width="3"/>
    <text x="782" y="545" class="label">BOUNDARY 1</text>
    <text x="782" y="584" class="heading">UniFi WAN</text>
    <text x="782" y="617" class="small">
      <tspan x="782" dy="0">Dynamic Xfinity IPv4.</tspan>
      <tspan x="782" dy="24" class="strong">One DNAT: TCP 443</tspan>
      <tspan x="782" dy="24">UPnP stays disabled.</tspan>
    </text>

    <line x1="1048" y1="597" x2="1064" y2="597" stroke="#fbbf24" stroke-width="5"/>
    <path d="M1074 597 L1062 589 L1062 605 Z" fill="#fbbf24"/>

    <rect x="1085" y="512" width="284" height="170" rx="14" fill="#0e2f3a" stroke="#22d3ee" stroke-width="3"/>
    <text x="1109" y="545" class="label">BOUNDARY 2</text>
    <text x="1109" y="584" class="heading">Public Envoy</text>
    <text x="1109" y="617" class="small">
      <tspan x="1109" dy="0">Dedicated data plane.</tspan>
      <tspan x="1109" dy="24">Exact hostname only.</tspan>
      <tspan x="1109" dy="24">Own certificate + key.</tspan>
    </text>

    <line x1="1375" y1="597" x2="1391" y2="597" stroke="#67e8f9" stroke-width="5"/>
    <path d="M1401 597 L1389 589 L1389 605 Z" fill="#67e8f9"/>

    <rect x="1412" y="512" width="284" height="170" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="3"/>
    <text x="1436" y="545" class="label">BACKEND</text>
    <text x="1436" y="584" class="heading">Plex Service</text>
    <text x="1436" y="617" class="small">
      <tspan x="1436" dy="0" class="strong">Same ClusterIP 32400</tspan>
      <tspan x="1436" dy="24">reached by both</tspan>
      <tspan x="1436" dy="24">horizons.</tspan>
    </text>

    <path d="M900 682 L900 712 L573 712 L573 688" stroke="#fbbf24" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <path d="M573 678 L565 692 L581 692 Z" fill="#fbbf24"/>
    <text x="920" y="718" class="small" fill="#fcd34d">UniFi DDNS — outbound HTTPS update, scoped token, separate from cert-manager's</text>
  </g>

  <g>
    <rect x="72" y="772" width="525" height="278" rx="16" fill="#102030" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="813" class="heading" fill="#7dd3fc">Keeping the record current</text>
    <circle cx="108" cy="853" r="5" fill="#38bdf8"/>
    <text x="126" y="860" class="small">UniFi observes the WAN lease directly and</text>
    <text x="126" y="884" class="small">updates Cloudflare over an outbound call.</text>
    <circle cx="108" cy="918" r="5" fill="#38bdf8"/>
    <text x="126" y="925" class="small">A Kubernetes controller cannot do this: it</text>
    <text x="126" y="949" class="small">would publish the private MetalLB VIP.</text>
    <circle cx="108" cy="983" r="5" fill="#38bdf8"/>
    <text x="126" y="990" class="small">An in-cluster drift check compares the record</text>
    <text x="126" y="1014" class="small">against the real WAN address and alerts.</text>

    <rect x="637" y="772" width="525" height="278" rx="16" fill="#2a1b32" stroke="#c084fc" stroke-width="2"/>
    <text x="665" y="813" class="heading" fill="#d8b4fe">Plex Relay — retained fallback</text>
    <circle cx="673" cy="853" r="5" fill="#c084fc"/>
    <text x="691" y="860" class="small">Stays enabled beneath the public path and</text>
    <text x="691" y="884" class="small">needs no inbound port of its own.</text>
    <circle cx="673" cy="918" r="5" fill="#c084fc"/>
    <text x="691" y="925" class="small">A 2 Mbps ceiling and incomplete client</text>
    <text x="691" y="949" class="small">support: it cannot satisfy the Sonos goal.</text>
    <circle cx="673" cy="983" r="5" fill="#c084fc"/>
    <text x="691" y="990" class="small">Covers Plexamp music if the public path</text>
    <text x="691" y="1014" class="small">fails, which is why it is not removed.</text>

    <rect x="1202" y="772" width="526" height="278" rx="16" fill="#102a25" stroke="#10b981" stroke-width="2"/>
    <text x="1230" y="813" class="heading" fill="#6ee7b7">Explicitly not used</text>
    <circle cx="1238" cy="853" r="5" fill="#34d399"/>
    <text x="1256" y="860" class="small">No Cloudflare proxy and no Cloudflare Tunnel.</text>
    <text x="1256" y="884" class="small">The orange cloud stays off.</text>
    <circle cx="1238" cy="918" r="5" fill="#34d399"/>
    <text x="1256" y="925" class="small">No Tailscale Tunnel or Funnel: Sonos cannot</text>
    <text x="1256" y="949" class="small">present tailnet credentials.</text>
    <circle cx="1238" cy="983" r="5" fill="#34d399"/>
    <text x="1256" y="990" class="small">No public AAAA, no second WAN port, and no</text>
    <text x="1256" y="1014" class="small">route to the shared internal gateway.</text>
  </g>

  <text x="72" y="1092" class="subtitle">If public DNS, DDNS, the WAN DNAT, or the public Envoy fails, every internal path keeps serving unchanged.</text>
</svg>
