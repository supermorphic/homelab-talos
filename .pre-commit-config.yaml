---
# Local staged-file fast feedback. The authoritative full gate is the pull-request
# `ci` check. Install with `just repo hooks`; run all with `just repo lint`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
      - id: check-yaml
        args: [--allow-multiple-documents]
        # qbit_manage's config.yml uses the !ENV custom tag, which pyyaml's safe loader
        # (check-yaml) cannot resolve. yamllint still lints its style and
        # scripts/validate/qbit-manage.sh parses/asserts its contents with yq.
        exclude: ^kubernetes/apps/media/qbit-manage/app/config\.yml$
      - id: check-json

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, --config-file, .yamllint]

  - repo: local
    hooks:
      # Scan the staged diff for secrets (uses the mise-pinned gitleaks).
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: bash -c 'git diff --cached --no-ext-diff --binary | gitleaks stdin --redact --no-banner'
        language: system
        pass_filenames: false

      # Refuse a plaintext *.sops.yaml (validates the staged blob, not the local file).
      - id: sops-encrypted
        name: SOPS files are encrypted (staged)
        entry: scripts/check-sops-encrypted.sh
        language: script
        pass_filenames: false
        files: '\.sops\.ya?ml$'
