schema_version: 1
contracts:
  public-webhook-routes:
    changed_inputs:
      - scripts/validate/public-webhook-routes.sh
    required_tests:
      - python:scripts/test/core/test_public_webhook_routes.py
  internal-dns-endpoints:
    changed_inputs:
      - scripts/validate/internal-dns-endpoints.sh
    required_tests:
      - python:scripts/test/core/test_internal_dns_endpoints.py
  monitoring-verifier:
    changed_inputs:
      - scripts/verify/monitoring.sh
    required_tests:
      - shell:monitoring-verifier
  monitoring-flux-exporter-validator:
    changed_inputs:
      - scripts/validate/monitoring.sh
    required_tests:
      - shell:monitoring-flux-exporter-validator
  automation-backup:
    changed_inputs:
      - kubernetes/apps/automation/n8n-postgresql/app/scripts/backup.sh
    required_tests:
      - shell:n8n-backup
  nocodb-validation:
    changed_inputs:
      - kubernetes/apps/automation-data/nocodb/app/helmrelease.yaml
      - kubernetes/apps/automation/n8n/app/workflows/nocodb-source-provisioner.json
      - kubernetes/apps/monitoring/alerts/app/nocodb.yaml
      - kubernetes/apps/monitoring/gatus/app/nocodb-activation.values.yaml
      - scripts/nocodb/bootstrap.sh
      - scripts/test/nocodb-bootstrap-test.sh
      - scripts/test/lib/nocodb-permissions.sh
      - scripts/test/lib/nocodb-permissions-test.sh
      - scripts/upgrade/automation-data.sh
      - scripts/validate/nocodb.sh
      - scripts/verify/nocodb.sh
    required_tests:
      - catalog:validation.nocodb
  web-research-validation:
    changed_inputs:
      - kubernetes/apps/web-research/crawl4ai/runtime/credential_agent.py
      - kubernetes/apps/web-research/crawl4ai/runtime/server_launcher.py
      - kubernetes/apps/web-research/crawl4ai/proxy/envoyproxy.yaml
      - kubernetes/apps/web-research/alerts/app/credentials.yaml
      - kubernetes/apps/web-research/monitoring/gatus-endpoints.yaml
      - scripts/repository/crawl4ai_secrets.py
      - scripts/validate/web_research.py
      - scripts/validate/alerts.sh
      - tests/prometheus/web-research-alerts_test.yaml
    required_tests:
      - catalog:validation.web-research
  ci-framework-runner:
    changed_inputs:
      - scripts/test/run-ci.sh
    required_tests:
      - shell:ci-runner
