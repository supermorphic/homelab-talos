apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scratch
  namespace: scratch-namespace-placeholder
spec:
  serviceName: scratch
  replicas: 1
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: openbao-restore-scratch}
  template:
    metadata:
      labels: {app: openbao-restore-scratch}
    spec:
      serviceAccountName: scratch
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: quay.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
          command: [bao, server, -config=/scratch-config/server.hcl]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /openbao/data}
            - {name: seal, mountPath: /scratch-seal, readOnly: true}
            - {name: config, mountPath: /scratch-config, readOnly: true}
        - name: runner
          image: python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6
          command: [python, -c, 'import time; time.sleep(86400)']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: scratch-data}
        - name: seal
          secret: {secretName: scratch-seal, defaultMode: 0440}
        - name: config
          configMap: {name: scratch-config}
