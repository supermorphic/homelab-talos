              description: The Observability/prometheus Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Observability, name: alertmanager}
            exp_annotations:
              summary: Gatus endpoint Observability/alertmanager is down
              description: The Observability/alertmanager Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Observability, name: test-reports}
            exp_annotations:
              summary: Gatus endpoint Observability/test-reports is down
              description: The Observability/test-reports Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Storage, name: longhorn-ui}
            exp_annotations:
              summary: Gatus endpoint Storage/longhorn-ui is down
              description: The Storage/longhorn-ui Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: External, name: letsencrypt-acme}
            exp_annotations:
              summary: Gatus endpoint External/letsencrypt-acme is down
              description: The External/letsencrypt-acme Gatus probe has failed continuously for 15 minutes.
      - eval_time: 19m
        alertname: GatewayDataPathDown
        exp_alerts: []
      - eval_time: 22m
        alertname: GatusEndpointDown
        exp_alerts: []

  - name: echo proves the shared gateway path with a five minute critical boundary
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="ntfy"}'
        values: '1x16'
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: GatewayDataPathDown
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayDataPathDown
        exp_alerts:
          - exp_labels: {severity: critical, group: Platform, name: echo}
            exp_annotations:
              summary: Shared internal gateway data path is unavailable
              description: The Platform/echo Gatus probe has failed for more than five minutes, so ordinary DNS, the production Gateway, wildcard TLS, routing, or the echo backend is unavailable.
      - eval_time: 10m
        alertname: GatusEndpointDown
        exp_alerts: []
      - eval_time: 16m
        alertname: GatewayDataPathDown
        exp_alerts: []

  - name: all seven gap probes publish metrics
    interval: 1m
    input_series:
