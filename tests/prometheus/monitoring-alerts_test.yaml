        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Storage",name="longhorn-ui"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="External",name="letsencrypt-acme"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x26'
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x26'
    alert_rule_test:
      - eval_time: 17m
