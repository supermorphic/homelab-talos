        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="prometheus"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="alertmanager"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="test-reports"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Storage",name="longhorn-ui"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="External",name="letsencrypt-acme"}'
        values: '_x7 1x5'
    alert_rule_test:
