        alertname: GatusProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Observability, name: grafana}
            exp_annotations:
              summary: Gatus probe Observability/grafana metric is missing
              description: The Observability/grafana Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: prometheus}
            exp_annotations:
              summary: Gatus probe Observability/prometheus metric is missing
              description: The Observability/prometheus Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: alertmanager}
            exp_annotations:
              summary: Gatus probe Observability/alertmanager metric is missing
              description: The Observability/alertmanager Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: test-reports}
            exp_annotations:
              summary: Gatus probe Observability/test-reports metric is missing
