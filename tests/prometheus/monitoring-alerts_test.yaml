rule_files:
  - flux.yaml
  - gatus.yaml
  - logging.yaml
  - ntfy.yaml
  - portainer.yaml
  - test-reports.yaml

evaluation_interval: 1m

tests:
  - name: reconciliation failure fires for every unsuspended resource not Ready=True
    interval: 1m
    input_series:
      - series: 'gotk_resource_info{customresource_kind="Kustomization",exported_namespace="flux-system",name="broken",ready="False",suspended=""}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="OCIRepository",exported_namespace="flux-system",name="unknown",ready="Unknown",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRepository",exported_namespace="monitoring",name="missing-ready",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRelease",exported_namespace="monitoring",name="suspended",ready="False",suspended="true"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="GitRepository",exported_namespace="flux-system",name="healthy",ready="True",suspended=""}'
        values: 1x20
    alert_rule_test:
      - eval_time: 14m
        alertname: FluxReconciliationFailure
        exp_alerts: []
      - eval_time: 16m
        alertname: FluxReconciliationFailure
        exp_alerts:
          - exp_labels:
              customresource_kind: Kustomization
              exported_namespace: flux-system
              name: broken
              ready: "False"
              severity: warning
            exp_annotations:
              summary: Flux Kustomization flux-system/broken is failing to reconcile
              description: >-
                The Flux Kustomization flux-system/broken has not reported Ready=True for
                more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.
          - exp_labels:
              customresource_kind: OCIRepository
              exported_namespace: flux-system
              name: unknown
              ready: Unknown
              severity: warning
              suspended: "false"
            exp_annotations:
              summary: Flux OCIRepository flux-system/unknown is failing to reconcile
              description: >-
                The Flux OCIRepository flux-system/unknown has not reported Ready=True for
                more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.
          - exp_labels:
              customresource_kind: HelmRepository
              exported_namespace: monitoring
              name: missing-ready
              severity: warning
              suspended: "false"
            exp_annotations:
              summary: Flux HelmRepository monitoring/missing-ready is failing to reconcile
              description: >-
                The Flux HelmRepository monitoring/missing-ready has not reported Ready=True
                for more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.

  - name: one missing resource kind triggers the watchdog independently
    interval: 1m
    input_series:
      - series: 'gotk_resource_info{customresource_kind="Kustomization",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRelease",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="GitRepository",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRepository",ready="True",suspended="false"}'
        values: 1x20
    alert_rule_test:
      - eval_time: 14m
        alertname: FluxResourceMetricsMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: FluxResourceMetricsMissing
        exp_alerts:
          - exp_labels:
              customresource_kind: OCIRepository
              severity: warning
            exp_annotations:
              summary: Flux OCIRepository resource-state metrics are missing
              description: >-
                gotk_resource_info has contained no OCIRepository series for more than 15
                minutes, so reconciliation failures for that resource kind are undetectable.
                Check the flux-kube-state-metrics Deployment, its ServiceMonitor,
                custom-resource configuration, and its RBAC (CRD discovery plus list/watch on
                the Flux APIs).

  # --- ntfy and portainer ---
  #
  # ntfy and portainer carry structurally identical rule sets: a Gatus Down rule, an
  # absent() ProbeMissing rule, and a PVC NotBound rule wrapped in absent(... == 1).
  # Every case below drives one app into the failure state while the other stays healthy,
  # so a label matcher copied between the two files without being edited fails here.

  - name: ntfy down while portainer stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="ntfy", group="Platform"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{name="portainer", group="Platform"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: NtfyDown
        exp_alerts: []
      - eval_time: 10m
        alertname: NtfyDown
        exp_alerts:
          - exp_labels: {severity: critical, name: ntfy, group: Platform}
            exp_annotations:
              summary: ntfy is unavailable
              description: >-
                The ntfy /v1/health Gatus probe has failed for more than five minutes. Alert and media notifications will not be delivered. Check the ntfy Deployment, its PVC/Longhorn volume, and its CiliumNetworkPolicy.
      # Portainer is healthy throughout, proving the rules do not cross-fire.
      - eval_time: 10m
        alertname: PortainerDown
        exp_alerts: []
      # Recovery clears it.
      - eval_time: 16m
        alertname: NtfyDown
        exp_alerts: []

  - name: portainer down while ntfy stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="portainer", group="Platform"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{name="ntfy", group="Platform"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: PortainerDown
        exp_alerts: []
      - eval_time: 10m
        alertname: PortainerDown
        exp_alerts:
          - exp_labels: {severity: critical, name: portainer, group: Platform}
            exp_annotations:
              summary: Portainer is unavailable through the internal gateway
              description: >-
                The Portainer Gatus probe has failed for more than five minutes. Check internal DNS, the Gateway route, the Portainer Deployment, and its CiliumNetworkPolicy.
      - eval_time: 10m
        alertname: NtfyDown
        exp_alerts: []

  # ProbeMissing on both: an unrelated Platform probe is present the whole time and the
  # two targets are absent, so this proves the matchers INSIDE absent() are correct
  # rather than merely that absent() works.
  - name: both probe series absent while an unrelated Platform probe is present
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="echo", group="Platform"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 14m
        alertname: NtfyProbeMissing
        exp_alerts: []
      - eval_time: 14m
        alertname: PortainerProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: NtfyProbeMissing
        exp_alerts:
          # absent() carries its equality matchers through as labels.
          - exp_labels: {severity: warning, name: ntfy, group: Platform}
            exp_annotations:
              summary: ntfy probe data is missing
              description: >-
                The ntfy Gatus metric has been absent for more than 15 minutes, so NtfyDown cannot fire. Check Gatus and its ServiceMonitor.
      - eval_time: 16m
        alertname: PortainerProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, name: portainer, group: Platform}
            exp_annotations:
              summary: Portainer probe data is missing
              description: >-
                The Portainer Gatus metric has been absent for more than 15 minutes, so PortainerDown cannot fire. Check Gatus and its ServiceMonitor.

  # A present-and-Bound claim keeps the PVC rule silent; the phase series dropping out of
  # Bound fires it. Portainer stays Bound throughout so the two do not cross-fire.
  - name: ntfy claim leaves Bound while portainer stays Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="ntfy", persistentvolumeclaim="ntfy", phase="Bound"}'
        values: '1x8 0x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="portainer", persistentvolumeclaim="portainer", phase="Bound"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: ntfy database claim is absent or unbound
              description: >-
                The ntfy/ntfy PVC has not reported Bound for more than five minutes. The message cache and auth database continuity is at risk; inspect the PVC, Longhorn volume, and the ntfy Deployment.
      - eval_time: 15m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts: []

  - name: portainer claim leaves Bound while ntfy stays Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="portainer", persistentvolumeclaim="portainer", phase="Bound"}'
        values: '1x8 0x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="ntfy", persistentvolumeclaim="ntfy", phase="Bound"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Portainer database claim is absent or unbound
              description: >-
                The portainer/portainer PVC has not reported Bound for more than five minutes. Portainer's database continuity is at risk; inspect the PVC, Longhorn volume, replicas, and backup state.
      - eval_time: 15m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts: []

  # --- test-reports ---

  - name: test report archive claim leaves Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="test-reports", persistentvolumeclaim="test-reports", phase="Bound"}'
        values: '1x8 0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: TestReportsPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: TestReportsPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Test report archive claim is absent or unbound
              description: >-
                The test-reports/test-reports PVC has not reported Bound for more than five minutes. Published test evidence may be unavailable.

  # Capacity: the first window sits at 20% free, above the 15% threshold, and must stay
  # silent; it then drops to 10% and fires. That pair is the oracle — a rule with the
  # comparison inverted fails the silent case.
  - name: archive free space crosses the fifteen percent floor
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="test-reports", persistentvolumeclaim="test-reports"}'
        values: '2000000000x8 1000000000x18'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="test-reports", persistentvolumeclaim="test-reports"}'
        values: '10000000000x26'
    alert_rule_test:
      - eval_time: 5m
        alertname: TestReportsArchiveCapacityLow
        exp_alerts: []
      - eval_time: 25m
        alertname: TestReportsArchiveCapacityLow
        exp_alerts:
          - exp_labels: {severity: warning, namespace: test-reports, persistentvolumeclaim: test-reports}
            exp_annotations:
              summary: Test report archive has less than 15% free space
              description: >-
                Retention could not keep the persistent report archive below its capacity threshold. Review report sizes and Longhorn capacity.

  - name: all ordinary unalerted Gatus endpoints fail while echo stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Observability",name="grafana"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="prometheus"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="alertmanager"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="test-reports"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Storage",name="longhorn-ui"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="External",name="letsencrypt-acme"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x26'
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x26'
    alert_rule_test:
      - eval_time: 17m
        alertname: GatusEndpointDown
        exp_alerts: []
      - eval_time: 19m
        alertname: GatusEndpointDown
        exp_alerts:
          - exp_labels: {severity: warning, group: Observability, name: grafana}
            exp_annotations:
              summary: Gatus endpoint Observability/grafana is down
              description: The Observability/grafana Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Observability, name: prometheus}
            exp_annotations:
              summary: Gatus endpoint Observability/prometheus is down
              description: The Observability/prometheus Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Observability, name: alertmanager}
            exp_annotations:
              summary: Gatus endpoint Observability/alertmanager is down
              description: The Observability/alertmanager Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Observability, name: test-reports}
            exp_annotations:
              summary: Gatus endpoint Observability/test-reports is down
              description: The Observability/test-reports Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Storage, name: longhorn-ui}
            exp_annotations:
              summary: Gatus endpoint Storage/longhorn-ui is down
              description: The Storage/longhorn-ui Gatus probe has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: External, name: letsencrypt-acme}
            exp_annotations:
              summary: Gatus endpoint External/letsencrypt-acme is down
              description: The External/letsencrypt-acme Gatus probe has failed continuously for 15 minutes.
      - eval_time: 19m
        alertname: GatewayDataPathDown
        exp_alerts: []
      - eval_time: 22m
        alertname: GatusEndpointDown
        exp_alerts: []

  - name: echo proves the shared gateway path with a five minute critical boundary
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="ntfy"}'
        values: '1x16'
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: GatewayDataPathDown
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayDataPathDown
        exp_alerts:
          - exp_labels: {severity: critical, group: Platform, name: echo}
            exp_annotations:
              summary: Shared internal gateway data path is unavailable
              description: The Platform/echo Gatus probe has failed for more than five minutes, so ordinary DNS, the production Gateway, wildcard TLS, routing, or the echo backend is unavailable.
      - eval_time: 10m
        alertname: GatusEndpointDown
        exp_alerts: []
      - eval_time: 16m
        alertname: GatewayDataPathDown
        exp_alerts: []

  - name: all seven gap probes publish metrics
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Observability",name="grafana"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Observability",name="prometheus"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Observability",name="alertmanager"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Observability",name="test-reports"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Storage",name="longhorn-ui"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="External",name="letsencrypt-acme"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Platform",name="ntfy"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Platform",name="portainer"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: GatusProbeMissing
        exp_alerts: []

  - name: every absent gap probe retains its exact identity
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media",name="plex"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Platform",name="ntfy"}'
        values: '1x10'
      - series: 'gatus_results_endpoint_success{group="Platform",name="portainer"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: GatusProbeMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: GatusProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Observability, name: grafana}
            exp_annotations:
              summary: Gatus probe Observability/grafana metric is missing
              description: The Observability/grafana Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: prometheus}
            exp_annotations:
              summary: Gatus probe Observability/prometheus metric is missing
              description: The Observability/prometheus Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: alertmanager}
            exp_annotations:
              summary: Gatus probe Observability/alertmanager metric is missing
              description: The Observability/alertmanager Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: test-reports}
            exp_annotations:
              summary: Gatus probe Observability/test-reports metric is missing
              description: The Observability/test-reports Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Platform, name: echo}
            exp_annotations:
              summary: Gatus probe Platform/echo metric is missing
              description: The Platform/echo Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Storage, name: longhorn-ui}
            exp_annotations:
              summary: Gatus probe Storage/longhorn-ui metric is missing
              description: The Storage/longhorn-ui Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: External, name: letsencrypt-acme}
            exp_annotations:
              summary: Gatus probe External/letsencrypt-acme metric is missing
              description: The External/letsencrypt-acme Gatus success series has been absent for more than five minutes.

  - name: missing Gatus series recover when telemetry returns
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Observability",name="grafana"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="prometheus"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="alertmanager"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="test-reports"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="Storage",name="longhorn-ui"}'
        values: '_x7 1x5'
      - series: 'gatus_results_endpoint_success{group="External",name="letsencrypt-acme"}'
        values: '_x7 1x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: GatusProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Observability, name: grafana}
            exp_annotations:
              summary: Gatus probe Observability/grafana metric is missing
              description: The Observability/grafana Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: prometheus}
            exp_annotations:
              summary: Gatus probe Observability/prometheus metric is missing
              description: The Observability/prometheus Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: alertmanager}
            exp_annotations:
              summary: Gatus probe Observability/alertmanager metric is missing
              description: The Observability/alertmanager Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Observability, name: test-reports}
            exp_annotations:
              summary: Gatus probe Observability/test-reports metric is missing
              description: The Observability/test-reports Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Platform, name: echo}
            exp_annotations:
              summary: Gatus probe Platform/echo metric is missing
              description: The Platform/echo Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: Storage, name: longhorn-ui}
            exp_annotations:
              summary: Gatus probe Storage/longhorn-ui metric is missing
              description: The Storage/longhorn-ui Gatus success series has been absent for more than five minutes.
          - exp_labels: {severity: warning, group: External, name: letsencrypt-acme}
            exp_annotations:
              summary: Gatus probe External/letsencrypt-acme metric is missing
              description: The External/letsencrypt-acme Gatus success series has been absent for more than five minutes.
      - eval_time: 8m
        alertname: GatusProbeMissing
        exp_alerts: []

  # --- centralized logging platform health ---

  - name: Loki build telemetry is absent across the ten minute boundary
    interval: 1m
    input_series:
      - series: 'loki_build_info{namespace="other",job="monitoring/loki"}'
        values: 1x14
      - series: 'loki_build_info{namespace="monitoring",job="other"}'
        values: 1x14
    alert_rule_test:
      - eval_time: 9m
        alertname: LokiMetricsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: LokiMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              job: monitoring/loki
            exp_annotations:
              summary: Loki metrics are missing
              description: >-
                loki_build_info has been absent for more than ten minutes. Check the Loki
                StatefulSet, Service, ServiceMonitor, and Prometheus target.

  - name: Loki build telemetry recovery clears the missing alert
    interval: 1m
    input_series:
      - series: 'loki_build_info{namespace="monitoring",job="monitoring/loki"}'
        values: '_x12 1x5'
    alert_rule_test:
      - eval_time: 11m
        alertname: LokiMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              job: monitoring/loki
            exp_annotations:
              summary: Loki metrics are missing
              description: >-
                loki_build_info has been absent for more than ten minutes. Check the Loki
                StatefulSet, Service, ServiceMonitor, and Prometheus target.
      - eval_time: 13m
        alertname: LokiMetricsMissing
        exp_alerts: []

  - name: each Alloy collector role reports its own instance deficit
    interval: 1m
    input_series:
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-logs",instance="node-a"}'
        values: 1x14
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-logs",instance="node-b"}'
        values: 1x14
      - series: 'alloy_build_info{namespace="monitoring",service="unrelated",instance="extra-a"}'
        values: 1x14
      - series: 'alloy_build_info{namespace="monitoring",service="unrelated",instance="extra-b"}'
        values: 1x14
    alert_rule_test:
      - eval_time: 9m
        alertname: AlloyInstanceCountLow
        exp_alerts: []
      - eval_time: 11m
        alertname: AlloyInstanceCountLow
        exp_alerts:
          - exp_labels:
              severity: warning
              service: alloy-events
            exp_annotations:
              summary: Alloy alloy-events has fewer than its required instances
              description: >-
                Alloy alloy-events has fewer than the required one instance for more than
                ten minutes. Log or Event coverage is incomplete.
          - exp_labels:
              severity: warning
              service: alloy-logs
            exp_annotations:
              summary: Alloy alloy-logs has fewer than its required instances
              description: >-
                Alloy alloy-logs has fewer than the required three instances for more than
                ten minutes. Log or Event coverage is incomplete.

  - name: Alloy collector deficits recover independently when both roles reach topology
    interval: 1m
    input_series:
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-logs",instance="node-a"}'
        values: 1x16
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-logs",instance="node-b"}'
        values: 1x16
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-logs",instance="node-c"}'
        values: '_x12 1x4'
      - series: 'alloy_build_info{namespace="monitoring",service="alloy-events",instance="events"}'
        values: '_x12 1x4'
    alert_rule_test:
      - eval_time: 11m
        alertname: AlloyInstanceCountLow
        exp_alerts:
          - exp_labels:
              severity: warning
              service: alloy-events
            exp_annotations:
              summary: Alloy alloy-events has fewer than its required instances
              description: >-
                Alloy alloy-events has fewer than the required one instance for more than
                ten minutes. Log or Event coverage is incomplete.
          - exp_labels:
              severity: warning
              service: alloy-logs
            exp_annotations:
              summary: Alloy alloy-logs has fewer than its required instances
              description: >-
                Alloy alloy-logs has fewer than the required three instances for more than
                ten minutes. Log or Event coverage is incomplete.
      - eval_time: 13m
        alertname: AlloyInstanceCountLow
        exp_alerts: []

  - name: Alloy delivery drops fire per collector and reason then recover
    interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{namespace="monitoring",service="alloy-logs",component_id="loki.write.default",reason="ingester_error"}'
        values: '0+1x9 9x10'
      - series: 'loki_write_dropped_entries_total{namespace="monitoring",service="alloy-events",component_id="loki.write.default",reason="rate_limited"}'
        values: '0+2x9 18x10'
      - series: 'loki_write_dropped_entries_total{namespace="monitoring",service="alloy-logs",component_id="loki.write.default",reason="line_too_long"}'
        values: 0x19
      - series: 'loki_write_dropped_entries_total{namespace="monitoring",service="other",component_id="loki.write.default",reason="ingester_error"}'
        values: '0+3x19'
    alert_rule_test:
      - eval_time: 4m
        alertname: AlloyLogDeliveryDrops
        exp_alerts: []
      - eval_time: 7m
        alertname: AlloyLogDeliveryDrops
        exp_alerts:
          - exp_labels: {severity: warning, service: alloy-events, reason: rate_limited}
            exp_annotations:
              summary: Alloy alloy-events is dropping log entries
              description: >-
                Alloy dropped entries after exhausting delivery retries. Inspect the
                rate_limited reason, the collector, and Loki ingestion health.
          - exp_labels: {severity: warning, service: alloy-logs, reason: ingester_error}
            exp_annotations:
              summary: Alloy alloy-logs is dropping log entries
              description: >-
                Alloy dropped entries after exhausting delivery retries. Inspect the
                ingester_error reason, the collector, and Loki ingestion health.
      - eval_time: 15m
        alertname: AlloyLogDeliveryDrops
        exp_alerts: []

  - name: Loki discarded entries fire per rejection reason then recover
    interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{namespace="monitoring",job="monitoring/loki",reason="rate_limited",tenant="fake"}'
        values: '0+1x9 9x10'
      - series: 'loki_discarded_samples_total{namespace="monitoring",job="monitoring/loki",reason="line_too_long",tenant="fake"}'
        values: '0+2x9 18x10'
      - series: 'loki_discarded_samples_total{namespace="monitoring",job="monitoring/loki",reason="stream_limit",tenant="fake"}'
        values: 0x19
      - series: 'loki_discarded_samples_total{namespace="other",job="monitoring/loki",reason="rate_limited",tenant="fake"}'
        values: '0+3x19'
    alert_rule_test:
      - eval_time: 4m
        alertname: LokiLogEntriesDiscarded
        exp_alerts: []
      - eval_time: 7m
        alertname: LokiLogEntriesDiscarded
        exp_alerts:
          - exp_labels: {severity: warning, reason: line_too_long}
            exp_annotations:
              summary: Loki is discarding log entries
              description: >-
                Loki rejected entries for reason line_too_long. Inspect ingestion limits,
                collector traffic, and Loki capacity.
          - exp_labels: {severity: warning, reason: rate_limited}
            exp_annotations:
              summary: Loki is discarding log entries
              description: >-
                Loki rejected entries for reason rate_limited. Inspect ingestion limits,
                collector traffic, and Loki capacity.
      - eval_time: 15m
        alertname: LokiLogEntriesDiscarded
        exp_alerts: []

  - name: Loki request errors cross the ten percent boundary per route and recover
    interval: 1m
    input_series:
      - series: 'loki_request_duration_seconds_count{namespace="monitoring",job="monitoring/loki",route="loki_api_v1_push",status_code="500"}'
        values: '0+2x20 40x12'
      - series: 'loki_request_duration_seconds_count{namespace="monitoring",job="monitoring/loki",route="loki_api_v1_push",status_code="204"}'
        values: '0+8x32'
      - series: 'loki_request_duration_seconds_count{namespace="monitoring",job="monitoring/loki",route="loki_api_v1_query_range",status_code="503"}'
        values: '0+1x32'
      - series: 'loki_request_duration_seconds_count{namespace="monitoring",job="monitoring/loki",route="loki_api_v1_query_range",status_code="200"}'
        values: '0+10x32'
      - series: 'loki_request_duration_seconds_count{namespace="other",job="monitoring/loki",route="loki_api_v1_push",status_code="500"}'
        values: '0+10x32'
    alert_rule_test:
      - eval_time: 14m
        alertname: LokiRequestErrors
        exp_alerts: []
      - eval_time: 16m
        alertname: LokiRequestErrors
        exp_alerts:
          - exp_labels: {severity: critical, route: loki_api_v1_push}
            exp_annotations:
              summary: Loki request error rate is high
              description: >-
                More than 10 percent of Loki requests on route loki_api_v1_push returned a
                5xx response for more than 15 minutes.
      - eval_time: 27m
        alertname: LokiRequestErrors
        exp_alerts: []

  - name: an absent Loki compactor progress metric crosses the one hour boundary
    interval: 1m
    input_series:
      - series: 'loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds{namespace="other",job="monitoring/loki"}'
        values: 1x64
    alert_rule_test:
      - eval_time: 59m
        alertname: LokiCompactorStalled
        exp_alerts: []
      - eval_time: 61m
        alertname: LokiCompactorStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: monitoring
              job: monitoring/loki
            exp_annotations:
              summary: Loki compactor progress is absent or stale
              description: >-
                Loki has not reported a successful compaction within the expected window.
                Check the compactor configuration, filesystem, and Loki process health.

  - name: stale Loki compactor progress fires after three hours plus for and recovers
    interval: 1m
    input_series:
      - series: 'loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds{namespace="monitoring",job="monitoring/loki",cluster="logging"}'
        values: '600x252 15120x10'
    alert_rule_test:
      - eval_time: 189m
        alertname: LokiCompactorStalled
        exp_alerts: []
      - eval_time: 251m
        alertname: LokiCompactorStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: monitoring
              job: monitoring/loki
              cluster: logging
            exp_annotations:
              summary: Loki compactor progress is absent or stale
              description: >-
                Loki has not reported a successful compaction within the expected window.
                Check the compactor configuration, filesystem, and Loki process health.
      - eval_time: 253m
        alertname: LokiCompactorStalled
        exp_alerts: []

  - name: Loki storage warning is strict above seventy percent and recovers
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="storage-loki-0"}'
        values: '30x3 29x18 40x6'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim="storage-loki-0"}'
        values: 100x27
      - series: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="unrelated"}'
        values: 1x27
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim="unrelated"}'
        values: 100x27
    alert_rule_test:
      - eval_time: 2m
        alertname: LokiStorageUsageHigh
        exp_alerts: []
      - eval_time: 17m
        alertname: LokiStorageUsageHigh
        exp_alerts: []
      - eval_time: 19m
        alertname: LokiStorageUsageHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              persistentvolumeclaim: storage-loki-0
            exp_annotations:
              summary: Loki storage use is above 70 percent
              description: >-
                The Loki claim has remained above 70 percent used for more than 15 minutes.
                Review stored-data growth, retention, and Longhorn capacity.
      - eval_time: 24m
        alertname: LokiStorageUsageHigh
        exp_alerts: []

  - name: Loki storage critical is strict above eighty five percent and recovers
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="storage-loki-0"}'
        values: '15x3 14x8 25x5'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim="storage-loki-0"}'
        values: 100x16
      - series: 'kubelet_volume_stats_available_bytes{namespace="other",persistentvolumeclaim="storage-loki-0"}'
        values: 1x16
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="other",persistentvolumeclaim="storage-loki-0"}'
        values: 100x16
    alert_rule_test:
      - eval_time: 2m
        alertname: LokiStorageUsageCritical
        exp_alerts: []
      - eval_time: 7m
        alertname: LokiStorageUsageCritical
        exp_alerts: []
      - eval_time: 9m
        alertname: LokiStorageUsageCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: monitoring
              persistentvolumeclaim: storage-loki-0
            exp_annotations:
              summary: Loki storage use is above 85 percent
              description: >-
                The Loki claim has remained above 85 percent used for more than five
                minutes. Retention and ingestion are at immediate risk.
      - eval_time: 14m
        alertname: LokiStorageUsageCritical
        exp_alerts: []
