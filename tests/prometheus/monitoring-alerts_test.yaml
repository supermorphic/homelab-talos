rule_files:
  - flux.yaml
  - gatus.yaml
  - logging.yaml
  - n8n.yaml
  - ntfy.yaml
  - portainer.yaml
  - test-reports.yaml

evaluation_interval: 1m

tests:
  # --- n8n and PostgreSQL ---

  - name: n8n and PostgreSQL scrape targets fire only while down and recover
    interval: 1m
    input_series:
      - series: 'up{namespace="automation",service="n8n",instance="n8n:5678"}'
        values: '1x3 0x8 1x4'
      - series: 'up{namespace="automation",service="n8n-postgresql",instance="postgresql:9399"}'
        values: '1x3 0x8 1x4'
      - series: 'up{namespace="other",service="n8n",instance="unrelated"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 7m
        alertname: N8nUnavailable
        exp_alerts: []
      - eval_time: 9m
        alertname: N8nUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, service: n8n, instance: "n8n:5678"}
            exp_annotations:
              summary: n8n metrics target is unavailable
              description: The automation/n8n Prometheus target has been down for more than five minutes.
      - eval_time: 9m
        alertname: N8nPostgresqlUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, service: n8n-postgresql, instance: "postgresql:9399"}
            exp_annotations:
              summary: n8n PostgreSQL metrics target is unavailable
              description: The automation/n8n-postgresql SQL Exporter target has been down for more than five minutes.
      - eval_time: 14m
        alertname: N8nUnavailable
        exp_alerts: []
      - eval_time: 14m
        alertname: N8nPostgresqlUnavailable
        exp_alerts: []

  - name: n8n and PostgreSQL workload availability fires and recovers independently
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="automation",deployment="n8n"}'
        values: '1x3 0x8 1x4'
      - series: 'kube_statefulset_status_replicas_ready{namespace="automation",statefulset="n8n-postgresql"}'
        values: '1x3 0x8 1x4'
      - series: 'kube_deployment_status_replicas_available{namespace="automation",deployment="unrelated"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: N8nWorkloadUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, deployment: n8n}
            exp_annotations:
              summary: n8n workload is unavailable
              description: The automation/n8n Deployment has had no available replica for more than five minutes.
      - eval_time: 9m
        alertname: N8nPostgresqlWorkloadUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, statefulset: n8n-postgresql}
            exp_annotations:
              summary: n8n PostgreSQL workload is unavailable
              description: The automation/n8n-postgresql StatefulSet has had no ready replica for more than five minutes.
      - eval_time: 14m
        alertname: N8nWorkloadUnavailable
        exp_alerts: []
      - eval_time: 14m
        alertname: N8nPostgresqlWorkloadUnavailable
        exp_alerts: []

  - name: repeated n8n platform container restarts fire after the exact window and recover
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="automation",pod="n8n-abc-123",container="n8n-main"}'
        values: '0x2 1x2 2x2 3x10 3x12'
      - series: 'kube_pod_container_status_restarts_total{namespace="automation",pod="n8n-postgresql-0",container="postgresql"}'
        values: '0x26'
      - series: 'kube_pod_container_status_restarts_total{namespace="other",pod="n8n-abc-123",container="n8n-main"}'
        values: '0+1x26'
    alert_rule_test:
      - eval_time: 9m
        alertname: N8nContainerRestarting
        exp_alerts: []
      - eval_time: 15m
        alertname: N8nContainerRestarting
        exp_alerts:
          - exp_labels: {severity: warning, namespace: automation, pod: n8n-abc-123, container: n8n-main}
            exp_annotations:
              summary: n8n platform container is restarting repeatedly
              description: The automation/n8n-abc-123 n8n-main container restarted more than twice in 15 minutes.
      - eval_time: 25m
        alertname: N8nContainerRestarting
        exp_alerts: []

  - name: a recent n8n PostgreSQL OOM kill fires and then ages out
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="automation",pod="n8n-postgresql-0",container="postgresql"}'
        values: '0x3 1x19'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="automation",pod="n8n-postgresql-0",container="postgresql",reason="OOMKilled"}'
        values: '0x3 1x19'
      - series: 'kube_pod_container_status_restarts_total{namespace="automation",pod="n8n-postgresql-0",container="sql-exporter"}'
        values: '0x22'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="automation",pod="n8n-postgresql-0",container="sql-exporter",reason="Error"}'
        values: '0x3 1x19'
    alert_rule_test:
      - eval_time: 2m
        alertname: N8nContainerOomKilled
        exp_alerts: []
      - eval_time: 4m
        alertname: N8nContainerOomKilled
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, pod: n8n-postgresql-0, container: postgresql}
            exp_annotations:
              summary: n8n platform container was OOM killed
              description: The automation/n8n-postgresql-0 postgresql container was OOM killed during the last 15 minutes.
      - eval_time: 20m
        alertname: N8nContainerOomKilled
        exp_alerts: []

  - name: sustained failed n8n executions fire and recover
    interval: 1m
    input_series:
      - series: 'n8n_workflow_execution_duration_seconds_count{namespace="automation",service="n8n",status="failed",mode="webhook"}'
        values: '0+1x32 32x20'
      - series: 'n8n_workflow_execution_duration_seconds_count{namespace="automation",service="n8n",status="success",mode="webhook"}'
        values: '0+5x52'
      - series: 'n8n_workflow_execution_duration_seconds_count{namespace="other",service="n8n",status="failed",mode="webhook"}'
        values: '0+5x52'
    alert_rule_test:
      - eval_time: 14m
        alertname: N8nExecutionFailures
        exp_alerts: []
      - eval_time: 16m
        alertname: N8nExecutionFailures
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: n8n executions are failing
              description: Failed n8n executions have increased continuously across the 15-minute observation window.
      - eval_time: 49m
        alertname: N8nExecutionFailures
        exp_alerts: []

  - name: logical backup marker older than thirty six hours fires and a fresh marker recovers
    interval: 1h
    input_series:
      - series: 'n8n_postgresql_backup_last_success_timestamp_seconds{namespace="automation",service="n8n-postgresql",instance="postgresql:9399"}'
        values: '0x40 144000x4'
      - series: 'kube_job_status_succeeded{namespace="automation",job_name="n8n-postgresql-backup-successful"}'
        values: '1x44'
    alert_rule_test:
      - eval_time: 36h
        alertname: N8nPostgresqlBackupStale
        exp_alerts: []
      - eval_time: 38h
        alertname: N8nPostgresqlBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, service: n8n-postgresql}
            exp_annotations:
              summary: n8n PostgreSQL logical backup is stale or missing
              description: No validated logical-dump marker has reported success within 36 hours.
      - eval_time: 41h
        alertname: N8nPostgresqlBackupStale
        exp_alerts: []

  - name: absent logical backup marker fires then a fresh exact marker clears it
    interval: 1m
    input_series:
      - series: 'n8n_postgresql_backup_last_success_timestamp_seconds{namespace="automation",service="n8n-postgresql",instance="postgresql:9399"}'
        values: '_x18 1080x6'
      - series: 'n8n_postgresql_backup_last_success_timestamp_seconds{namespace="other",service="n8n-postgresql"}'
        values: '0x24'
      - series: 'kube_job_status_succeeded{namespace="automation",job_name="n8n-postgresql-backup-successful"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 14m
        alertname: N8nPostgresqlBackupStale
        exp_alerts: []
      - eval_time: 16m
        alertname: N8nPostgresqlBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, service: n8n-postgresql}
            exp_annotations:
              summary: n8n PostgreSQL logical backup is stale or missing
              description: No validated logical-dump marker has reported success within 36 hours.
      - eval_time: 19m
        alertname: N8nPostgresqlBackupStale
        exp_alerts: []

  - name: failed attempts in a PostgreSQL backup Job that completes stay silent
    interval: 1m
    input_series:
      - series: 'kube_job_status_failed{namespace="automation",job_name="n8n-postgresql-backup-retried"}'
        values: '1x12'
      - series: 'kube_job_failed{namespace="automation",job_name="n8n-postgresql-backup-retried",condition="true"}'
        values: '0x12'
      - series: 'kube_job_complete{namespace="automation",job_name="n8n-postgresql-backup-retried",condition="true"}'
        values: '1x12'
      - series: 'kube_job_status_start_time{namespace="automation",job_name="n8n-postgresql-backup-retried"}'
        values: '60x12'
      - series: 'kube_cronjob_status_last_successful_time{namespace="automation",cronjob="n8n-postgresql-backup"}'
        values: '120x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: N8nPostgresqlBackupJobFailed
        exp_alerts: []

  - name: terminal PostgreSQL backup Job failure fires with no prior success
    interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="automation",job_name="n8n-postgresql-backup-terminal",condition="true"}'
        values: '1x12'
      - series: 'kube_job_status_start_time{namespace="automation",job_name="n8n-postgresql-backup-terminal"}'
        values: '60x12'
      - series: 'kube_job_failed{namespace="automation",job_name="unrelated",condition="true"}'
        values: '1x12'
      - series: 'kube_job_status_start_time{namespace="automation",job_name="unrelated"}'
        values: '120x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: N8nPostgresqlBackupJobFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: N8nPostgresqlBackupJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: automation, job_name: n8n-postgresql-backup-terminal}
            exp_annotations:
              summary: n8n PostgreSQL backup Job failed
              description: The automation/n8n-postgresql-backup-terminal Job has remained failed for more than five minutes.

  - name: later successful backup clears an old retained terminal failure gauge
    interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="automation",job_name="n8n-postgresql-backup-old",condition="true"}'
        values: '1x15'
      - series: 'kube_job_status_start_time{namespace="automation",job_name="n8n-postgresql-backup-old"}'
        values: '60x15'
      - series: 'kube_cronjob_status_last_successful_time{namespace="automation",cronjob="n8n-postgresql-backup"}'
        values: '_x8 480x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: N8nPostgresqlBackupJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: automation, job_name: n8n-postgresql-backup-old}
            exp_annotations:
              summary: n8n PostgreSQL backup Job failed
              description: The automation/n8n-postgresql-backup-old Job has remained failed for more than five minutes.
      - eval_time: 9m
        alertname: N8nPostgresqlBackupJobFailed
        exp_alerts: []

  - name: overdue PostgreSQL backup CronJob fires and recovers
    interval: 1m
    input_series:
      - series: 'kube_cronjob_next_schedule_time{namespace="automation",cronjob="n8n-postgresql-backup"}'
        values: '-7200x10 72000x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: N8nPostgresqlBackupJobOverdue
        exp_alerts:
          - exp_labels: {severity: warning, namespace: automation, cronjob: n8n-postgresql-backup}
            exp_annotations:
              summary: n8n PostgreSQL backup schedule is overdue
              description: The automation/n8n-postgresql-backup CronJob is more than one hour past its next scheduled run.
      - eval_time: 12m
        alertname: N8nPostgresqlBackupJobOverdue
        exp_alerts: []

  - name: n8n canary down series fires without cross-firing the missing-series alert and recovers
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform",name="n8n-platform-canary"}'
        values: '1x3 0x8 1x5'
    alert_rule_test:
      - eval_time: 9m
        alertname: N8nCanaryDown
        exp_alerts:
          - exp_labels: {severity: critical, group: Platform, name: n8n-platform-canary}
            exp_annotations:
              summary: n8n authenticated public canary is down
              description: The Platform/n8n-platform-canary probe has failed for more than five minutes.
      - eval_time: 9m
        alertname: N8nCanaryProbeMissing
        exp_alerts: []
      - eval_time: 14m
        alertname: N8nCanaryDown
        exp_alerts: []

  - name: absent n8n canary series fires only missing then exact healthy series clears it
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform",name="n8n-platform-canary"}'
        values: '_x18 1x6'
      - series: 'gatus_results_endpoint_success{group="Platform",name="echo"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 16m
        alertname: N8nCanaryProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Platform, name: n8n-platform-canary}
            exp_annotations:
              summary: n8n authenticated public canary metric is missing
              description: The Platform/n8n-platform-canary success series has been absent for more than 15 minutes.
      - eval_time: 16m
        alertname: N8nCanaryDown
        exp_alerts: []
      - eval_time: 19m
        alertname: N8nCanaryProbeMissing
        exp_alerts: []
      - eval_time: 19m
        alertname: N8nCanaryDown
        exp_alerts: []

  - name: one exact n8n platform claim leaves Bound and recovers
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-data",phase="Bound"}'
        values: '1x3 0x8 1x5'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-postgresql-data",phase="Bound"}'
        values: '1x16'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-postgresql-backups",phase="Bound"}'
        values: '1x16'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="unrelated",phase="Bound"}'
        values: '0x16'
    alert_rule_test:
      - eval_time: 9m
        alertname: N8nPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, persistentvolumeclaim: n8n-data, phase: Bound}
            exp_annotations:
              summary: n8n platform claim is absent or unbound
              description: The automation/n8n-data PVC has not reported Bound for more than five minutes.
      - eval_time: 14m
        alertname: N8nPersistentVolumeClaimNotBound
        exp_alerts: []

  - name: absent exact n8n platform claim fires then its Bound series clears it
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-data",phase="Bound"}'
        values: '1x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-postgresql-data",phase="Bound"}'
        values: '1x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="automation",persistentvolumeclaim="n8n-postgresql-backups",phase="Bound"}'
        values: '_x8 1x4'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="other",persistentvolumeclaim="n8n-postgresql-backups",phase="Bound"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: N8nPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 6m
        alertname: N8nPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, persistentvolumeclaim: n8n-postgresql-backups, phase: Bound}
            exp_annotations:
              summary: n8n platform claim is absent or unbound
              description: The automation/n8n-postgresql-backups PVC has not reported Bound for more than five minutes.
      - eval_time: 9m
        alertname: N8nPersistentVolumeClaimNotBound
        exp_alerts: []

  - name: n8n platform PVC warning is strict above seventy percent for fifteen minutes
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="automation",persistentvolumeclaim="n8n-postgresql-data",instance="node-a"}'
        values: '30x3 29x18 40x5'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="automation",persistentvolumeclaim="n8n-postgresql-data",instance="node-a"}'
        values: '100x26'
      - series: 'kubelet_volume_stats_available_bytes{namespace="automation",persistentvolumeclaim="unrelated",instance="node-a"}'
        values: '1x26'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="automation",persistentvolumeclaim="unrelated",instance="node-a"}'
        values: '100x26'
    alert_rule_test:
      - eval_time: 17m
        alertname: N8nPersistentVolumeUsageWarning
        exp_alerts: []
      - eval_time: 19m
        alertname: N8nPersistentVolumeUsageWarning
        exp_alerts:
          - exp_labels: {severity: warning, namespace: automation, persistentvolumeclaim: n8n-postgresql-data}
            exp_annotations:
              summary: n8n platform PVC use is above 70 percent
              description: The automation/n8n-postgresql-data PVC has remained above 70 percent used for more than 15 minutes.
      - eval_time: 23m
        alertname: N8nPersistentVolumeUsageWarning
        exp_alerts: []

  - name: n8n platform PVC critical is strict above eighty five percent for five minutes
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="automation",persistentvolumeclaim="n8n-postgresql-backups",instance="node-a"}'
        values: '15x3 14x20 25x5'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="automation",persistentvolumeclaim="n8n-postgresql-backups",instance="node-a"}'
        values: '100x28'
      - series: 'kubelet_volume_stats_available_bytes{namespace="other",persistentvolumeclaim="n8n-postgresql-backups",instance="node-a"}'
        values: '1x28'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="other",persistentvolumeclaim="n8n-postgresql-backups",instance="node-a"}'
        values: '100x28'
    alert_rule_test:
      - eval_time: 7m
        alertname: N8nPersistentVolumeUsageCritical
        exp_alerts: []
      - eval_time: 19m
        alertname: N8nPersistentVolumeUsageCritical
        exp_alerts:
          - exp_labels: {severity: critical, namespace: automation, persistentvolumeclaim: n8n-postgresql-backups}
            exp_annotations:
              summary: n8n platform PVC use is above 85 percent
              description: The automation/n8n-postgresql-backups PVC has remained above 85 percent used for more than five minutes.
      - eval_time: 19m
        alertname: N8nPersistentVolumeUsageWarning
        exp_alerts: []
      - eval_time: 26m
        alertname: N8nPersistentVolumeUsageCritical
        exp_alerts: []

  - name: reconciliation failure fires for every unsuspended resource not Ready=True
    interval: 1m
    input_series:
      - series: 'gotk_resource_info{customresource_kind="Kustomization",exported_namespace="flux-system",name="broken",ready="False",suspended=""}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="OCIRepository",exported_namespace="flux-system",name="unknown",ready="Unknown",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRepository",exported_namespace="monitoring",name="missing-ready",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRelease",exported_namespace="monitoring",name="suspended",ready="False",suspended="true"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="GitRepository",exported_namespace="flux-system",name="healthy",ready="True",suspended=""}'
        values: 1x20
    alert_rule_test:
      - eval_time: 14m
        alertname: FluxReconciliationFailure
        exp_alerts: []
      - eval_time: 16m
        alertname: FluxReconciliationFailure
        exp_alerts:
          - exp_labels:
              customresource_kind: Kustomization
              exported_namespace: flux-system
              name: broken
              ready: "False"
              severity: warning
            exp_annotations:
              summary: Flux Kustomization flux-system/broken is failing to reconcile
              description: >-
                The Flux Kustomization flux-system/broken has not reported Ready=True for
                more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.
          - exp_labels:
              customresource_kind: OCIRepository
              exported_namespace: flux-system
              name: unknown
              ready: Unknown
              severity: warning
              suspended: "false"
            exp_annotations:
              summary: Flux OCIRepository flux-system/unknown is failing to reconcile
              description: >-
                The Flux OCIRepository flux-system/unknown has not reported Ready=True for
                more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.
          - exp_labels:
              customresource_kind: HelmRepository
              exported_namespace: monitoring
              name: missing-ready
              severity: warning
              suspended: "false"
            exp_annotations:
              summary: Flux HelmRepository monitoring/missing-ready is failing to reconcile
              description: >-
                The Flux HelmRepository monitoring/missing-ready has not reported Ready=True
                for more than 15 minutes, so its desired state may no longer be reconciling.
                Inspect it (`flux get all -A`, `flux logs`) and check its source (Git/OCI/Helm
                repository) and rendered manifests. Intentionally suspended resources are
                excluded.

  - name: one missing resource kind triggers the watchdog independently
    interval: 1m
    input_series:
      - series: 'gotk_resource_info{customresource_kind="Kustomization",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRelease",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="GitRepository",ready="True",suspended="false"}'
        values: 1x20
      - series: 'gotk_resource_info{customresource_kind="HelmRepository",ready="True",suspended="false"}'
        values: 1x20
    alert_rule_test:
      - eval_time: 14m
        alertname: FluxResourceMetricsMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: FluxResourceMetricsMissing
        exp_alerts:
          - exp_labels:
              customresource_kind: OCIRepository
              severity: warning
            exp_annotations:
              summary: Flux OCIRepository resource-state metrics are missing
              description: >-
                gotk_resource_info has contained no OCIRepository series for more than 15
                minutes, so reconciliation failures for that resource kind are undetectable.
                Check the flux-kube-state-metrics Deployment, its ServiceMonitor,
                custom-resource configuration, and its RBAC (CRD discovery plus list/watch on
                the Flux APIs).

  # --- ntfy and portainer ---
  #
  # ntfy and portainer carry structurally identical rule sets: a Gatus Down rule, an
  # absent() ProbeMissing rule, and a PVC NotBound rule wrapped in absent(... == 1).
  # Every case below drives one app into the failure state while the other stays healthy,
  # so a label matcher copied between the two files without being edited fails here.

  - name: ntfy down while portainer stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="ntfy", group="Platform"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{name="portainer", group="Platform"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: NtfyDown
        exp_alerts: []
      - eval_time: 10m
        alertname: NtfyDown
        exp_alerts:
          - exp_labels: {severity: critical, name: ntfy, group: Platform}
            exp_annotations:
              summary: ntfy is unavailable
              description: >-
                The ntfy /v1/health Gatus probe has failed for more than five minutes. Alert and media notifications will not be delivered. Check the ntfy Deployment, its PVC/Longhorn volume, and its CiliumNetworkPolicy.
      # Portainer is healthy throughout, proving the rules do not cross-fire.
      - eval_time: 10m
        alertname: PortainerDown
        exp_alerts: []
      # Recovery clears it.
      - eval_time: 16m
        alertname: NtfyDown
        exp_alerts: []

  - name: portainer down while ntfy stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="portainer", group="Platform"}'
        values: '1x3 0x8 1x5'
      - series: 'gatus_results_endpoint_success{name="ntfy", group="Platform"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 7m
        alertname: PortainerDown
        exp_alerts: []
      - eval_time: 10m
        alertname: PortainerDown
        exp_alerts:
          - exp_labels: {severity: critical, name: portainer, group: Platform}
            exp_annotations:
              summary: Portainer is unavailable through the internal gateway
              description: >-
                The Portainer Gatus probe has failed for more than five minutes. Check internal DNS, the Gateway route, the Portainer Deployment, and its CiliumNetworkPolicy.
      - eval_time: 10m
        alertname: NtfyDown
        exp_alerts: []

  # ProbeMissing on both: an unrelated Platform probe is present the whole time and the
  # two targets are absent, so this proves the matchers INSIDE absent() are correct
  # rather than merely that absent() works.
  - name: both probe series absent while an unrelated Platform probe is present
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="echo", group="Platform"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 14m
        alertname: NtfyProbeMissing
        exp_alerts: []
      - eval_time: 14m
        alertname: PortainerProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: NtfyProbeMissing
        exp_alerts:
          # absent() carries its equality matchers through as labels.
          - exp_labels: {severity: warning, name: ntfy, group: Platform}
            exp_annotations:
              summary: ntfy probe data is missing
              description: >-
                The ntfy Gatus metric has been absent for more than 15 minutes, so NtfyDown cannot fire. Check Gatus and its ServiceMonitor.
      - eval_time: 16m
        alertname: PortainerProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, name: portainer, group: Platform}
            exp_annotations:
              summary: Portainer probe data is missing
              description: >-
                The Portainer Gatus metric has been absent for more than 15 minutes, so PortainerDown cannot fire. Check Gatus and its ServiceMonitor.

  # A present-and-Bound claim keeps the PVC rule silent; the phase series dropping out of
  # Bound fires it. Portainer stays Bound throughout so the two do not cross-fire.
  - name: ntfy claim leaves Bound while portainer stays Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="ntfy", persistentvolumeclaim="ntfy", phase="Bound"}'
        values: '1x8 0x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="portainer", persistentvolumeclaim="portainer", phase="Bound"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: ntfy database claim is absent or unbound
              description: >-
                The ntfy/ntfy PVC has not reported Bound for more than five minutes. The message cache and auth database continuity is at risk; inspect the PVC, Longhorn volume, and the ntfy Deployment.
      - eval_time: 15m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts: []

  - name: portainer claim leaves Bound while ntfy stays Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="portainer", persistentvolumeclaim="portainer", phase="Bound"}'
        values: '1x8 0x12'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="ntfy", persistentvolumeclaim="ntfy", phase="Bound"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: PortainerPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Portainer database claim is absent or unbound
              description: >-
                The portainer/portainer PVC has not reported Bound for more than five minutes. Portainer's database continuity is at risk; inspect the PVC, Longhorn volume, replicas, and backup state.
      - eval_time: 15m
        alertname: NtfyPersistentVolumeClaimNotBound
        exp_alerts: []

  # --- test-reports ---

  - name: test report archive claim leaves Bound
    interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="test-reports", persistentvolumeclaim="test-reports", phase="Bound"}'
        values: '1x8 0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: TestReportsPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 15m
        alertname: TestReportsPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Test report archive claim is absent or unbound
              description: >-
                The test-reports/test-reports PVC has not reported Bound for more than five minutes. Published test evidence may be unavailable.

  # Capacity: the first window sits at 20% free, above the 15% threshold, and must stay
  # silent; it then drops to 10% and fires. That pair is the oracle — a rule with the
  # comparison inverted fails the silent case.
  - name: archive free space crosses the fifteen percent floor
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="test-reports", persistentvolumeclaim="test-reports"}'
        values: '2000000000x8 1000000000x18'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="test-reports", persistentvolumeclaim="test-reports"}'
        values: '10000000000x26'
    alert_rule_test:
      - eval_time: 5m
        alertname: TestReportsArchiveCapacityLow
        exp_alerts: []
      - eval_time: 25m
        alertname: TestReportsArchiveCapacityLow
        exp_alerts:
          - exp_labels: {severity: warning, namespace: test-reports, persistentvolumeclaim: test-reports}
            exp_annotations:
              summary: Test report archive has less than 15% free space
              description: >-
                Retention could not keep the persistent report archive below its capacity threshold. Review report sizes and Longhorn capacity.

  - name: all ordinary unalerted Gatus endpoints fail while echo stays healthy
    interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Observability",name="grafana"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Observability",name="prometheus"}'
