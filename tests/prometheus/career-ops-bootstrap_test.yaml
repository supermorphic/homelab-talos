rule_files:
- career-ops.yaml
evaluation_interval: 1m
tests:
- name: shipped rules stay quiet while disabled, even with the coordinator absent
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 10m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsCVWorkStuck
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsCVRendersFailing
    exp_alerts: []
