          - exp_labels: {severity: warning, group: Media Integration, name: seerr-radarr-service-read}
            exp_annotations:
              summary: Seerr cannot read its selected Radarr service
              description: The authenticated Gatus read-through through Seerr has failed for 15 minutes. Seerr cannot read its selected Radarr service. This does not prove that a Seerr request, download, or import failed.
      - eval_time: 19m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: LidarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrSonarrServiceReadFailed
        exp_alerts: []
      - eval_time: 21m
        alertname: SeerrRadarrServiceReadFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 8m
        alertname: MediaIntegrationProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '_x8 1x4'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x12'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: MediaIntegrationProbeMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: MediaIntegrationProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media Integration, name: prowlarr-native-health}
            exp_annotations:
              summary: Media integration probe prowlarr-native-health is missing
              description: The Media Integration/prowlarr-native-health Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
      - eval_time: 10m
        alertname: MediaIntegrationProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: MediaIntegrationProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media Integration, name: prowlarr-native-health}
            exp_annotations:
              summary: Media integration probe prowlarr-native-health is missing
              description: The Media Integration/prowlarr-native-health Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
          - exp_labels: {severity: warning, group: Media Integration, name: sonarr-native-health}
            exp_annotations:
              summary: Media integration probe sonarr-native-health is missing
              description: The Media Integration/sonarr-native-health Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
          - exp_labels: {severity: warning, group: Media Integration, name: radarr-native-health}
            exp_annotations:
              summary: Media integration probe radarr-native-health is missing
              description: The Media Integration/radarr-native-health Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
          - exp_labels: {severity: warning, group: Media Integration, name: lidarr-native-health}
            exp_annotations:
              summary: Media integration probe lidarr-native-health is missing
              description: The Media Integration/lidarr-native-health Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
          - exp_labels: {severity: warning, group: Media Integration, name: seerr-sonarr-service-read}
            exp_annotations:
              summary: Media integration probe seerr-sonarr-service-read is missing
              description: The Media Integration/seerr-sonarr-service-read Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.
          - exp_labels: {severity: warning, group: Media Integration, name: seerr-radarr-service-read}
            exp_annotations:
              summary: Media integration probe seerr-radarr-service-read is missing
              description: The Media Integration/seerr-radarr-service-read Gatus success series has been absent for five minutes. This is missing telemetry, not an application or integration failure.

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media", name="seerr"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media", name="qbittorrent-vpn"}'
        values: '0x24'
    alert_rule_test:
      - eval_time: 17m
        alertname: MediaEndpointDown
        exp_alerts: []
      - eval_time: 19m
        alertname: MediaEndpointDown
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: plex}
            exp_annotations:
              summary: Media endpoint plex is down
              description: The Media/plex Gatus endpoint has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Media, name: seerr}
            exp_annotations:
              summary: Media endpoint seerr is down
              description: The Media/seerr Gatus endpoint has failed continuously for 15 minutes.
      - eval_time: 21m
        alertname: MediaEndpointDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform", name="ntfy"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: MediaEndpointsProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: MediaEndpointsProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media}
            exp_annotations:
              summary: All media endpoint probe metrics are missing
              description: Gatus has exposed no Media endpoint success series for 15 minutes.
      - eval_time: 20m
        alertname: MediaEndpointsProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="seerr"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: PlexProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: plex}
            exp_annotations:
              summary: Plex probe metric is missing
              description: The Media/plex Gatus success series has been absent for 15 minutes.
      - eval_time: 20m
        alertname: PlexProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="other", phase="Bound"}'
        values: '1x14'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="plex", phase="Bound"}'
        values: '_x8 1x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 6m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Plex database claim is absent or unbound
              description: The media/plex PVC has not reported Bound for five minutes; Plex library state is at risk.
      - eval_time: 10m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="tautulli"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: TautulliProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: TautulliProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: tautulli}
            exp_annotations:
              summary: Tautulli probe metric is missing
              description: The Media/tautulli Gatus success series has been absent for 15 minutes.
      - eval_time: 20m
        alertname: TautulliProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="plex", phase="Bound"}'
        values: '1x14'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="tautulli", phase="Bound"}'
        values: '_x8 1x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 6m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Tautulli database claim is absent or unbound
              description: The media/tautulli PVC has not reported Bound for five minutes; watch history persistence is at risk.
      - eval_time: 10m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts: []

  # Scanning shape: one connection per second carrying only two flows each.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '0x9 120+120x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Off-cluster connections to Plex are carrying almost no traffic
              description: Off-cluster clients opened connections to Plex that carried fewer than 3 flows each for 10 minutes, which is what scanning looks like.
  # Real sessions: same connection rate, ten flows each. Must stay silent.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '0x9 600+600x25'
    alert_rule_test:
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
  # Idle: no connections at all, so the ratio is undefined. The guard must hold it silent.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '100x35'
    alert_rule_test:
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
  # Detection itself goes blind.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/other", node="nuc1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, destination: media/plex}
            exp_annotations:
              summary: Hubble flow metrics for Plex are missing
              description: No Hubble flow series for Plex has been present for 15 minutes, so remote-access detection is blind.
  # The tcp companion must fire on its own: flow metric present, tcp metric absent.
  # This is the exact failure PlexRemoteFlowMetricsMissing cannot see, because it only
  # watches hubble_flows_processed_total.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, destination: media/plex}
            exp_annotations:
              summary: Hubble TCP flag metrics for Plex are missing
              description: No Hubble TCP flag series for Plex has been present for 15 minutes, so both remote-access detection rules are blind.
      # The flow companion must stay silent in this same window: the flow series is
      # present, so only detection's tcp half is blind, not both.
      - eval_time: 20m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts: []
  # The tcp companion must stay silent when the tcp metric is present, even though the
  # only present series carries no `reserved:world` source — it is deliberately not
  # qualified by `source`, because absence of the world series alone is the normal
  # state today and must never alert.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts: []
  # Corridor rule: sustained full-handshake abuse at 1.5 connections/sec, below the
  # flood rule's threshold of 5 and above the probe rule's implicit reach, must fire.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 90+90x25'
    alert_rule_test:
      - eval_time: 18m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts: []
      - eval_time: 32m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Off-cluster connection rate to Plex is elevated
              description: Off-cluster clients opened more than 1 connection per second to Plex for 10 minutes, which is above any plausible legitimate remote load.
  # Internal clients must never trip it, however busy they are.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 6000+6000x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts: []
  # The compound identity that CIDR policies produce must still match.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="cidr:192.168.0.0/16,reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 600+600x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionFlood
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Off-cluster connection rate to Plex is abnormally high
              description: Off-cluster clients opened more than 5 connections per second to Plex for 5 minutes.
  # Internal clients must never trip it, however busy they are.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 6000+6000x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionFlood
        exp_alerts: []

  # --- qbittorrent VPN and Gluetun restart-loop coverage ---

  # QbittorrentVpnDown: the Gatus control-server probe reporting 0 for >5m.
  # Silent before the 5m hold, firing after it, silent again once the probe recovers.
  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="qbittorrent-vpn", group="Media"}'
        values: '1x3 0x8 1x5'
    alert_rule_test:
      - eval_time: 7m
        alertname: QbittorrentVpnDown
        exp_alerts: []
      - eval_time: 10m
        alertname: QbittorrentVpnDown
        exp_alerts:
          - exp_labels: {severity: critical, name: qbittorrent-vpn, group: Media}
            exp_annotations:
              summary: qBittorrent ProtonVPN tunnel is down
              description: >-
                Gluetun reports the ProtonVPN tunnel is not running (Gatus health probe of the control server failing for >5m). qBittorrent egress is kill-switched (fail-closed) and downloads are paused. Check Gluetun logs and the ProtonVPN WireGuard credential (annual Extend / expiry — see docs/protonvpn-gluetun.md).
      - eval_time: 16m
        alertname: QbittorrentVpnDown
        exp_alerts: []

  # A healthy tunnel must never trip it, and the media-wide MediaEndpointDown rule
  # explicitly excludes name="qbittorrent-vpn", so neither rule may fire here.
  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="qbittorrent-vpn", group="Media"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: QbittorrentVpnDown
        exp_alerts: []
      - eval_time: 18m
        alertname: MediaEndpointDown
        exp_alerts: []

  # QbittorrentGluetunRestartLoop: one restart is healthy recovery; two inside the
  # 15m window is a loop. The rule counts increase() over [15m] and holds for 1m.
  - interval: 1m
    input_series:
      - series: 'kube_pod_init_container_status_restarts_total{namespace="media", pod="qbittorrent-abc123", container="gluetun"}'
        values: '0x5 1x10 2x10'
    alert_rule_test:
      # A single restart inside the window is deliberate recovery, not a loop.
      - eval_time: 12m
        alertname: QbittorrentGluetunRestartLoop
        exp_alerts: []
      - eval_time: 18m
        alertname: QbittorrentGluetunRestartLoop
        exp_alerts:
          - exp_labels: {severity: critical, namespace: media, pod: qbittorrent-abc123, container: gluetun}
            exp_annotations:
              summary: qBittorrent Gluetun liveness recovery is looping
              description: >-
                The Gluetun container restarted at least twice in 15 minutes. Its deliberately slow liveness fallback is not restoring a nonzero ProtonVPN forwarded port. qBittorrent remains fail-closed; inspect Gluetun logs and recreate the qBittorrent pod if a fresh network namespace is required.

  # QbittorrentVpnProbeMissing: the series vanishing entirely, which blinds VpnDown.
  # An unrelated Media probe is present throughout, so this proves the label matchers
  # INSIDE absent() are right rather than merely that absent() works.
  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{name="plex", group="Media"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 14m
        alertname: QbittorrentVpnProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: QbittorrentVpnProbeMissing
        exp_alerts:
          # absent() carries its equality matchers through as labels.
          - exp_labels: {severity: warning, name: qbittorrent-vpn, group: Media}
            exp_annotations:
              summary: qBittorrent VPN health probe metric is missing
              description: >-
                gatus_results_endpoint_success for the qbittorrent-vpn probe is absent for >15m, so the QbittorrentVpnDown alert cannot fire. Check Gatus and the qbittorrent-gluetun-control Service.

  # --- encode-benchmark Job outcome coverage ---

  # EncodeBenchmarkJobFailed fires per failing Job and stays silent on a healthy one.
  # Both annotations template {{ $labels.job_name }}, so the expected text is rendered.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_failed{namespace="media", job_name="encode-benchmark-run1"}'
        values: '0x3 1x10'
      - series: 'kube_job_status_failed{namespace="media", job_name="encode-benchmark-run2"}'
        values: '0x13'
    alert_rule_test:
      - eval_time: 2m
        alertname: EncodeBenchmarkJobFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: EncodeBenchmarkJobFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: media, job_name: encode-benchmark-run1}
            exp_annotations:
              summary: Encoding benchmark Job encode-benchmark-run1 failed
              description: >-
                Job encode-benchmark-run1 failed. Inspect the run with `mise exec -- just kube encode-benchmark-results <run-id>`.

  # EncodeBenchmarkJobCompleted watches the succeeded counter, so a failed Job must not
  # trip it and a succeeded one must not trip EncodeBenchmarkJobFailed. Pairing the two
  # catches the metric being swapped between them.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_succeeded{namespace="media", job_name="encode-benchmark-run3"}'
        values: '0x3 1x10'
      - series: 'kube_job_status_failed{namespace="media", job_name="encode-benchmark-run3"}'
        values: '0x13'
    alert_rule_test:
      - eval_time: 2m
        alertname: EncodeBenchmarkJobCompleted
        exp_alerts: []
      - eval_time: 6m
        alertname: EncodeBenchmarkJobCompleted
        exp_alerts:
          - exp_labels: {severity: warning, namespace: media, job_name: encode-benchmark-run3}
            exp_annotations:
              summary: Encoding benchmark Job encode-benchmark-run3 completed
              description: >-
                Job encode-benchmark-run3 completed. Review the run with `mise exec -- just kube encode-benchmark-results <run-id>`.
      - eval_time: 6m
        alertname: EncodeBenchmarkJobFailed
        exp_alerts: []
