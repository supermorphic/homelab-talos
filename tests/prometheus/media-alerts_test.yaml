      - eval_time: 19m
        alertname: SeerrRadarrServiceReadFailed
        exp_alerts: []
      - eval_time: 21m
        alertname: LidarrNativeHealthApiUnavailable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
