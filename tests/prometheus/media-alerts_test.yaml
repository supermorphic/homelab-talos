rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media", name="seerr"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media", name="qbittorrent-vpn"}'
        values: '0x24'
    alert_rule_test:
      - eval_time: 17m
        alertname: MediaEndpointDown
        exp_alerts: []
      - eval_time: 19m
        alertname: MediaEndpointDown
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: plex}
            exp_annotations:
              summary: Media endpoint plex is down
              description: The Media/plex Gatus endpoint has failed continuously for 15 minutes.
          - exp_labels: {severity: warning, group: Media, name: seerr}
            exp_annotations:
              summary: Media endpoint seerr is down
              description: The Media/seerr Gatus endpoint has failed continuously for 15 minutes.
      - eval_time: 21m
        alertname: MediaEndpointDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Platform", name="ntfy"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: MediaEndpointsProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: MediaEndpointsProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media}
            exp_annotations:
              summary: All media endpoint probe metrics are missing
              description: Gatus has exposed no Media endpoint success series for 15 minutes.
      - eval_time: 20m
        alertname: MediaEndpointsProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="seerr"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: PlexProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: plex}
            exp_annotations:
              summary: Plex probe metric is missing
              description: The Media/plex Gatus success series has been absent for 15 minutes.
      - eval_time: 20m
        alertname: PlexProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="other", phase="Bound"}'
        values: '1x14'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="plex", phase="Bound"}'
        values: '_x8 1x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 6m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Plex database claim is absent or unbound
              description: The media/plex PVC has not reported Bound for five minutes; Plex library state is at risk.
      - eval_time: 10m
        alertname: PlexPersistentVolumeClaimNotBound
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media", name="plex"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media", name="tautulli"}'
        values: '_x18 1x6'
    alert_rule_test:
      - eval_time: 14m
        alertname: TautulliProbeMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: TautulliProbeMissing
        exp_alerts:
          - exp_labels: {severity: warning, group: Media, name: tautulli}
            exp_annotations:
              summary: Tautulli probe metric is missing
              description: The Media/tautulli Gatus success series has been absent for 15 minutes.
      - eval_time: 20m
        alertname: TautulliProbeMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="plex", phase="Bound"}'
        values: '1x14'
      - series: 'kube_persistentvolumeclaim_status_phase{namespace="media", persistentvolumeclaim="tautulli", phase="Bound"}'
        values: '_x8 1x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts: []
      - eval_time: 6m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Tautulli database claim is absent or unbound
              description: The media/tautulli PVC has not reported Bound for five minutes; watch history persistence is at risk.
      - eval_time: 10m
        alertname: TautulliPersistentVolumeClaimNotBound
        exp_alerts: []

  # Scanning shape: one connection per second carrying only two flows each.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '0x9 120+120x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Off-cluster connections to Plex are carrying almost no traffic
              description: Off-cluster clients opened connections to Plex that carried fewer than 3 flows each for 10 minutes, which is what scanning looks like.
  # Real sessions: same connection rate, ten flows each. Must stay silent.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '0x9 600+600x25'
    alert_rule_test:
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
  # Idle: no connections at all, so the ratio is undefined. The guard must hold it silent.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '100x35'
    alert_rule_test:
      - eval_time: 32m
        alertname: PlexRemoteProbeSurge
        exp_alerts: []
  # Detection itself goes blind.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/other", node="nuc1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, destination: media/plex}
            exp_annotations:
              summary: Hubble flow metrics for Plex are missing
              description: No Hubble flow series for Plex has been present for 15 minutes, so remote-access detection is blind.
  # The tcp companion must fire on its own: flow metric present, tcp metric absent.
  # This is the exact failure PlexRemoteFlowMetricsMissing cannot see, because it only
  # watches hubble_flows_processed_total.
  - interval: 1m
    input_series:
      - series: 'hubble_flows_processed_total{destination="media/plex", source="reserved:world", node="nuc1"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, destination: media/plex}
            exp_annotations:
              summary: Hubble TCP flag metrics for Plex are missing
              description: No Hubble TCP flag series for Plex has been present for 15 minutes, so both remote-access detection rules are blind.
      # The flow companion must stay silent in this same window: the flow series is
      # present, so only detection's tcp half is blind, not both.
      - eval_time: 20m
        alertname: PlexRemoteFlowMetricsMissing
        exp_alerts: []
  # The tcp companion must stay silent when the tcp metric is present, even though the
  # only present series carries no `reserved:world` source — it is deliberately not
  # qualified by `source`, because absence of the world series alone is the normal
  # state today and must never alert.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 60+60x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: PlexRemoteTcpMetricsMissing
        exp_alerts: []
  # Corridor rule: sustained full-handshake abuse at 1.5 connections/sec, below the
  # flood rule's threshold of 5 and above the probe rule's implicit reach, must fire.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 90+90x25'
    alert_rule_test:
      - eval_time: 18m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts: []
      - eval_time: 32m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Off-cluster connection rate to Plex is elevated
              description: Off-cluster clients opened more than 1 connection per second to Plex for 10 minutes, which is above any plausible legitimate remote load.
  # Internal clients must never trip it, however busy they are.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 6000+6000x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionRateElevated
        exp_alerts: []
  # The compound identity that CIDR policies produce must still match.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="cidr:192.168.0.0/16,reserved:world", flag="SYN", node="nuc1"}'
        values: '0x9 600+600x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionFlood
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Off-cluster connection rate to Plex is abnormally high
              description: Off-cluster clients opened more than 5 connections per second to Plex for 5 minutes.
  # Internal clients must never trip it, however busy they are.
  - interval: 1m
    input_series:
      - series: 'hubble_tcp_flags_total{destination="media/plex", source="k8s:app.kubernetes.io/name=envoy,k8s:io.kubernetes.pod.namespace=envoy-gateway-system", flag="SYN", node="nuc1"}'
        values: '0x9 6000+6000x15'
    alert_rule_test:
      - eval_time: 22m
        alertname: PlexRemoteConnectionFlood
        exp_alerts: []
