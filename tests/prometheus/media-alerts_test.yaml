rule_files:
  - encode-benchmark.yaml
  - media.yaml
  - qbittorrent.yaml
evaluation_interval: 1m
tests:
  # --- Media Integration health alert coverage ---

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 17m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, group: Media Integration, name: prowlarr-native-health}
            exp_annotations:
              summary: Prowlarr authenticated health API is unavailable
              description: The authenticated Prowlarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
      - eval_time: 19m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: LidarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrSonarrServiceReadFailed
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrRadarrServiceReadFailed
        exp_alerts: []
      - eval_time: 21m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 17m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, group: Media Integration, name: sonarr-native-health}
            exp_annotations:
              summary: Sonarr authenticated health API is unavailable
              description: The authenticated Sonarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
      - eval_time: 19m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: LidarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrSonarrServiceReadFailed
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrRadarrServiceReadFailed
        exp_alerts: []
      - eval_time: 21m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
        values: '1x24'
    alert_rule_test:
      - eval_time: 17m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, group: Media Integration, name: radarr-native-health}
            exp_annotations:
              summary: Radarr authenticated health API is unavailable
              description: The authenticated Radarr health API has not returned HTTP 200 for 15 minutes. Inspect Gatus access, routing, authentication, and the application. The alert does not evaluate native health entries or identify an integration target.
      - eval_time: 19m
        alertname: ProwlarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SonarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: LidarrNativeHealthApiUnavailable
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrSonarrServiceReadFailed
        exp_alerts: []
      - eval_time: 19m
        alertname: SeerrRadarrServiceReadFailed
        exp_alerts: []
      - eval_time: 21m
        alertname: RadarrNativeHealthApiUnavailable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="prowlarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="sonarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="radarr-native-health"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="lidarr-native-health"}'
        values: '1x3 0x16 1x5'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-sonarr-service-read"}'
        values: '1x24'
      - series: 'gatus_results_endpoint_success{group="Media Integration", name="seerr-radarr-service-read"}'
