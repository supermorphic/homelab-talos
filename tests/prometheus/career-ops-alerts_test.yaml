rule_files:
- career-ops.yaml
evaluation_interval: 1m
tests:
- name: healthy idle
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 20m
    alertname: CareerOpsCVWorkStuck
    exp_alerts: []
  - eval_time: 20m
    alertname: CareerOpsCVRendersFailing
    exp_alerts: []
- name: coordinator absent entirely
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - &id001
      exp_labels:
        namespace: career-ops
        service: cv-coordinator
        severity: critical
      exp_annotations:
        summary: Career Ops CV service is down
        description: 'CV renders, uploads and downloads are blocked. Status: https://cv.lab.supermorphic.com/readyz'
- name: not ready
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: database not ready
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: renderer egress not blocked
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: scrape down
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: schema version 1 only
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="1"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: recent failures metric missing
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: overdue work metric missing
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 4m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: CareerOpsCVServiceDown
    exp_alerts:
    - *id001
- name: work stuck then resolved
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: 1x20 0x10
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 14m
    alertname: CareerOpsCVWorkStuck
    exp_alerts: []
  - eval_time: 16m
    alertname: CareerOpsCVWorkStuck
    exp_alerts:
    - exp_labels:
        namespace: career-ops
        service: cv-coordinator
        severity: warning
      exp_annotations:
        summary: Career Ops CV work is stuck
        description: 'At least one CV request is past its deadline. Status: https://cv.lab.supermorphic.com/readyz'
  - eval_time: 25m
    alertname: CareerOpsCVWorkStuck
    exp_alerts: []
  - eval_time: 16m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
- name: renders failing then resolved
  interval: 1m
  input_series:
  - series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="2"}
    values: 1x30
  - series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_renderer_egress_blocked{namespace="career-ops",service="cv-coordinator"}
    values: 1x30
  - series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x30'
  - series: cv_render_recent_failures{namespace="career-ops",service="cv-coordinator"}
    values: 0 1x10 0x19
  alert_rule_test:
  - eval_time: 3m
    alertname: CareerOpsCVRendersFailing
    exp_alerts:
    - exp_labels:
        namespace: career-ops
        service: cv-coordinator
        severity: warning
      exp_annotations:
        summary: Career Ops CV renders are failing
        description: 'A CV request exhausted its retries or failed for an infrastructure reason in the last hour. Status:
          https://cv.lab.supermorphic.com/readyz'
  - eval_time: 20m
    alertname: CareerOpsCVRendersFailing
    exp_alerts: []
  - eval_time: 3m
    alertname: CareerOpsCVServiceDown
    exp_alerts: []
