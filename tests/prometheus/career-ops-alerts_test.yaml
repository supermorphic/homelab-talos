rule_files:
- career-ops.yaml
evaluation_interval: 1m
tests:
- name: healthy idle
  interval: 1m
  input_series:
  - &id001
    series: up{namespace="career-ops",service="cv-coordinator"}
    values: 1x20
  - &id010
    series: cv_render_metrics_schema_info{namespace="career-ops",service="cv-coordinator",version="1"}
    values: 1x20
  - &id002
    series: cv_render_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x20
  - &id003
    series: cv_render_database_ready{namespace="career-ops",service="cv-coordinator"}
    values: 1x20
  - &id004
    series: cv_render_reconciliation_last_success_timestamp_seconds{namespace="career-ops",service="cv-coordinator"}
    values: 1+60x20
  - &id005
    series: cv_render_overdue_work{namespace="career-ops",service="cv-coordinator"}
    values: '0x20'
  - &id006
    series: cv_render_exhausted_retries{namespace="career-ops",service="cv-coordinator"}
    values: '0x20'
  - &id007
    series: cv_render_unavailable_artifacts{namespace="career-ops",service="cv-coordinator"}
    values: '0x20'
  - &id008
    series: cv_render_unrepairable_artifacts{namespace="career-ops",service="cv-coordinator"}
    values: '0x20'
  - &id009
    series: cv_render_unsafe_recovery{namespace="career-ops",service="cv-coordinator"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 10m
    alertname: CareerOpsCoordinatorUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsDatabaseNotReady
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsTelemetryMissing
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsReconciliationStale
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsReconciliationNotStarted
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsWorkOverdue
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsRetriesExhausted
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsArtifactsUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsArtifactsUnrepairable
    exp_alerts: []
  - eval_time: 10m
    alertname: CareerOpsRecoveryUnsafe
    exp_alerts: []
