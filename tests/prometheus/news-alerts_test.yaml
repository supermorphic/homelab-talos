- name: successful scheduler and HTTP do not hide feed failures, then recovery
  interval: 1m
  input_series:
  - series: gatus_results_endpoint_success{group="Media",name="freshrss"}
    values: 1x3200
  - series: news_database_up{namespace="news",service="freshrss"}
    values: 1x3200
  - series: kube_statefulset_status_replicas_ready{namespace="news",statefulset="news-postgresql"}
    values: 1x3200
  - series: news_refresh_last_completed_timestamp_seconds{namespace="news",service="freshrss"}
    values: 1+60x3200
  - series: news_feeds_failed{namespace="news",service="freshrss"}
    values: 1x34 0x10
  - series: news_feeds_stale{namespace="news",service="freshrss"}
    values: 1x34 0x10
  - series: news_backup_last_success_timestamp_seconds{namespace="news",service="freshrss"}
    values: 1+60x3200
  - series: longhorn_volume_last_backup_at{pvc_namespace="news",pvc="news-backups"}
