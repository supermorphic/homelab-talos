apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: flux-ready
  labels:
    homelab-talos/tier: smoke
    homelab-talos/target: cluster
    homelab-talos/suite: default
spec:
  namespace: flux-system
  concurrent: false
  timeouts:
    assert: 2m
  steps:
    - name: cluster-apps-ready
      try:
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: cluster-apps
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      catch:
        - describe:
            apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: cluster-apps
            namespace: flux-system
        - events:
            namespace: flux-system
