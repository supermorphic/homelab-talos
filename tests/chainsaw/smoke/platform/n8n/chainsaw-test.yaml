apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-n8n
  labels:
    homelab-talos/tier: smoke
    homelab-talos/target: platform
    homelab-talos/suite: platform
spec:
  # Read-only resource assertions only. Credential, DNS, HTTPS, metrics API, and
  # execution-history checks remain in the separate n8n verifier and acceptance run.
  namespace: flux-system
  concurrent: false
  timeouts:
    assert: 2m
  steps:
    - name: flux-and-workloads-ready
      try:
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: public-webhook-gateway
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: n8n-postgresql
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: n8n
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: public-webhook-route
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: n8n
                namespace: automation
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: n8n
                namespace: automation
              spec:
                replicas: 1
                strategy:
                  type: Recreate
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: n8n-postgresql
                namespace: automation
              spec:
                replicas: 1
              status:
                readyReplicas: 1
      catch:
        - events:
            namespace: automation
    - name: retained-claims-bound
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: n8n-data
                namespace: automation
              spec:
                storageClassName: longhorn
                accessModes:
                  - ReadWriteOnce
              status:
                phase: Bound
        - assert:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: n8n-postgresql-data
                namespace: automation
              spec:
                storageClassName: longhorn
                accessModes:
                  - ReadWriteOnce
              status:
                phase: Bound
        - assert:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: n8n-postgresql-backups
                namespace: automation
              spec:
                storageClassName: longhorn
                accessModes:
                  - ReadWriteOnce
              status:
                phase: Bound
      catch:
        - events:
            namespace: automation
    - name: private-and-public-routes-accepted
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: n8n
                namespace: automation
              spec:
                hostnames:
                  - n8n.lab.supermorphic.com
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: internal
                    namespace: networking
                    sectionName: https
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - kind: Service
                        name: n8n
                        port: 5678
              status:
                (parents[0].conditions[?type == 'Accepted']):
                  - status: "True"
                (parents[0].conditions[?type == 'ResolvedRefs']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: n8n-platform-canary
                namespace: networking-public
              spec:
                hostnames:
                  - hooks.lab.supermorphic.com
                parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: public-webhooks
                    namespace: networking-public
                    sectionName: https
                rules:
                  - matches:
                      - path:
                          type: Exact
                          value: /webhook/platform-canary
                    backendRefs:
                      - kind: Service
                        name: n8n
                        namespace: automation
                        port: 5678
              status:
                (parents[0].conditions[?type == 'Accepted']):
                  - status: "True"
                (parents[0].conditions[?type == 'ResolvedRefs']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1beta1
              kind: ReferenceGrant
              metadata:
                name: n8n-public-webhooks
                namespace: automation
              spec:
                from:
                  - group: gateway.networking.k8s.io
                    kind: HTTPRoute
                    namespace: networking-public
                to:
                  - group: ""
                    kind: Service
                    name: n8n
        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: hooks-lab-supermorphic-com
                namespace: networking-public
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      catch:
        - events:
            namespace: networking-public
    - name: monitoring-resources-loaded
      try:
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: n8n
                namespace: automation
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: n8n-postgresql
                namespace: automation
        - assert:
            resource:
              apiVersion: monitoring.coreos.com/v1
              kind: PrometheusRule
              metadata:
                name: n8n
                namespace: monitoring
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: monitoring
                labels:
                  grafana_dashboard: "1"
              data:
                n8n-postgresql.json: (length(@) > `0`)
      catch:
        - events:
            namespace: monitoring
