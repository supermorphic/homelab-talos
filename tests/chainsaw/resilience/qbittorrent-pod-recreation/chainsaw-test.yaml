apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: qbittorrent-pod-recreation
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: qbittorrent-pod-recreation
    homelab-talos/suite: qbittorrent-pod-recreation
spec:
  namespace: flux-system
  concurrent: false
  steps:
    - name: prepare-structural-gate-and-persistence-marker
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh prepare .kube/config
    - name: delete-qbittorrent-pod
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh disrupt .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh recover .kube/config
    - name: observe-startup-gate
      try:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh observe .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh recover .kube/config
    - name: deployment-available-after-recreation
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: qbittorrent
                namespace: media
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh recover .kube/config
    - name: vpn-and-app-containers-ready
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: media
                labels:
                  app.kubernetes.io/name: qbittorrent
              status:
                (initContainerStatuses[?name == 'gluetun']):
                  - ready: true
                (containerStatuses[?name == 'app']):
                  - ready: true
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh recover .kube/config
    - name: verify-pvc-longhorn-and-marker-persistence
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh assert .kube/config
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
        - podLogs:
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
        - events:
            namespace: media
      finally:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-pod-recreation.sh recover .kube/config
