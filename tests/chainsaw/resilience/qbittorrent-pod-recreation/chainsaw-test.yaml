apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: qbittorrent-pod-recreation
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: qbittorrent-pod-recreation
    homelab-talos/suite: qbittorrent-pod-recreation
spec:
  namespace: flux-system
  concurrent: false
  catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: qbittorrent
        namespace: media
    - describe:
        apiVersion: v1
        kind: PersistentVolumeClaim
        name: qbittorrent
        namespace: media
    - podLogs:
        namespace: media
        selector: app.kubernetes.io/name=qbittorrent
    - events:
        namespace: media
  steps:
    - name: establish-native-structural-gate-and-python-baseline
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: media
                labels:
                  app.kubernetes.io/name: qbittorrent
              spec:
                (initContainers[?name == 'gluetun']):
                  - restartPolicy: Always
                    startupProbe: {}
                (containers[?name == 'app']):
                  - name: app
        - assert:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: qbittorrent
                namespace: media
              status:
                phase: Bound
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_pod_recreation.py prepare .kube/config
      cleanup:
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
            timeout: 6m
            for:
              condition:
                name: Available
                value: "true"
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_pod_recreation.py cleanup .kube/config
    - name: guard-and-delete-qbittorrent-pod-natively
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              scripts/test/safety/require-chaos-confirmation.sh
              qbittorrent-pod-recreation
        - delete:
            ref:
              apiVersion: v1
              kind: Pod
              namespace: media
              labels:
                app.kubernetes.io/name: qbittorrent
    - name: sample-vpn-before-app-startup-order
      try:
        - script:
            timeout: 6m
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_pod_recreation.py observe .kube/config
    - name: wait-for-native-kubernetes-readiness
      try:
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
            timeout: 6m
            for:
              condition:
                name: Available
                value: "true"
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: media
                labels:
                  app.kubernetes.io/name: qbittorrent
              status:
                (initContainerStatuses[?name == 'gluetun']):
                  - ready: true
                (containerStatuses[?name == 'app']):
                  - ready: true
    - name: construct-persistence-and-longhorn-evidence
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_pod_recreation.py verify .kube/config
