apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: plex-node-reboot
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: plex-node-reboot
    homelab-talos/suite: plex-node-reboot
spec:
  # Operator-only, DOUBLE-GATED (CLUSTER_CHAOS_CONFIRM + TALOS_REBOOT_CONFIRM). Reboots the
  # Talos node hosting Plex via the authoritative `just bootstrap reboot` recipe (which owns
  # the quorum/TPM/etcd/foundation recovery) and proves Plex recovers with its config volume
  # re-attached + SMB re-mounted. Chainsaw wraps the node-lifecycle primitive; it does not
  # reimplement it (Decision 3).
  namespace: flux-system
  concurrent: false
  steps:
    - name: reboot-plex-node-and-verify-workload-recovery
      try:
        # Guard step 2: re-invoke the chaos guard before any mutation.
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/safety/require-chaos-confirmation.sh plex-node-reboot
        # The experiment. The reboot recipe blocks until the node + cluster fully recover;
        # then the orchestrator asserts Plex workload recovery. Generous timeout for the
        # reboot + node return + recovery.
        - script:
            timeout: 20m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-node-reboot.sh .kube/config
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            name: plex
            namespace: media
        - podLogs:
            namespace: media
            selector: app.kubernetes.io/name=plex
        - events:
            namespace: media
      finally:
        # No node cordon to undo (the reboot recipe self-recovers the node). Just ensure a
        # healthy Plex rollout as a backstop.
        - script:
            timeout: 10m
            content: kubectl --namespace media rollout status deployment/plex --timeout=8m
