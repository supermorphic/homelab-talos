apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cleanup-failure-self-test
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: cleanup-failure-self-test
    homelab-talos/suite: cleanup-failure-self-test
spec:
  # Opt-in resilience self-test (the cleanup analogue of the diagnostics-self-test). It
  # deliberately records a FAILED recovery while the primary assertion PASSES, to prove
  # end-to-end that the runner surfaces recovery.status=failed in summary.json WITHOUT
  # masking assertion.status=passed, while the overall command exits non-zero.
  # Non-destructive: it mutates no cluster state (only writes recovery.json into the run
  # dir), so no finally recovery is needed. Still chaos-gated because it dispatches
  # through the resilience tier.
  namespace: flux-system
  concurrent: false
  steps:
    - name: record-failed-recovery-without-masking-primary
      try:
        # Guard step 2: re-invoke the chaos guard before doing anything (belt-and-suspenders).
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/safety/require-chaos-confirmation.sh cleanup-failure-self-test
        # Deliberately record a failed recovery, then exit 0 so the PRIMARY assertion
        # passes. The runner reads this recovery.json and must record recovery=failed
        # separately. HOMELAB_TEST_RUN_DIR is exported by run-chainsaw.sh.
        - script:
            content: |
              [ -n "$HOMELAB_TEST_RUN_DIR" ] || { echo 'HOMELAB_TEST_RUN_DIR not set' >&2; exit 1; }
              printf '{"status":"failed","reason":"forced cleanup-failure self-test"}\n' >"$HOMELAB_TEST_RUN_DIR/recovery.json"
              echo 'Self-test primary assertion passed; recorded a deliberately failed recovery.'
      catch:
        - events:
            namespace: flux-system
