apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: plex-cross-node-reschedule
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: plex-cross-node-reschedule
    homelab-talos/suite: plex-cross-node-reschedule
spec:
  namespace: flux-system
  concurrent: false
  catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: plex
        namespace: media
    - describe:
        apiVersion: v1
        kind: PersistentVolumeClaim
        name: plex
        namespace: media
    - podLogs:
        namespace: media
        selector: app.kubernetes.io/name=plex
    - events:
        namespace: media
  steps:
    - name: establish-native-readiness-and-python-baseline
      try:
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=plex
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
        - assert:
            resource:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: plex
                namespace: media
              status:
                phase: Bound
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py prepare .kube/config
    - name: guard-and-cordon-exact-source-node
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              scripts/test/safety/require-chaos-confirmation.sh
              plex-cross-node-reschedule
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py cordon .kube/config
      cleanup:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py cleanup-node .kube/config
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            name: plex
            namespace: media
            timeout: 6m
            for:
              condition:
                name: Available
                value: "true"
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=plex
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py cleanup-marker .kube/config
    - name: delete-plex-pod-natively
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Pod
              namespace: media
              labels:
                app.kubernetes.io/name: plex
    - name: wait-for-native-kubernetes-readiness
      try:
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            name: plex
            namespace: media
            timeout: 6m
            for:
              condition:
                name: Available
                value: "true"
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=plex
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
    - name: validate-cross-node-state
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py observe .kube/config
    - name: construct-persistence-longhorn-and-smb-evidence
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/plex_cross_node_reschedule.py verify .kube/config
