apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: plex-cross-node-reschedule
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: plex-cross-node-reschedule
    homelab-talos/suite: plex-cross-node-reschedule
spec:
  namespace: flux-system
  concurrent: false
  steps:
    - name: prepare-plex-storage-and-marker
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh prepare .kube/config
    - name: cordon-node-and-delete-plex-pod
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh disrupt .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
    - name: observe-ready-replacement-on-landing-node
      try:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh observe .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
    - name: deployment-available-on-landing-node
      try:
        - assert:
            timeout: 6m
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plex
                namespace: media
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
    - name: plex-pod-ready
      try:
        - assert:
            timeout: 6m
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: media
                labels:
                  app.kubernetes.io/name: plex
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
    - name: verify-cross-node-longhorn-marker-and-smb
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh assert .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            name: plex
            namespace: media
        - podLogs:
            namespace: media
            selector: app.kubernetes.io/name=plex
        - events:
            namespace: media
      finally:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/plex-cross-node-reschedule.sh recover .kube/config
