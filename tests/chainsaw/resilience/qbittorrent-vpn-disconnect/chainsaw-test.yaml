apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: qbittorrent-vpn-disconnect
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: qbittorrent-vpn-disconnect
    homelab-talos/suite: qbittorrent-vpn-disconnect
spec:
  # Resilience is operator-only and chaos-gated; it is NOT subject to the smoke read-only
  # Conftest policy, so command/script ops are allowed. The destructive control loop lives
  # in the guarded bash orchestrator (Decision 3: just does guard + dispatch only).
  namespace: flux-system
  concurrent: false
  steps:
    - name: controlled-vpn-stop-recovery
      try:
        # Guard step 2: the scenario's first operation re-invokes the chaos guard before
        # any mutation (belt-and-suspenders with the dispatch + recipe token checks).
        # Chainsaw runs script ops from its own working dir, so cd to the repo root that
        # the runner exported before invoking repo-relative scripts.
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/safety/require-chaos-confirmation.sh qbittorrent-vpn-disconnect
        # The experiment: baseline -> continuous capture across a controlled VPN stop ->
        # outage verdict -> pod-recreation recovery -> recovery verification. Exit code is
        # the primary assertion; recovery outcome is written to recovery.json separately.
        - script:
            timeout: 10m
            content: cd "$HOMELAB_REPO_ROOT" && tests/probes/vpn/orchestrate-vpn-disconnect.sh .kube/config
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
        - podLogs:
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
        - events:
            namespace: media
      finally:
        # Guard step 5: guaranteed teardown — force a fresh healthy tunnel (pod recreation
        # is the exact recovery operation) even if the orchestrator was killed mid-run.
        - script:
            timeout: 6m
            content: |
              kubectl --namespace media delete pod --selector app.kubernetes.io/name=qbittorrent --wait=false >/dev/null 2>&1 || true
              kubectl --namespace media rollout status deployment/qbittorrent --timeout=5m
