apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: qbittorrent-vpn-disconnect
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: qbittorrent-vpn-disconnect
    homelab-talos/suite: qbittorrent-vpn-disconnect
spec:
  namespace: flux-system
  concurrent: false
  steps:
    - name: establish-vpn-baseline
      try:
        - script:
            timeout: 2m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh baseline .kube/config
    - name: capture-and-stop-vpn
      try:
        - script:
            timeout: 2m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh disrupt .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
    - name: assert-fail-closed-without-wan-leak
      try:
        - script:
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh assert-fail-closed .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
    - name: recreate-pod-and-recover-vpn
      try:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
    - name: deployment-available-after-recovery
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: qbittorrent
                namespace: media
              status:
                (conditions[?type == 'Available']):
                  - status: "True"
      catch:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
    - name: verify-final-vpn-egress
      try:
        - script:
            timeout: 2m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh verify .kube/config
      catch:
        - describe:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
        - podLogs:
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
        - events:
            namespace: media
      finally:
        - script:
            timeout: 6m
            content: cd "$HOMELAB_REPO_ROOT" && scripts/test/scenarios/qbittorrent-vpn-disconnect.sh recover .kube/config
