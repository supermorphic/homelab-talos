apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: qbittorrent-vpn-disconnect
  labels:
    homelab-talos/tier: resilience
    homelab-talos/target: qbittorrent-vpn-disconnect
    homelab-talos/suite: qbittorrent-vpn-disconnect
spec:
  namespace: flux-system
  concurrent: false
  catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: qbittorrent
        namespace: media
    - podLogs:
        namespace: media
        selector: app.kubernetes.io/name=qbittorrent
    - events:
        namespace: media
  steps:
    - name: establish-python-vpn-baseline
      try:
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              scripts/test/safety/require-chaos-confirmation.sh
              qbittorrent-vpn-disconnect
        - script:
            timeout: 2m
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_vpn_disconnect.py baseline .kube/config
    - name: capture-stop-analyze-and-recover-vpn
      try:
        - script:
            timeout: 2m
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_vpn_disconnect.py disrupt .kube/config
        - script:
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_vpn_disconnect.py
              assert-fail-closed .kube/config
      finally:
        - delete:
            ref:
              apiVersion: v1
              kind: Pod
              namespace: media
              labels:
                app.kubernetes.io/name: qbittorrent
        - wait:
            apiVersion: apps/v1
            kind: Deployment
            name: qbittorrent
            namespace: media
            timeout: 6m
            for:
              condition:
                name: Available
                value: "true"
        - wait:
            apiVersion: v1
            kind: Pod
            namespace: media
            selector: app.kubernetes.io/name=qbittorrent
            timeout: 6m
            for:
              condition:
                name: Ready
                value: "true"
        - script:
            timeout: 2m
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_vpn_disconnect.py cleanup .kube/config
    - name: analyze-recovered-vpn-and-construct-evidence
      try:
        - script:
            timeout: 2m
            content: >-
              cd "$HOMELAB_REPO_ROOT" &&
              uv run --locked --no-dev python
              scripts/test/scenarios/qbittorrent_vpn_disconnect.py verify .kube/config
