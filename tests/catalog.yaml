schema_version: 2

# Stable assurance metadata. Phase 2 makes this catalog authoritative for `just test`
# dispatch and canonical Chainsaw artifacts. Phase 3 will attach the remaining runners
# to the same result coordinator.
executions:
  ci:
    - validation.repo-lint
    - validation.repo-verify
    - validation.links
    - validation.test-harness
    - validation.policy-unit
    - validation.kubeconform
    - validation.cilium
    - validation.metrics-server
    - validation.flux
    - validation.foundation
    - validation.storage
    - validation.csi-driver-smb
    - validation.media-storage
    - validation.plex
    - validation.intel-gpu-plugin
    - validation.qbittorrent
    - validation.arr
    - validation.qbit-manage
    - validation.seerr
    - validation.tautulli
    - validation.media-alerts
    - validation.flaresolverr
    - validation.media-policy
    - validation.monitoring
    - validation.gatus
    - validation.portainer
    - validation.portainer-policy
    - validation.test-reports
    - validation.homepage
    - validation.trivy
    - validation.tailscale-operator
    - validation.tailscale-subnet-router
    - validation.tailscale-alerts
    - validation.ntfy
    - validation.alertmanager-ntfy

campaigns:
  validation:
    description: Cluster-independent repository validation.
    mutates_cluster: false
    disruptive: false
    members:
      - validation.ci
  verification:
    description: Read-only live acceptance checks for deployed services.
    execution_mode: operator-published
    mutates_cluster: false
    disruptive: false
    members:
      - verification.metrics-server
      - verification.cilium
      - verification.flux
      - verification.foundation
      - verification.storage
      - verification.csi-driver-smb
      - verification.media-storage
      - verification.plex
      - verification.intel-gpu-plugin
      - verification.qbittorrent
      - verification.prowlarr
      - verification.sonarr
      - verification.radarr
      - verification.lidarr
      - verification.seerr
      - verification.tautulli
      - verification.flaresolverr
      - verification.qbit-manage
      - verification.monitoring
      - verification.gatus
      - verification.portainer
      - verification.test-reports
      - verification.homepage
      - verification.trivy
      - verification.tailscale-operator
      - verification.tailscale-subnet-router
      - verification.ntfy
      - verification.alertmanager-ntfy
      - verification.agent-access
  scoped-verification:
    description: Read-only and reduced-privilege live checks runnable with worktree credentials.
    execution_mode: scoped-local
    mutates_cluster: false
    disruptive: false
    access:
      required_read_rules:
        apiextensions.k8s.io: [customresourcedefinitions]
        apiregistration.k8s.io: [apiservices]
        aquasecurity.github.io: [vulnerabilityreports]
        cert-manager.io: [certificates, clusterissuers]
        cilium.io: [ciliumclusterwidenetworkpolicies, ciliumendpoints, ciliumendpointslices, ciliumidentities, ciliumnetworkpolicies, ciliumnodes]
        gateway.networking.k8s.io: [gatewayclasses, gateways, httproutes]
        gatus.io: [endpoints]
        helm.toolkit.fluxcd.io: [helmreleases]
        kustomize.toolkit.fluxcd.io: [kustomizations]
        longhorn.io: [backuptargets, nodes, recurringjobs, volumes]
        metallb.io: [ipaddresspools]
        metrics.k8s.io: [nodes, pods]
        monitoring.coreos.com: [prometheusrules, servicemonitors]
        notification.toolkit.fluxcd.io: [alerts, providers, receivers]
        rbac.authorization.k8s.io: [clusterrolebindings, clusterroles, rolebindings, roles]
        source.toolkit.fluxcd.io: [buckets, gitrepositories, helmcharts, helmrepositories, ocirepositories]
        storage.k8s.io: [csidrivers, storageclasses]
        tailscale.com: [connectors, dnsconfigs, proxyclasses, proxygroups]
    members:
      - verification.metrics-server
      - verification.cilium
      - verification.flux
      - verification.foundation
      - verification.storage
      - verification.csi-driver-smb
      - verification.media-storage
      - verification.plex
      - verification.intel-gpu-plugin
      - verification.qbittorrent
      - verification.prowlarr
      - verification.sonarr
      - verification.radarr
      - verification.lidarr
      - verification.seerr
      - verification.tautulli
      - verification.flaresolverr
      - verification.qbit-manage
      - verification.monitoring
      - verification.gatus
      - verification.portainer
      - verification.test-reports
      - verification.homepage
      - verification.trivy
      - verification.tailscale-operator
      - verification.tailscale-subnet-router
      - verification.ntfy
      - verification.alertmanager-ntfy
      - verification.agent-access
  smoke:
    description: Non-overlapping aggregate entrypoints covering every smoke scenario.
    mutates_cluster: false
    disruptive: false
    members:
      - chainsaw.smoke.cluster.default
      - chainsaw.smoke.media.qbittorrent
      - chainsaw.smoke.media.qbit-manage
      - chainsaw.smoke.platform.all
    coverage:
      - chainsaw.smoke.cluster.default
      - chainsaw.smoke.cluster.flux-ready
      - chainsaw.smoke.media.qbittorrent
      - chainsaw.smoke.media.qbit-manage
      - chainsaw.smoke.platform.all
      - chainsaw.smoke.platform.cluster
      - chainsaw.smoke.platform.flux
      - chainsaw.smoke.platform.gateway
      - chainsaw.smoke.platform.dns
      - chainsaw.smoke.platform.cilium
      - chainsaw.smoke.platform.longhorn
      - chainsaw.smoke.platform.portainer
      - chainsaw.smoke.platform.smb
      - chainsaw.smoke.platform.tailscale
  integration:
    description: Focused state-changing integration tests.
    mutates_cluster: true
    disruptive: false
    members:
      - test.cilium-connectivity
      - test.storage-provisioning
      - test.flux-canary
      - test.integration.media-hardlink
  e2e:
    description: State-changing end-to-end functional tests.
    mutates_cluster: true
    disruptive: false
    members:
      - test.e2e.flux-alert-delivery
      - test.e2e.qbit-manage-policy
  resilience:
    description: Ordered disruptive recovery tests.
    mutates_cluster: true
    disruptive: true
    members:
      - test.flux-restart
      - test.portainer-persistence
      - chainsaw.resilience.qbittorrent-vpn-disconnect
      - chainsaw.resilience.qbittorrent-pod-recreation
      - chainsaw.resilience.plex-cross-node-reschedule
      - chainsaw.resilience.test-reports-persistence
      - chainsaw.resilience.tailscale-subnet-router-replica-recovery
      - test.resilience.plex-node-reboot
  probes:
    description: Network and application measurement probes.
    mutates_cluster: true
    disruptive: false
    members:
      - probe.qbittorrent
      - probe.vpn-leak
      - probe.dns-isolation
  conformance-quick:
    description: Quick Kubernetes conformance regression.
    mutates_cluster: true
    disruptive: false
    members:
      - conformance.quick
  conformance-certified:
    description: Certified Kubernetes conformance suite.
    mutates_cluster: true
    disruptive: false
    members:
      - conformance.certified
  standard:
    description: Nightly validation, smoke, E2E, and quick conformance contract.
    mutates_cluster: true
    disruptive: false
    includes:
      - validation
      - smoke
      - e2e
      - conformance-quick
  weekly:
    description: Weekly full operational coverage except certified conformance.
    mutates_cluster: true
    disruptive: true
    includes:
      - standard
      - verification
      - integration
      - probes
      - resilience
  full:
    description: Every campaign suite, including certified conformance.
    mutates_cluster: true
    disruptive: true
    includes:
      - weekly
      - conformance-certified

